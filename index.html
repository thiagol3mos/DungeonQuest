        <div class="big">${h.coins}</div>
        <button class="mini" data-act="coin" data-d="1" aria-label="Ganhar moeda">+</button>
      </div>
    </div>
    <div class="sheet">
      <h3>Mãos <span class="n" style="font-size:12px">${handsUsed(h)}/${handsFree(h)}</span></h3>
      <p class="muted small" style="margin:0 0 6px">${h.arms||2} braço${(h.arms||2)===1?"":"s"}${hasLamp() || raceT("tongue") || !COOP.holdsTorch(h) ? "" : ", um com a tocha"}</p>
      ${COOP.on() && !hasLamp() && !raceT("tongue") ? (COOP.holder() === COOP.me() ? `<button class="btn ghost" disabled>Você está segurando a tocha</button>` : `<button class="btn ghost" data-act="takeTorch">Segurar a tocha</button><p class="muted small">${esc(COOP.partner() ? COOP.partner().name : "Seu parceiro")} está com a tocha${COOP.sameRoom() ? "" : ", mas não está na mesma sala que você"}.${state.coop.own ? " Você acendeu uma tocha própria." : ""}</p>`) : ""}
      ${state.ui.armsMsg ? `<p class="toast" style="text-align:left">${esc(state.ui.armsMsg)}</p>` : ""}
      <button class="slot full eqbtn ${eq==="weapon"?"sel":""}" data-act="eqSel" data-s="weapon"><b>${esc(h.weapon.n.split(" (")[0])}</b><span class="small">Dano ${h.weapon.d}${h.weapon.two?" · Duas Mãos":""}</span>${descHTML(h.weapon, false)}</button>
      ${offs(h).map((w,k)=>`<button class="slot full eqbtn ${eq==="off"+k?"sel":""}" data-act="eqSel" data-s="off${k}" style="margin-top:8px"><b>${esc(w.n.split(" (")[0])}</b><span class="small">${w.shield ? `Escudo: −${+((w.n.match(/em (\d)\)/)||[])[1]||1)} de dano` : `Dano ${w.d}${w.two?" · Duas Mãos":""}`}</span>${descHTML(w, false)}</button>`).join("")}
      ${Array.from({length:Math.max(0, handsLeft(h))},()=>`<div class="slot" style="margin-top:8px"><b>Mão livre</b><span class="muted">vazia</span></div>`).join("")}
      ${eq==="weapon"||/^off/.test(eq||"") ? eqActs : ""}
      ${handsFree() >= 2 ? `<p class="muted small">${(h.arms||2) > 2 ? `${h.arms} braços. ` : ""}${hasLamp() ? "A Lamparina libera a mão da tocha." : raceT("tongue") ? "A língua segura a tocha." : "Uma das mãos segura a tocha."} ${offWeapons(h).length ? (attacksPerTurn(h) > 1 ? `Como ${hasClass("Multidestro")?"Multidestro":"Ambidestro"}, ${attacksPerTurn(h)} armas atacam no mesmo turno.` : "No combate, você escolhe com qual arma atacar.") : ""}</p>` : ""}
    </div>
  ${partySheetHTML()}
  <div class="sheet"><h3>Armadura</h3><div class="slots">${armor}</div>${eq && eq!=="weapon" && !/^off/.test(eq) ? eqActs : ""}${wearing(/^Chapéu do Bobo/) ? `<p class="muted small">Com o Chapéu do Bobo você não consegue Mover em Silêncio.</p>` : ""}</div>
  <div class="sheet">
    ${foldHead("bag", "Mochila", h.bag.length ? bagTools() : "")}
    ${isFolded("bag") ? "" : `${bag || (bf && h.bag.length ? `<p class="muted small">Nenhum item de ${bf.n.toLowerCase()} na mochila.</p>` : `<p class="muted small">Vazia. Itens encontrados nas masmorras aparecem aqui.</p>`)}
    ${h.provisions ? `<div class="row" style="align-items:center;justify-content:space-between"><p class="small">Provisões: ${N(h.provisions)}</p>${raceT("fungo") ? `<button class="use" data-act="eat">Comer (1d6 PV)</button>` : ""}</div>` : ""}`}
  </div>
  ${spells.length ? `<div class="sheet">${foldHead("spells","Magias")}${isFolded("spells") ? "" : `${state.ui.recharge ? `<div class="sheet dashed" style="padding:10px"><p class="small">Recarregar Mana: escolha a magia que recupera 1 uso.</p><div class="dlist">${rechargeable().map(n=>`<button class="dbtn" data-act="rechargeOut" data-n="${esc(n)}">${n} ${h.spells[n].left}/${h.spells[n].max}</button>`).join("")}</div><button class="btn ghost" data-act="rechargeOutCancel">Cancelar</button></div>` : ""}${state.ui.stonePick ? `<div class="sheet dashed" style="padding:10px"><p class="small">Armadura de Pedra: escolha a peça que a magia vai criar (5 PV).</p><div class="dlist">${freeSlots().map(sl=>`<button class="dbtn" data-act="stoneOut" data-s="${sl}">${sl}</button>`).join("")}</div><button class="btn ghost" data-act="stoneOutCancel">Cancelar</button></div>` : ""}${h.shield ? `<p class="small">Escudo Mágico ativo: absorve ${h.shield} de dano.</p>` : ""}${spellHTML}<p class="muted small">Magias gastas voltam ao descansar na cidade.</p>`}</div>` : ""}
  ${(()=>{ const x = H(h), kills = Object.entries(x.kills).sort((a,b)=>b[1]-a[1]);
    const lost = state.cemetery.filter(g=>!g.retired && g.name!==h.name).length;
    const best = Object.entries(x.sets).sort((a,b)=>b[1].length-a[1].length)[0];
    const line = (k,v) => `<span>${k}</span><b>${v}</b>`;
    if(isFolded("hist")) return `<div class="sheet">${foldHead("hist","Histórico")}</div>`;
    return `<div class="sheet">${foldHead("hist","Histórico")}
    <div class="hist">
      ${line("Monstros abatidos", N(x.total))}
      ${kills.map(([n,q])=>`<span class="small" style="padding-left:12px">${esc(n)}</span><b class="small">${N(q)}</b>`).join("")}
      ${line("Chefes derrotados", N(x.bosses))}
      ${line("Masmorras concluídas", N(x.dungeons))}
      ${line("Fechaduras abertas", N(x.locks))}
      ${line("Itens vendidos", N(x.sold))}
      ${line("Magias e pergaminhos usados", N(x.magic))}
      ${line("Magias conhecidas", N(knownSpells(h).length))}
      ${line("Armaduras destruídas", N(x.armorLost))}
      ${line("Combates com mortos-vivos", N(x.undead))}
      ${line("Cadáveres de aventureiros revistados", N(x.avenged))}
      ${line("Aventureiros perdidos", N(lost))}
      ${line("Maior conjunto de armadura", best ? `${best[1].length}/6` : "0/6")}
    </div>
    ${best ? `<p class="muted small">Conjunto mais completo: ${esc(best[0])}.</p>` : ""}</div>`; })()}
  <div class="sheet">
    ${foldHead("adv","Vantagens")}
    ${isFolded("adv") ? "" : `<p class="adv"><b>${R(h.race).n}:</b> ${raceAdvHTML(R(h.race))}</p>
    ${h.race2 && R(h.race2) ? `<p class="adv"><b>${R(h.race2).n} (herdada):</b> ${raceAdvHTML(R(h.race2))}</p>` : ""}
    <p class="adv"><b>${CLASSES[h.cls].n}:</b> ${CLASSES[h.cls].adv}</p>
    ${(h.adv||[]).map(n=>`<p class="adv"><b>${n}:</b> ${ADV_BY_NAME[n].adv}${ADV_BY_NAME[n].how ? ` <span class="muted small">${ADV_BY_NAME[n].how}</span>` : ""}</p>`).join("")}`}
  </div>
  ${state.ui.confirmDeath ? `
    <div class="sheet dashed">
      <label class="label" for="deathCause">Causa da morte</label>
      <input type="text" id="deathCause" maxlength="60" placeholder="Ex.: Devorado por 4 Goblins">
      <div class="row"><button class="btn ghost" data-act="cancelDeath">Ainda não</button><button class="btn" data-act="die">Enterrar</button></div>
    </div>` : `<button class="btn ghost" data-act="askDeath">Registrar morte</button>`}`;
}

/* masmorra: sorteio */
function viewDungeon(){
  const d = state.dungeon;
  const canNew = !d || !d.inside;
  return `
  ${bar("Masmorra","sheet")}
  <div class="sheet">
    <p class="muted small">Na taverna, alguém sussurra o nome de uma masmorra. Role três dados: o tipo, a segunda e a terceira parte do nome.</p>
    <div class="tri">${["Tipo","Segunda","Terceira"].map((l,i)=>`<div><div class="tray" id="t${i}"></div><span class="label">${l}</span></div>`).join("")}</div>
  </div>
  ${d ? `
    <div class="sheet">
      <span class="label" style="text-align:center">${DUNGEONS[d.type].n}${d.complete ? " · completada" : ""}</span>
      <p class="dname">${d.name}</p>
      <p class="intro">${DUNGEONS[d.type].intro}</p>
      ${d.corpses.length ? `<p class="note">Há ${d.corpses.length===1?"um cadáver":d.corpses.length+" cadáveres"} de aventureiros seus lá dentro, com as mochilas.</p>` : ""}
    </div>
    ${d.complete ? "" : `<button class="btn" data-act="enter">${d.visits ? "Voltar para a masmorra" : "Entrar na masmorra"}</button>`}
    ${state.ui.confirmReroll ? `<div class="sheet dashed"><p>Procurar outra masmorra abandona ${d.name}${d.corpses.length?" e os cadáveres lá dentro":""}.</p>
       <div class="row"><button class="btn ghost" data-act="cancelReroll">Manter</button><button class="btn" data-act="rollDungeon">Procurar outra</button></div></div>`
      : `<button class="btn ghost" data-act="askReroll">Procurar outra masmorra</button>`}`
  : `<button class="btn" data-act="rollDungeon">Rolar 3d6</button>`}
  ${coopPanel()}`;
}
function coopPanel(){
  const msg = state.ui.coopMsg ? `<p class="toast">${esc(state.ui.coopMsg)}</p>` : "";
  if(COOP.on()){
    const p = COOP.partner();
    const st = !p ? "aguardando alguém entrar com o código" : p.dead ? `${esc(p.name)} morreu` : !COOP.online(p) ? `${esc(p.name)} está desconectado` : p.inside ? `${esc(p.name)} está na masmorra` : `${esc(p.name)} está na cidade`;
    return `<div class="sheet"><h3>Jogo em dupla</h3>
      <p>Código da sala: <b class="num" style="font-size:22px;letter-spacing:.15em">${esc(state.coop.code)}</b></p>
      <p class="small">${st}.</p>
      ${msg}<button class="btn ghost" data-act="coopLeave">Sair da dupla</button></div>`;
  }
  if(!NET.ready()) return `<div class="sheet dashed"><h3>Jogo em dupla</h3><p class="muted small">O servidor do jogo em dupla ainda não foi configurado.</p></div>`;
  return `<div class="sheet"><h3>Jogo em dupla</h3>
    <p class="muted small">Explore esta masmorra junto com um amigo, cada um no seu aparelho.</p>
    ${state.dungeon && !state.dungeon.inside ? `<button class="btn ghost" data-act="coopCreate">Criar sala com esta masmorra</button>` : ""}
    <label class="label" for="coopCode">Entrar na sala de um amigo</label>
    <div class="row"><input type="text" id="coopCode" maxlength="4" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off" spellcheck="false" style="text-transform:uppercase"><button class="btn" data-act="coopJoin">Entrar</button></div>
    ${msg}</div>`;
}

/* masmorra: exploração */
function monCard(g){
  const groups = [g, ...(g.extra||[])];
  return groups.map(x=>`
    <div class="mon">
      <canvas class="monpic" width="48" height="40" data-mon="${esc(monKey(x))}" data-boss="${x.boss?1:0}"></canvas>
      <span class="who">${x.boss ? "Chefe: " : ""}${x.list.length>1 ? N(x.list.length)+" " : ""}${x.name}</span>
      <div class="stats"><span class="chip solid">${N(x.pv)} PV${x.list.length>1?" cada":""}</span><span class="chip">Dano ${N(x.dano)}</span></div>
      ${traitsHTML(x.tr)}
    </div>`).join("");
}
function viewExplore(){
  const d = state.dungeon, h = state.hero;
  if(!d || !d.inside || !h) return viewSheet();
  const lv = LV(), seg = curSeg();
  const isBlocked = blocked(seg);
  const acts = [];
  const msg = state.ui.msg; state.ui.msg = null;
  const tele = state.ui.tele;

  // monstros
  let monHTML = "";
  if(seg.mon){
    const g = seg.mon;
    const who = g.sneak ? "Eles ainda não te viram." : g.boss ? "Você encontrou o Chefe da Masmorra. Você ataca primeiro." : g.first === "hero" ? "Você ataca primeiro." : g.broke ? "Você quebrou a porta e fez barulho. Os monstros atacam primeiro." : "Os monstros te viram. Eles atacam primeiro.";
    monHTML = `<div class="stack" style="gap:8px">${monCard(g)}<p class="small">${who}</p>
</div>`;
    if(isBlocked){
      if(raceT("coutim") && !g.boss && [g, ...(g.extra||[])].every(x=>/Espólios/.test(x.tr||""))) acts.push(`<button class="btn ghost" data-act="coutim">Ignorar o combate e pegar os espólios</button>`);
      if(g.first==="hero" && !g.sneakTried && !g.boss && !seg.final && !wearing(/^Chapéu do Bobo/) && !raceT("noSneak") && !hasAlly("Cachorro")) acts.push(`<button class="btn ghost" data-act="sneak">Mover em Silêncio <small>(1 tocha)</small></button>`);
      acts.unshift(`<button class="btn" data-act="fight">Lutar!</button>`);
      acts.push(`<button class="btn ghost" data-act="go" data-to="sheet">Abrir ficha</button>`);
    } else acts.push(`<button class="btn ghost" data-act="fight" data-surprise="1">Atacar de surpresa</button>`);
  }

  // portas
  const closed = seg.doors.map(id=>lv.doors[id]).filter(dd=>dd.st==="closed"||dd.st==="locked");
  const selDoor = state.ui.selDoor && lv.doors[state.ui.selDoor];
  let popHTML = "";
  let doorsHTML = "";
  if(!isBlocked && closed.length){
    const count = {};
    doorsHTML = `<span class="label">Portas fechadas</span><div class="dlist">${closed.map(dd=>{
      count[dd.dir] = (count[dd.dir]||0)+1;
      const same = closed.filter(o=>o.dir===dd.dir).length;
      const lab = `Porta ${DIRNAME[dd.dir]}${same>1?" "+count[dd.dir]:""}${dd.st==="locked"?" (trancada)":""}${isBossDoor(lv, dd)?" · Chefe":""}`;
      return `<button class="dbtn ${selDoor&&selDoor.id===dd.id?"sel":""}" data-act="selDoor" data-id="${dd.id}">${lab}</button>`;
    }).join("")}</div>`;
    if(selDoor && selDoor.seg===seg.id){
      const chav0 = freeLock();
      popHTML = selDoor.st==="closed"
        ? `<button class="pbtn" data-act="openDoor" data-id="${selDoor.id}">Abrir porta <small>(1 tocha)</small></button>`
        : `<button class="pbtn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav0?"sem tocha":"+1 tocha"})</small></button>
           <button class="pbtn alt" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar</button>
           ${keyIdx() >= 0 ? `<button class="pbtn alt" data-act="unlock" data-how="key" data-id="${selDoor.id}">Chave</button>` : ""}`;
      if(isBossDoor(lv, selDoor)){ popHTML = `<span class="pwarn">O Chefe está atrás desta porta</span>` + popHTML; acts.push(`<p class="note">Esta é a última porta do nível e não há escada para descer. Ao abri-la, você entra na Sala Final e enfrenta o Chefe da Masmorra.</p>`); }
      if(selDoor.st==="closed") acts.push(`<button class="btn" data-act="openDoor" data-id="${selDoor.id}">Abrir porta <small>(1 tocha)</small></button>`);
      else {
        const chav = freeLock();
        acts.push(`<button class="btn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav?"sem tocha extra":"+1 tocha"})</small></button>`);
        acts.push(`<button class="btn ghost" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar porta <small>(faz barulho)</small></button>`);
        if(keyIdx() >= 0) acts.push(`<button class="btn ghost" data-act="unlock" data-how="key" data-id="${selDoor.id}">Usar chave</button>`);
      }
    }
  }
  const selObj = !tele && state.ui.selObj;
  if(selObj === "mon" && seg.mon){
    const g = seg.mon;
    popHTML = isBlocked
      ? `<button class="pbtn" data-act="fight">Lutar!</button>${g.first==="hero" && !g.sneakTried && !g.boss && !seg.final && !wearing(/^Chapéu do Bobo/) && !raceT("noSneak") && !hasAlly("Cachorro") ? `<button class="pbtn alt" data-act="sneak">Mover em Silêncio <small>(1 tocha)</small></button>` : ""}`
      : `<button class="pbtn" data-act="fight" data-surprise="1">Atacar de surpresa</button>`;
    popHTML = `<span class="pwarn">${g.qty} ${esc(g.name)}</span>` + popHTML;
  } else if(selObj === "chest" && seg.chests>0 && !isBlocked){
    popHTML = `<button class="pbtn" data-act="chest">Abrir baú</button>`;
  } else if(selObj === "exit" && seg.exit){
    const er = exitRoute();
    popHTML = isBlocked ? `<span class="pwarn">Monstros bloqueiam a saída</span>`
      : er.ok ? `<button class="pbtn" data-act="leave">Sair da masmorra</button>`
      : `<span class="pwarn">Monstros em ${esc(er.by.map(n=>n.toLowerCase()).join(" ou "))} bloqueiam o caminho</span>`;
  } else if(selObj === "stairs" && !isBlocked && (seg.down || seg.up)){
    popHTML = (seg.down ? `<button class="pbtn" data-act="descend">${d.pos.level+1>=3 ? "Descer para a Sala Final" : `Descer para o nível ${d.pos.level+1}`}</button>` : "")
      + (seg.up ? `<button class="pbtn alt" data-act="climb">Subir para o nível ${seg.up.level}</button>` : "");
  } else if(selObj){ state.ui.selObj = null; }
  if(!isBlocked){
    if(seg.loot) acts.push(`<button class="btn" data-act="loot">Pegar: ${lootText(seg.loot)}</button>`);
    if(seg.stash && seg.stash.length && !state.ui.bagFull) acts.push(`<button class="btn" data-act="takeStash">Itens deixados aqui (${seg.stash.length})</button>`);
    if(seg.chests>0) acts.push(`<button class="btn" data-act="chest">Abrir baú</button>`);
    if(seg.secret && !seg.secretTried) acts.push(`<button class="btn ghost" data-act="secret">Procurar passagem secreta <small>(1 tocha)</small></button>`);
    if(seg.k==="room" && !seg.disarmed && !seg.final) acts.push(seg.trapSeen
      ? `<button class="btn ghost" data-act="disarm">Desarmar armadilhas <small>(1 tocha)</small></button>`
      : `<button class="btn ghost" disabled>Desarmar armadilhas <small>(nenhuma armadilha à vista)</small></button>`);
    if(d.corpses.some(c=>c.level===d.pos.level && c.seg===seg.id)) acts.push(`<button class="btn" data-act="corpse">Revistar cadáver</button>`);
    if(seg.gosma && raceT("gosma")) acts.push(`<button class="btn" data-act="engulf">Engolfar um corpo <small>(recupera todos os PV)</small></button>`);
    if(seg.down) acts.push(`<button class="btn" data-act="descend">${d.pos.level+1>=3 ? "Descer para a Sala Final" : `Descer para o nível ${d.pos.level+1}`}</button>`);
    if(seg.up) acts.push(`<button class="btn ghost" data-act="climb">Subir para o nível ${seg.up.level}</button>`);
  }
  let banner = "";
  const bdoor = !d.complete && bossDoorOf(lv);
  if(bdoor && !isBlocked){
    const here = bdoor.seg === seg.id;
    banner = `<div class="banner"><b>A última porta guarda o Chefe</b>
      <p class="small">Não há escada para descer neste nível. ${here ? "A porta que resta aqui" : `A porta que resta (em ${esc(lv.segs[bdoor.seg].name.toLowerCase())})`} leva direto à Sala Final: ao abri-la, você enfrenta o Chefe da Masmorra. Prepare-se antes, ou procure passagens secretas.</p></div>`;
  }
  if(d.complete){
    banner = `<div class="banner"><b>Masmorra completada!</b><p>${esc(d.name)} foi vencida. Pegue os tesouros e volte para a cidade.</p></div>`;
  } else if(!isBlocked && levelExhausted(lv)){
    const last = lv.segs[lv.last];
    banner = `<div class="banner"><b>Não há mais portas neste nível</b>
      <p>Sem escadaria para o terceiro nível, a última sala aberta (${esc(last.name.toLowerCase())}) se torna a Sala Final. Procure passagens secretas antes, se quiser.</p>
      <button class="btn" data-act="lastFinal">Revelar o Chefe</button></div>`;
  }
  if(!isBlocked && seg.stash && seg.stash.length && state.ui.bagFull){
    const h2 = state.hero, cap = bagMax();
    if(state.ui.pick){
      const p = state.ui.pick, cnt = Object.values(p).filter(Boolean).length;
      const row = (key, it) => `<button class="opt ${p[key]?"on":""}" data-act="togglePick" data-k="${key}"><b>${esc(it.n.split(" (")[0])}</b><span>${esc((it.n.match(/\((.*)\)/)||[])[1]||(it.weapon?"Dano "+it.d:it.slot?it.pv+" PV":""))}</span></button>`;
      banner = `<div class="sheet"><h3>Selecionar itens</h3>
        <p class="small">Marque o que vai levar. Cabem ${N(cap)} itens; você marcou ${N(cnt)}. O que ficar desmarcado será descartado.</p>
        <span class="label">Na mochila</span>${h2.bag.map((it,i)=>row("b"+i,it)).join("") || `<p class="muted small">Vazia.</p>`}
        <span class="label">Encontrados</span>${seg.stash.map((it,i)=>row("s"+i,it)).join("")}
        <div class="row"><button class="btn ghost" data-act="cancelPick">Voltar</button><button class="btn" data-act="confirmPick" ${cnt>cap?"disabled":""}>Levar ${cnt}</button></div>
        ${cnt>cap ? `<p class="toast">Desmarque ${cnt-cap} ite${cnt-cap>1?"ns":"m"} para caber.</p>` : ""}</div>`;
    } else {
      banner = `<div class="banner"><b>Mochila cheia</b>
        <p>Você achou: ${esc(seg.stash.map(it=>it.n.split(" (")[0]).join("; "))}. Sua mochila tem ${h2.bag.length} de ${cap} itens.</p>
        <button class="btn" data-act="startPick">Selecionar itens</button>
        <button class="btn" data-act="later">Deixar para depois</button></div>`;
    }
  }
  const canLeave = !isBlocked && pathClear();
  banner = SHARE.view() + banner;
  if(!isBlocked && seg.pile && seg.pile.length){

const ABILITIES = ["Explosivo","Fogo","Horda","Magia","Morte Súbita","Necromancia","Regeneração","Paralisar"];
let heroAtk = null, heroDieAt = 0;
let fxPops = [], heroHitUntil = 0, monHit = {}, monAtk = {}, monDie = {};
const C = () => state.combat;

function cLog(m){ const c = C(); c.log.unshift(c.coop && state.hero && /^Você/.test(m) ? `${state.hero.name}: ${m}` : m); if(c.log.length>30) c.log.length = 30; log(m); }
function pop(i, txt, col){ fxPops.push({i, txt, col, t0:performance.now()}); }

function startCombat(surprise){
  const seg = curSeg(), groups = [seg.mon, ...(seg.mon.extra||[])];
  const units = [];
  groups.forEach((g,gi)=>g.list.forEach(m=>units.push({key:monKey(g), name:monKey(g), pv:m.pv, max:m.max, dano:g.dano, tr:g.tr||"", boss:!!g.boss, g:gi})));
  const first = surprise || seg.mon.sneak || seg.mon.first === "hero" ? "hero" : "mon";
  if(seg.mon.sneak){ seg.mon.sneak = false; }
  state.combat = {level:D().pos.level, seg:seg.id, units, sel:0, phase:first, round:1, log:[], fury:0, heroPar:0, pending:null, alloc:{}, hits:0};
  state.combat.allies = buildAllies(false, false);
  if(COOP.on() && COOP.partnerHere() && COOP.sameRoom()){
    const c0 = state.combat;
    const gs = [seg.mon, ...((seg.mon && seg.mon.extra) || [])], fresh = gs.map(g=>!!(g && g.boss && !g.dbl));
    gs.forEach((g,gi)=>{ if(fresh[gi]){ g.dbl = true; g.list.forEach(x=>{ x.pv *= 2; x.max *= 2; }); } });
    c0.units.forEach(u=>{ if(fresh[u.g]){ u.pv *= 2; u.max *= 2; } });
    if(fresh.some(Boolean)) cLog("Dois aventureiros: o Chefe tem o dobro de vida."); c0.coop = true; c0.id = Math.random().toString(36).slice(2,9); c0.part = [COOP.me(), COOP.other()]; c0.mt = 0;
    state.coop.cp = {id:c0.id, done:-1, applied:-1, alloc:{pv:0, ar:{}}};
  }
  if(units.some(u=>has(u,"Morto-Vivo"))) H().undead++;
  fxPops = []; monHit = {}; monAtk = {}; monDie = {}; heroAtk = null; heroDieAt = 0;
  cLog(first === "hero" ? (state.combat.coop ? "O combate começa. Vocês atacam primeiro." : "O combate começa. Você ataca primeiro.") : "O combate começa. Os monstros atacam primeiro.");
  go("combat");
  if(first === "mon") (state.combat.coop ? runMonsterTurnCoop() : runMonsterTurn());
}
function heroDamageBonus(u, W){
  const h = state.hero; let b = 0; W = W || h.weapon;
  const wm = (W.n || "").match(/causa \+(\d) de dano(?! contra)/); if(wm) b += +wm[1];
  if(/contra Anjos/.test(W.n) && /Anjo/.test(u.name)) b += 2;
  if(/contra Vampiro e Carniçal/.test(h.bag.map(i=>i.n).join("|")) && /Vampir|Carniçal/.test(u.name)) b += 1;
  ARMOR_SLOTS.forEach(s=>{ const p = h.armor[s]; if(p && /da Força/.test(p.n)) b += +((p.n.match(/causará \+(\d)/)||[])[1] || 1); });
  if(ARMOR_SLOTS.some(s=>h.armor[s] && /Escamas/.test(h.armor[s].n)) && /Serpente/.test(u.name)) b += 1;
  if(hasClass("Coveiro") && has(u,"Morto-Vivo")) b += 2;
  if(hasClass("Helsing") && /Vampir|Carniçal/.test(u.name)) b += 1;
  if(hasClass("Dedetizador") && RX_INSETO.test(u.name)) b += 1;
  if(raceT("ogro")) b += 2;
  if(alliesIn().some(a=>MERCS[a.n] && MERCS[a.n].music)) b += 2;
  b += C().fury;
  return b;
}
/* aplica dano num monstro com as regras de Corpo de Pedra, Intangível e Ponto Fraco */
async function hitMonster(i, base, opts){
  const c = C(), u = c.units[i]; opts = opts || {};
  let dmg = Math.max(0, base);
  if(has(u,"Ponto Fraco") && opts.die === 6){ dmg *= 2; cLog(`Ponto fraco! O dano dobra.`); }
  const W = opts.w || state.hero.weapon;
  if(/Matador de Dragões/.test(W.n) && /Dragão/.test(u.name) && !opts.spell) dmg *= 2;
  if(has(u,"Corpo de Pedra") && dmg <= 3){ cLog(`${u.name} ignora ${dmg} de dano com o corpo de pedra.`); dmg = 0; }
  if(has(u,"Intangível") && dmg % 2 === 0 && dmg > 0 && !(/Remo do Barqueiro/.test(W.n) && !opts.spell) && !(hasClass("Caça-Fantasma") && opts.firstHit)){ cLog(`O golpe atravessa ${u.name}: dano par não afeta seres intangíveis.`); dmg = 0; }
  if(opts.vorpal){ dmg = u.pv; cLog(`Vorpal! ${u.name} morre na hora.`); }
  u.pv = Math.max(0, u.pv - dmg);
  monHit[i] = performance.now() + 300;
  pop(i, dmg ? "-"+dmg : "0", dmg ? "#fce870" : "#9aa6c4");
  if(dmg) cLog(`${u.name} sofre ${dmg} de dano${u.pv>0 ? ` (${u.pv}/${u.max} PV)` : ""}.`);
  if(u.pv <= 0){
    monDie[i] = performance.now();
    cLog(`${u.name} foi derrotado.`);
    if(has(u,"Morto-Vivo")){
      const [r] = await roll(`${u.name}: Morto-Vivo`, 1);
      rollNote(r === 1 ? "Levanta de novo!" : "Fica no chão");
      if(r === 1){ u.pv = 1; cLog(`${u.name} se levanta de novo com 1 PV!`); pop(i, "+1", "#6af06a"); }
    }
    if(u.pv <= 0 && !u.counted){ u.counted = true; if(!opts.ally) recordKill(u); }
  }
}

async function heroAttack(kind, wn){

  const expr = kind === "horn" ? "1d6" : W.d;
  const [die] = await roll(kind === "horn" ? "Chifre" : "Ataque", 1);
  const mod = +((expr.match(/([+-]\d+)$/)||[])[1] || 0);
  const firstHit = !c.hits; c.hits = (c.hits||0) + 1;

  const vorpal = /Vorpal/.test(W.n) && die === 6 && kind !== "horn";
  cLog(`Você ${kind==="horn" ? "dá uma chifrada" : "ataca com " + W.n.split(" (")[0]}: ${die}${mod?(mod>0?"+":"")+mod:""}${heroDamageBonus(u, W)?" +"+heroDamageBonus(u, W):""} = ${Math.max(0,base)}.`);

  await new Promise(r=>setTimeout(r, 300));
  await hitMonster(c.sel, base, {die, vorpal, w:W, firstHit});
  if(/Vampírica/.test(W.n) && kind !== "horn"){ h.pv = Math.min(h.pvMax, h.pv+1); cLog("A arma vampírica te devolve 1 PV."); }
  if(die === 1 && raceT("goblin")){
    const self = Math.max(0, 5 - (hasClass("Goblinator") ? 2 : 0));
    cLog("Você tirou 1 e explode! 5 de dano em todos da sala.");
    for(let i=0;i<c.units.length;i++) if(c.units[i].pv>0) await hitMonster(i, 5, {spell:true});
    h.pv = Math.max(0, h.pv - self); heroHitUntil = performance.now() + 450; cLog(`A explosão te causa ${self} de dano (${h.pv}/${h.pvMax}).`);
    if(h.pv <= 0){ finishDeath("Explodiu como um bom goblin"); return; }
  }
  if(die === 1 && raceT("semideus")){
    h.pv = Math.max(0, h.pv - 3); heroHitUntil = performance.now() + 450; cLog(`Semi-deus: o 1 no dado te custa 3 PV (${h.pv}/${h.pvMax}).`);
    if(h.pv <= 0){ finishDeath("A fúria dos deuses"); return; }
  }
  if(die === 1 && raceT("keyroz") && alive().length){ cLog("Keyroz: você tirou 1 e desaparece do combate!"); fleeCombat(); return; }
  if(kind !== "horn" && c.chain && c.chain.length && alive().length){
    pickNextTarget(); busy = false; persist(); render(); return;
  }
  c.chain = null;
  await afterHeroAction();
}

function rechargeable(){ const h = state.hero; return Object.entries(h.spells).filter(([n,s])=>n!=="Recarregar Mana" && s.left < s.max).map(([n])=>n); }
function freeSlot(){ const h = state.hero; return ARMOR_SLOTS.find(sl=>!h.armor[sl]); }
function canCast(n, inCombat){
  const i = SPELL_INFO[n], d = state.dungeon, inDg = d && d.inside; if(!i || i.use === "soon" || i.use === "world") return false;
  if(n === "Teletransporte" && state.combat && state.combat.world) return false;
  if(/^Invocar/.test(n) && ((state.combat && (state.combat.coop || state.combat.arena)) || COOP.on())) return false;
  if(n === "Invocar Esqueleto" && !inDg) return false;

  if(n === "Armadura de Pedra" && (!freeSlot() || raceT("noArmor") || raceT("ogro"))) return false;

  if(i.use === "combat") return false;
  if(i.use === "dg") return !!inDg;

}

async function heroItem(idx){
  const c = C(), h = state.hero, it = h.bag[idx];
  if(!it || raceT("ogro")) return;
  if(/^Pergaminho/.test(it.n)) H().magic++;
  busy = true; lockButtons();
  if(/^Poção de Vida/.test(it.n)){ h.pv = h.pvMax; cLog("Você bebe a Poção de Vida e recupera todos os PV."); }
  else if(/^Poção Verdosa/.test(it.n)){ const v = d6(); if(v >= 3){ h.pv = h.pvMax; cLog(`Poção Verdosa (${v}): você recupera todos os PV.`); } else cLog(`Poção Verdosa (${v}): só te deu coceira.`); }
  else if(/^Poção da Fúria/.test(it.n)){ c.fury = 2; cLog("Você bebe a Poção da Fúria: +2 de dano até o fim do combate."); }
  else if(/^Poção de Magia/.test(it.n)){ Object.values(h.spells).forEach(s=>s.left=s.max); cLog("Você bebe a Poção de Magia e recupera todas as magias."); }
  else if(/^Pergaminho Mágico \((.+)\)/.test(it.n)){
    const sp = it.n.match(/\((.+)\)/)[1]; h.bag.splice(idx,1);
    const had = !!h.spells[sp], prevMax = had ? h.spells[sp].max : 0;
    if(had) h.spells[sp].left++; else h.spells[sp] = {max:1, left:1};
    cLog(`Você lê o Pergaminho de ${sp}.`); busy = false;
    await heroSpell(sp);
    if(state.hero){ if(!had) delete state.hero.spells[sp]; else if(state.hero.spells[sp]) state.hero.spells[sp].max = prevMax; persist(); }
    return;
  }
  h.bag.splice(idx,1);
  c.showItems = false;
  await afterHeroAction();
}
async function runMonsterTurn(){

  busy = true; c.phase = "mon"; render(); lockButtons();
  rollLog = []; const tr = $("#etray"); if(tr) tr.innerHTML = "";

    const u = c.units[i];
    if(u.pv <= 0) continue;
    if(u.frozen){ u.frozen--; cLog(`${u.name} está congelado e não ataca.`); continue; }
    if(u.doom){ cLog(`${u.name} desfere o golpe de Morte Súbita!`); 
      if(ARMOR_SLOTS.some(s=>h.armor[s] && /dos Deuses/.test(h.armor[s].n))){ cLog("A armadura dos Deuses te protege da Morte Súbita."); u.doom = false; }

    if(u.fireNext){ u.fireNext = false; if(raceT("fireproof")) cLog(`${u.name} ataca envolto em fogo, mas você é imune.`); else { dmg += 10; cLog(`${u.name} ataca envolto em fogo: +10 de dano!`); } }
    if(u.magicNext){ dmg += u.magicNext; cLog(`A magia de ${u.name} soma ${u.magicNext} ao dano.`); u.magicNext = 0; }
    if(u.paralNext){ const [p] = await roll("Paralisia", 1); c.heroPar = p; u.paralNext = false; cLog(`${u.name} te paralisa por ${p} turno${p>1?"s":""}!`); }

    if(abil.length){
      const [r] = await roll(u.name, 1);
      if(r === 1){
        if(has(u,"Explosivo")){ dmg = u.pv; u.pv = 0; exploded = true; if(hasClass("Goblinator")) dmg = Math.max(0, dmg-2); cLog(`${u.name} explode causando ${dmg} de dano!`); }
        if(has(u,"Fogo")){ u.fireNext = true; cLog(`${u.name} pega fogo: o próximo ataque causa +10.`); }
        if(has(u,"Horda")){ c.units.push({key:"Orc", name:"Orc", pv:6, max:6, dano:3, tr:"", g:-1}); cLog("Horda! Um Orc entra na sala."); }
        if(has(u,"Magia")){ const [m] = await roll(`Magia de ${u.name}`, 1); u.magicNext = m; cLog(`${u.name} prepara uma magia: +${m} no próximo ataque.`); }
        if(has(u,"Morte Súbita")){ u.doom = true; cLog(`${u.name} prepara um golpe mortal. O próximo ataque dele vai te matar!`); }
        if(has(u,"Necromancia")){ c.units.push({key:"Esqueleto", name:"Esqueleto", pv:4, max:4, dano:1, tr:"Morto-Vivo", g:-1}); cLog("Necromancia! Um Esqueleto se levanta."); }
        if(has(u,"Regeneração")){ const before = u.pv; u.pv = Math.min(u.max, u.pv+6); if(u.pv>before){ cLog(`${u.name} se regenera (+${u.pv-before} PV).`); pop(i, "+"+(u.pv-before), "#6af06a"); } else cLog(`${u.name} tenta se regenerar, mas já está com os PV cheios.`); }
        if(has(u,"Paralisar")){ u.paralNext = true; cLog(`${u.name} prepara um golpe paralisante para o próximo ataque.`); }
      }
    }
    if(c.ethereal && dmg > 0) dmg -= 1;
    if(hasShield() && dmg > 0){ dmg = Math.max(0, dmg - shieldVal()); }
    if(has(u,"Veneno")) poison += dmg; else total += dmg;
    monAtk[i] = performance.now() + 320;
    if(!exploded) cLog(`${u.name} ataca: ${dmg} de dano${has(u,"Veneno") ? " de veneno" : ""}.`);
  }
  if(h.shield > 0 && total + poison > 0){
    let a = Math.min(h.shield, total); total -= a; let b2 = Math.min(h.shield - a, poison); poison -= b2;
    h.shield -= a + b2; cLog(`O Escudo Mágico absorve ${a+b2} de dano${h.shield ? ` (restam ${h.shield})` : ""}.`);
  }

    c.pending = {total, poison}; c.split = {}; c.phase = "split";

    busy = false; persist(); render(); return;
  }

    c.pending = {total, poison}; c.alloc = {}; c.phase = "alloc";

  }

}
function armorCur(p){ return p.cur === undefined ? p.pv : p.cur; }
async function applyHeroDamage(alloc, total, poison){
  const c = C(), h = state.hero;
  let absorbed = 0;
  Object.entries(alloc).forEach(([slot, a])=>{
    const p = h.armor[slot]; if(!p || !a) return;
    p.cur = armorCur(p) - a; absorbed += a;
    if(p.cur <= 0){ cLog(`${slot} (${p.n.split(" (")[0]}) foi destruído.`); if(!p.stone) H(h).armorLost++; delete h.armor[slot]; }
  });
  const toPV = total - absorbed + poison;
  h.pv = Math.max(0, h.pv - toPV);
  heroHitUntil = performance.now() + 450;
  if(absorbed) cLog(`A armadura absorveu ${absorbed} de dano.`);
  if(toPV) cLog(`Você perde ${toPV} PV (${h.pv}/${h.pvMax}).`);
  c.pending = null; c.alloc = {};
  if(h.pv <= 0){ const killer = alive()[0]; if(!samambro()){ busy = true; lockButtons(); heroDieAt = performance.now(); await new Promise(r=>setTimeout(r, 900)); heroDieAt = 0; } finishDeath(killer ? `Morto por ${killer.name}` : "Morto em combate"); return; }
  startHeroTurn();
}
async function startHeroTurn(){

function writeBackGroups(){
  if(C() && C().world) return;
  const c = C(), lv = D().levels[c.level], seg = lv.segs[c.seg];
  if(!seg || !seg.mon) return;
  const groups = [seg.mon, ...(seg.mon.extra||[])];
  groups.forEach((g,gi)=>{ g.list = c.units.filter(u=>u.g===gi && u.pv>0).map(u=>({pv:u.pv, max:u.max})); g.qty = g.list.length; });
  const keep = groups.filter(g=>g.list.length);
  if(!keep.length){ seg.mon = null; return; }
  seg.mon = keep[0]; seg.mon.extra = keep.slice(1); seg.mon.first = "hero"; seg.mon.sneak = false;
}
function fleeCombat(){
  syncAllies();
  if(C() && C().world){ fleeWorldCombat(); return; }
  const c = C(), lv = D().levels[c.level], seg = lv.segs[c.seg];
  const stay = COOPC.on() && COOPC.alive().filter(x=>x !== COOP.me()).length > 0;
  if(COOPC.on()){ COOPC.my().fled = true; COOPC.sync(); }
  if(!stay) writeBackGroups();
  let dest = null;
  if(seg.from && lv.doors[seg.from]) dest = lv.doors[seg.from].seg;
  if(!dest) dest = (Object.values(lv.segs).find(s=>s.exit || s.up) || {}).id;
  state.combat = null; busy = false;
  if(dest){ D().pos.seg = dest; centerOn = true; }
  mapVersion++; go("explore");
}
async function winCombat(){
  syncAllies();
  if(C() && C().world){ await winWorldCombat(); return; }
  const c = C(), h = state.hero;
  if(c && h){
    const dead = c.units.filter(u=>u.counted).length;
    if(c.absorb && dead){ h.pv = Math.min(h.pvMax, h.pv + 5*dead); log(`Absorver Alma: +${5*dead} PV.`); }
    if(c.deadFire && dead){ h.torches = Math.min(10, h.torches + 2*dead); log(`Fogo dos Mortos: +${2*dead} tochas.`); }
    if(raceT("gosma") && dead){ const sg = D().levels[c.level].segs[c.seg]; if(sg) sg.gosma = true; }
  }

  if(wasCoop){ const part = c.part.filter(x=>x === COOP.me() || (!COOPC.cp(x).dead && !COOPC.cp(x).fled)); SHARE.pendingPart = part.length > 1 ? part : null; }

  state.combat = null;
  go("explore");

}

function drawArena(cv){

      if(k >= 1) return;
      drawMonsterSprite(ctx, u.key, x, y + Math.round(k*6), t, frame, {alpha:1-k, still:true});
      if(k < .35) drawMonsterSprite(ctx, u.key, x, y + Math.round(k*6), t, frame, {white:true, alpha:.8*(1-k/.35), still:true});
      return;
    }
    if(i === c.sel && c.phase !== "won"){ const by = y - 30 + (frame%4<2?0:1); ctx.fillStyle = "#f8e048"; ctx.fillRect(x-3, by, 7, 1); ctx.fillRect(x-2, by+1, 5, 1); ctx.fillRect(x-1, by+2, 3, 1); ctx.fillRect(x, by+3, 1, 1); }
    if(u.boss){ const g = ctx.createRadialGradient(x, y-10, 2, x, y-10, 26); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(x-26, y-36, 52, 52); }
    const hit = monHit[i] && monHit[i] > now, shake = hit ? (frame%2 ? 1 : -1) : 0;

    const ak = monAtk[i] && monAtk[i] > now ? 1 - (monAtk[i] - now)/320 : 0, lunge = ak ? Math.round(Math.sin(ak*Math.PI)*7) : 0;
    drawMonsterSprite(ctx, u.key, x + shake, y + lunge, t, frame);

    if(u.frozen){ ctx.fillStyle = "rgba(160,220,255,.45)"; ctx.fillRect(x-10, y-22, 20, 22); }
    const bw = 20, f = u.pv/u.max;
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(x-bw/2-1, y+4, bw+2, 4);
    ctx.fillStyle = f > .5 ? "#6ac04a" : f > .25 ? "#e0b038" : "#d83a2a"; ctx.fillRect(x-bw/2, y+5, Math.max(1, Math.round(bw*f)), 2);
  });
  // aventureiro de costas para a tela, no primeiro plano
  const hx = Math.round(W/2 - 8), hy = H - 26;
  let pose = frame % 12 >= 6 ? "breath" : "idle", dy = 0, dx = 0;
  const ak = heroAtk ? (now - heroAtk.t0) : 1e9;
  if(ak < 160) { pose = "wind"; dy = 1; }
  else if(ak < 420){ pose = "strike"; dy = -Math.round(Math.sin((ak-160)/260*Math.PI)*6); }
  const hurt = heroHitUntil > now;
  if(hurt){ dy = 2; dx = frame%2 ? 1 : -1; }
  let fl = null;
  if(heroDieAt){
    const k = Math.min(1, (now - heroDieAt) / 700), d = dollCanvas(state.hero, "idle", true);
    ctx.save(); ctx.globalAlpha = 1 - k*.6; ctx.translate(W/2, H-4); ctx.rotate(k * Math.PI/2); ctx.drawImage(d.cv, -12, -(20 + DOLL_OY + 1)); ctx.restore();
  } else {
    const co2 = COOPC.on() && COOP.partner() && COOPC.inFight(COOP.other());
    if(co2){ const pl = COOP.partner(); const ph = {...pl.lite, armor:pl.lite.armor||{}, off:pl.lite.off||[], bag: pl.lite.lamp ? [{n:LAMP}] : [], noTorch: COOP.holder() !== COOP.other() && !pl.own};
      const pf = drawHero(ctx, W/2 + 22, H - 4, t, frame % 12 >= 6 ? "breath" : "idle", true, undefined, ph); if(pf) flameZ(ctx, pf[0], pf[1], t, 5); }
    drawAllies(ctx, W, H, t);
    fl = drawHero(ctx, W/2 + dx - (co2 ? 22 : 0), H - 4 + dy, t, pose, true, hurt && frame%2 ? .45 : undefined);
    if(fl) flameZ(ctx, fl[0], fl[1], t, 5);
  }
  if(heroAtk && ak < 520){ const pos = arenaPositions(c.units.length, W)[heroAtk.i]; if(pos) drawSlash(ctx, heroAtk.kind, pos[0], pos[1] - 10, (ak - 140) / 380); }
  else if(heroAtk && ak >= 520) heroAtk = null;
  if(heroHitUntil > now){ ctx.fillStyle = "rgba(220,40,30,.25)"; ctx.fillRect(0,0,W,H); }
  const g = ctx.createRadialGradient(W/2, H-10, 20, W/2, H/2, W*.75);
  g.addColorStop(0, "rgba(4,6,12,0)"); g.addColorStop(1, "rgba(4,6,12,.5)");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(fl) glowZ(ctx, fl[0], fl[1]-4, 44, .2);
  // números de dano
  fxPops = fxPops.filter(p=>now - p.t0 < 1100);
  fxPops.forEach(p=>{
    const [x,y] = pos[p.i] || [W/2, H-30]; const k = (now - p.t0)/1100;
    ctx.save(); ctx.translate(Math.round(x - textW(p.txt.replace("-","").replace("+",""))), Math.round(y - 30 - k*14)); ctx.scale(2,2);
    drawText(ctx, p.txt.replace("-","").replace("+",""), 1, 1, "#0c0a12"); drawText(ctx, p.txt.replace("-","").replace("+",""), 0, 0, p.col);
    ctx.restore();
  });
}
/* prévia do aventureiro na criação: a raça sorteada, parado e respirando, com a tocha acesa */
function drawPreview(cv){
  const dr = state.draft; if(!dr || !dr.race) return;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, t = frame/8;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#0c0a12"; ctx.fillRect(0,0,W,H);
  const P = PALZ[1];
  for(let y=30; y<H; y++) for(let x=0; x<W; x++){ const h = zh(x,y); ctx.fillStyle = h<.15 ? P.F[1] : h>.85 ? P.F[3] : P.F[2]; ctx.fillRect(x,y,1,1); }
  for(let i=0;i<6;i++){ ctx.fillStyle = `rgba(0,0,0,${.5-i*.08})`; ctx.fillRect(0,30+i,W,1); }
  const hero = {race:dr.race, race2:dr.race2, weapon:{unarmed:true}, armor:{}, off:[], bag:[], arms:2};
  const d = dollCanvas(hero, frame % 12 >= 6 ? "breath" : "idle", false);
  const x = Math.round(W/2 - 12), y = H - 3 - (20 + DOLL_OY + 1);
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(x+7, y+DOLL_OY+20, 11, 3);
  ctx.drawImage(d.cv, x, y);
  if(d.torch){ flameZ(ctx, x + d.torch[0], y + d.torch[1], t, 5); glowZ(ctx, x + d.torch[0], y + d.torch[1] - 4, 34, .22); }
}
function drawSlash(ctx, kind, x, y, k){
  if(k < 0 || k > 1) return;
  const a = 1 - k, px = (X,Y,c)=>{ ctx.fillStyle = c; ctx.fillRect(Math.round(X), Math.round(Y), 3, 3); };
  ctx.save(); ctx.globalAlpha = Math.min(1, a*1.6);
  const W1 = "#ffffff", W2 = "#bfe0ff", Y1 = "#ffe070";
  if(kind==="sword" || kind==="big" || kind==="halberd" || kind==="scythe"){ const r = kind==="big"||kind==="scythe" ? 20 : 15; const n = Math.round(4 + k*10);
    for(let i=0;i<n;i++){ const ang = -2.4 + i*0.22; px(x + Math.cos(ang)*r, y + Math.sin(ang)*r*.8 + 6, i > n-3 ? W1 : W2); } }
  else if(kind==="dagger"){ [[-6,-6],[6,-4]].forEach(([ox,oy],j)=>{ for(let i=0;i<5;i++) px(x+ox+i*2*(j?-1:1)*-1 + (j?0:0), y+oy+i*2, W1); }); }
  else if(kind==="spear"){ const len = Math.round(6 + k*14); for(let i=0;i<len;i+=2) px(x, y + 14 - i, i>len-4 ? W1 : W2); px(x-2, y+14-len, W1); px(x+2, y+14-len, W1); }
  else if(kind==="axe" || kind==="hammer" || kind==="club"){ const r = Math.round(4 + k*13); for(let i=0;i<8;i++){ const ang = i/8*Math.PI*2; px(x + Math.cos(ang)*r, y + 8 + Math.sin(ang)*r*.4, i%2 ? Y1 : W1); } px(x, y+6, W1); }
  else if(kind==="whip"){ for(let i=0;i<12;i++) px(x - 12 + i*2, y + Math.sin(i*.9 + k*6)*4, i>8 ? W1 : "#e8c890"); }
  else { const r = Math.round(2 + k*7); for(let i=0;i<6;i++){ const ang = i/6*Math.PI*2; px(x + Math.cos(ang)*r, y + Math.sin(ang)*r, Y1); } px(x, y, W1); }
  ctx.restore();
}
function arenaPositions(n, W){
  const pos = [];
  const rows = n <= 4 ? [n] : n <= 8 ? [Math.ceil(n/2), Math.floor(n/2)] : [Math.ceil(n/3), Math.ceil(n/3), n - 2*Math.ceil(n/3)];
  let k = 0;
  rows.forEach((cnt, r)=>{
    const y = 62 + r*18;
    for(let j=0;j<cnt;j++){ const x = Math.round(W/(cnt+1) * (j+1) + (r%2 ? 10 : 0)); pos[k++] = [x, y]; }
  });
  return pos;
}
function arenaTap(e){
  const c = C(); if(!c || busy || (c.phase !== "hero" && c.phase !== "ally")) return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  const pos = arenaPositions(c.units.length, cv.width);
  let best = -1, bd = 22;
  c.units.forEach((u,i)=>{ if(u.pv<=0) return; const d = Math.hypot(pos[i][0]-x, pos[i][1]-12-y); if(d < bd){ bd = d; best = i; } });
  if(best >= 0){ c.sel = best; persist(); render(); }
}

/* ---------- geometria dos hexágonos ---------- */
const HDIR = [[1,-1],[1,0],[0,1],[-1,1],[-1,0],[0,-1]];
const HDIRN = ["a nordeste","a leste","a sudeste","a sudoeste","a oeste","a noroeste"];
const HEXW = 56, HEXH = 32;
const hk = (q, r) => `${q},${r}`;
const hq = k => k.split(",").map(Number);
function hexNb(k){ const [q,r] = hq(k); return HDIR.map(([a,b])=>hk(q+a, r+b)); }
function hexDist(a, b){ const [q1,r1] = hq(a), [q2,r2] = hq(b), dq = q1-q2, dr = r1-r2; return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2; }
function dirOf(a, b){
  const pa = hexPx(a), pb = hexPx(b), ang = Math.atan2(pb.y - pa.y, pb.x - pa.x);
  let best = 0, bd = 9;
  HDIR.forEach(([q,r],i)=>{ const v = hexPx(hk(q,r)), d = Math.abs(Math.atan2(Math.sin(ang - Math.atan2(v.y, v.x)), Math.cos(ang - Math.atan2(v.y, v.x)))); if(d < bd){ bd = d; best = i; } });
  return HDIRN[best];
}
function distTxt(d){ return d <= 1 ? "logo ao lado" : `a ${d} hexágonos`; }
function nearDgs(pos, rad){
  const w = WD(); rad = rad || 3;
  return Object.keys(w.hex).filter(k=>k !== pos && w.hex[k].dg && hexDist(pos, k) <= rad).map(k=>{ const m = w.hex[k].dg, r = dgRec(m); return {k, m, d:hexDist(pos,k), dir:dirOf(pos,k), done:!!(r && r.complete)}; }).sort((a,b)=>a.d-b.d);
}
function hexPx(k){ const [q,r] = hq(k); return {x:q*HEXW + r*HEXW/2, y:r*HEXH}; }
function pxHex(x, y){
  const r0 = Math.round(y/HEXH); let best = null, bd = 1e9;
  for(let r=r0-1;r<=r0+1;r++){ const q0 = Math.round((x - r*HEXW/2)/HEXW); for(let q=q0-1;q<=q0+1;q++){ const cx = q*HEXW + r*HEXW/2, cy = r*HEXH, dd = (x-cx)**2 + (y-cy)**2; if(dd < bd){ bd = dd; best = hk(q,r); } } }
  return best;
}

/* ---------- estado do mundo ---------- */
function WD(){ return state && state.world; }
function wHere(){ const w = WD(); return w ? w.hex[w.pos] : null; }

function wLog(m){ const w = WD(); if(!w) return; w.log.unshift(m); if(w.log.length > 40) w.log.length = 40; }
function locLabel(loc){
  if(!loc) return "";
  if(loc.k === "city") return `Cidade ${loc.race}`;
  if(loc.k === "fort") return `Fortaleza ${loc.race}`;
  return {ruins:"Ruínas", volcano:"Vulcão", portal:"Portal", oasis:"Oásis", corals:"Corais", rocks:"Rochas"}[loc.k] || "";
}
function isTown(loc){ return !!loc && (loc.k === "city" || loc.k === "fort"); }
/* cidade onde o aventureiro está e pode entrar (ou null) */
function worldCityHere(){
  const w = WD(); if(!w) return null;

}
function worldStartSpec(h){
  const id = String(h.race), n = R(h.race) ? R(h.race).n : "";
  if(id[0] === "e") return {t:"ag", loc:null, water:true};                       /* Raças Exóticas: no mar, num barco */
  if(id[0] === "m") return n === "Goblin" ? {t:"fl", loc:{k:"city", race:"Goblin"}} : {t:"mo", loc:{k:"city", race:"Orc"}};
  return {t:"pl", loc:{k:"city", race:"Humana"}};
}
function worldGen(t){
  const nt = TERR_HOT[t][d6()-1];
  let loc = null;
  if(d6() === 6){ const [k, race] = LOC_HOT[nt][d6()-1]; if(k !== "nothing") loc = race ? {k, race} : {k}; }
  return {t:nt, loc};
}
function worldReveal(k){
  const w = WD(), hx = w.hex[k];
  hexNb(k).forEach(n=>{ if(!w.hex[n]) w.hex[n] = worldGen(hx.t); });
}
function worldInit(){

  if(sp.water){ hexNb("0,0").forEach(k=>w.hex[k] = {t:"ag", loc:null}); w.boat = true; }
  worldReveal("0,0");

  const d = state.dungeon;
  if(d && !d.inside){
    const k = !d.complete && hexNb("0,0").find(n=>w.hex[n].t !== "ag" && !w.hex[n].loc);
    if(k){ d.uid = d.uid || Date.now().toString(36); d.hex = k; w.hex[k].dg = {uid:d.uid, type:d.type, name:d.name, dice:d.dice}; }
    else state.dungeon = null;

/* novo aventureiro num mundo que já existe: começa na cidade mais próxima onde pode entrar */
function worldPlaceNew(h){
  const w = WD(); if(!w) return;

  const towns = Object.keys(w.hex).filter(k=>isTown(w.hex[k].loc) && canEnterCity(w.hex[k].loc, h) && !w.hex[k].banned);

function canSwim(h){ return raceIs("Patovsky", h) || raceIs("Sharkin", h) || raceIs("Homem-Boto", h) || hasAlly("Golfinho", h); }
function ignoresEvents(h){ return raceIs("Corvino", h) || raceIs("Patovsky", h) || raceIs("Levent", h) || hasAlly("Rastreador Elfo", h); }
/* provisões gastas para entrar no hexágono */
function travelCost(k){
  const h = state.hero, w = WD(), t = w.hex[k].t;
  const mercs = mercCount() * TERR[t].cost;               /* cada mercenário gasta as próprias provisões */
  if(raceIs("Steambot")) return mercs;
  let c = TERR[t].cost;
  if(t === "de" && (raceIs("Tri-kri-kri") || hasAlly("Camelo"))) c = 1;
  if(t === "mo" && (raceIs("Meio-Cabra") || hasAlly("Llama") || hasAlly("Bode"))) c = Math.min(c, raceIs("Meio-Cabra") ? 1 : 2);
  if(t === "fl" && (wearing(/^Botas Élficas/) || hasAlly("Coruja") || hasAlly("Lobo Gigante"))) c = 1;
  if(t === "pa" && hasAlly("Raptor")) c = 1;
  if(hasAlly("Grifo")) c = 1;
  if(t === "pl" && hasAlly("Cavalo") && w.horse) c = 0;
  if(raceIs("Pandakhan")) c *= 2;
  if(raceIs("Centauro")) c = Math.ceil(c/2);

function canTravel(k){

  if(!hexNb(w.pos).includes(k)) return {ok:false, why:`Fica a ${hexDist(w.pos,k)} hexágonos daqui. Viaje um hexágono por vez.`};
  if(hx.loc && hx.loc.k === "rocks") return {ok:false, why:"Rochas: não é possível passar por aqui."};
  if(hx.t === "ag" && !w.boat && !canSwim()) return {ok:false, why:"Para andar na água você precisa de um barco. Contrate um numa cidade da costa."};

}
function dgRec(m){ const w = WD(), d = state.dungeon; return d && d.uid === m.uid ? d : (w.recs[m.uid] || null); }
function wAddItem(it){

function wBegin(){ busy = true; rollLog = []; const t = $("#etray"); if(t) t.innerHTML = ""; lockButtons(); }

/* ---------- viagem ---------- */
async function doTravel(k, how){
  const w = WD(), h = state.hero, hx = w.hex[k];
  if(busy || !canTravel(k).ok) return;
  wBegin();
  const fly = how === "fly";
  if(fly){ const s = h.spells["Voar"]; if(!s || s.left <= 0){ wEnd(); return; } s.left--; H().magic++; }
  const cost = fly ? 0 : travelCost(k);
  const have = h.provisions||0, use = Math.min(have, cost), miss = cost - use;
  h.provisions = have - use; H().provSpent += use;
  w.trips++; w.days += fly ? 1 : TERR[hx.t].cost;
  const prev = w.pos;
  if(hx.t === "pl" && hasAlly("Cavalo") && !fly) w.horse = !w.horse;
  w.pos = k; w.sel = null; wcenterOn = true;
  if(w.boat && hx.t !== "ag"){ w.boat = false; wLog("Você deixa o barco na costa."); }
  if(hx.t === "ag" && w.boat) H().boat++;
  if(hx.t === "fl") H().forests++;
  if(hx.t === "de") H().deserts++;
  if(isTown(hx.loc)){ const x = H(); if(!x.cities.includes(k)) x.cities.push(k); }
  worldReveal(k);
  if(hasAlly("Águia")){ const di = hexNb(prev).indexOf(k), k2 = di >= 0 ? hexNb(k)[di] : null; if(k2 && w.hex[k2]) worldReveal(k2); }
  wLog(`${fly ? "Você voou" : "Você viajou"} até ${hx.loc ? "a " + locLabel(hx.loc) : TERR[hx.t].a + " " + TERR[hx.t].n}${cost ? ` (${cost} provis${cost>1?"ões":"ão"})` : ""}.`);
  if(miss > 0){
    h.pv = Math.max(0, h.pv - miss);
    wLog(`Sem provisões: você perde ${miss} PV de fome (${h.pv}/${h.pvMax}).`);

async function arriveHex(k, fly){

function drawWorld(cv){

  if(wcenterOn){ const p = hexPx(w.pos); wcam.x = p.x; wcam.y = p.y; wcenterOn = false; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);

  vis.forEach(k=>{ const hx = w.hex[k], p = hexPx(k), v = Math.floor(zh(p.x*.37, p.y*.53)*3); ctx.drawImage(wTile(hx.t, v, hx.t === "ag" ? wf : 0), p.x-TCX, p.y-TCY); });

  },
  wBoat(){ const h = state.hero, w = WD(); if(h.coins < 1 || w.boat) return; h.coins--; w.boat = true; state.ui.cityMsg = "Você contratou um barco. Ele espera no porto."; persist(); render(); },
  async wAsk(){

  async wCulture(){

/* ---------- desenhos dos animais, montarias e invocações (de lado, olhando para a direita) ---------- */
const MERC_GEAR = {"Capanga":{Braceletes:"Braceletes"}, "Bufão":{Elmo:"Chapéu do Bobo"}, "Guarda Costas":{Elmo:"Elmo", Peitoral:"Peitoral"}, "Veterano de Guerra":{Elmo:"Elmo", Peitoral:"Peitoral", Ombreiras:"Ombreiras"},
  "Rastreador Elfo":{Botas:"Botas"}, "Soldado Élfico":{Peitoral:"Peitoral Élfico", Elmo:"Elmo Élfico"}, "Minerador Anão":{Elmo:"Elmo"}, "Soldado Anão":{Elmo:"Elmo", Peitoral:"Peitoral", Braceletes:"Braceletes"},
  "Soldado Orc":{Ombreiras:"Ombreiras", Peitoral:"Peitoral"}};
function mercDoll(n, wn){
  const m = MERCS[n] || {}, g = MERC_GEAR[n] || {};
  return {name:n, race:m.race || 7, race2:null, arms:2, weapon:wn ? {n:wn} : {n:"Mãos nuas", unarmed:true}, off:n === "Veterano de Guerra" ? [{n:"Escudo de Ferro", shield:true}] : [],

/* ---------- acessórios dos mercenários: chapéu de mago, alaúde e a mochila do Ogro ---------- */
const MERC_ACC = {};
function accSprite(k){
  if(MERC_ACC[k]) return MERC_ACC[k];
  if(k === "hat") MERC_ACC[k] = pixCanvas(14, 13, ({P})=>{
    const rows = ["......b.......",".....bb.......",".....bbb......","....bbyb......","....bbbbb.....","...bybbbb.....","...bbbbbyb....","..bbbbbbbbb...","..bybbbbbbbb..","BBBBBBBBBBBBBB","BBBBBBBBBBBBBB"];
    const pal = {b:"#3a5ad8", B:"#2a3a98", y:"#f8e040"};
    rows.forEach((r,j)=>{ for(let i=0;i<r.length;i++) if(pal[r[i]]) P(i, j+1, i < 6 && r[i] === "b" ? "#4a6ae8" : pal[r[i]]); });
  });
  if(k === "lute") MERC_ACC[k] = pixCanvas(14, 16, ({P, disc, line})=>{
    line(9, 6, 12, 1, "#5a3418"); line(10, 6, 13, 1, "#7a4a24"); P(12, 0, "#3a2010"); P(13, 0, "#3a2010"); P(13, 2, "#e8e0c8"); P(11, 1, "#e8e0c8");
    disc(6, 10, 5, 4.5, (x,y,e,dx,dy)=>P(x,y, dx+dy < -2 ? "#e0a050" : dx+dy > 3 ? "#9a5a24" : "#c8823a"));
    disc(7, 9, 1.4, 1.4, (x,y)=>P(x,y,"#2a1608"));
    line(4, 13, 10, 5, "#f0e4c8"); P(3, 13, "#5a3418"); P(4, 14, "#5a3418");
  });
  if(k === "pack") MERC_ACC[k] = pixCanvas(18, 20, ({P, disc, rect})=>{
    disc(9, 11, 8, 8.5, (x,y,e,dx,dy)=>P(x,y, dx+dy < -4 ? "#c89a5a" : dx+dy > 5 ? "#7a5228" : "#a87a40"));
    rect(3, 3, 12, 3, (i)=> i===0 ? "#d8b070" : "#b88a48");
    for(let y=4;y<19;y++){ P(5, y, "#5a3418"); P(12, y, "#5a3418"); }
    rect(7, 9, 4, 3, (i,j)=> j===0 ? "#d8b070" : "#c89a5a"); P(9, 12, "#c8a040");
    P(2, 1, "#8a6a3a"); P(3, 2, "#8a6a3a"); rect(1, 0, 2, 1, "#6a4a2a"); P(15, 2, "#9a9aa4"); P(16, 1, "#9a9aa4"); P(16, 0, "#c8c8d0");
  });
  return MERC_ACC[k];
}
/* desenha um mercenário (boneco da raça + acessórios). fx, fy = pés */
function drawMerc(ctx, n, wn, fx, fy, t, pose, back){
  const big = n === "Ogro de Carga";
  const doll = mercDoll(n, wn);
  ctx.save(); ctx.translate(Math.round(fx), Math.round(fy)); if(big) ctx.scale(1.5, 1.5);
  const head = -(20 + DOLL_OY + 1) + DOLL_OY;           /* topo do quadro do boneco, sem a folga de cima */
  if(big && !back){ const pk = accSprite("pack"); ctx.drawImage(pk, -9, head - 2); }
  const pf = drawHero(ctx, 0, 0, t, pose, back, undefined, doll);
  if(big && back){ const pk = accSprite("pack"); ctx.drawImage(pk, -9, head + 1); }
  if(n === "Mago de Aluguel"){ const h = accSprite("hat"); ctx.drawImage(h, -7, head - 11); }
  if(n === "Menestrel"){ const l = accSprite("lute"); if(back) ctx.drawImage(l, -8, head + 3); else ctx.drawImage(l, -6, head + 5); }
  ctx.restore();
  return pf ? [Math.round(fx + pf[0]*(big ? 1.5 : 1)), Math.round(fy + pf[1]*(big ? 1.5 : 1))] : null;
}

const beastCache = {};
function beastSprite(key, f){
  const ck = key + "_" + (f||0); if(beastCache[ck]) return beastCache[ck];
  const spec = BEASTS[key]; if(!spec) return null;
  return beastCache[ck] = pixCanvas(spec.w, spec.h, o=>spec.draw(o, f||0));

/* quadrúpede genérico (de lado): pernas do fundo, cauda, corpo, quadril, pernas da frente, pescoço e cabeça */
function quad(o, f, q){
  const {P, disc, line, B} = o, C = q.c, sw = f ? 1 : 0;
  const bx = q.x, by = B - q.leg - Math.round(q.ry*.4);
  const legTop = by + Math.round(q.ry*.2), wl = q.legW || 2;
  const leg = (x, far, swing) => { const len = B - legTop;
    for(let y=legTop; y<=B; y++){ const k = (y-legTop)/len, w = k < .45 ? wl + 1 : wl, dx = k > .5 ? swing : 0;
      for(let i=0;i<w;i++) P(x + i + dx, y, y === B ? (q.hoof || C[2]) : far ? C[2] : (i === 0 ? C[0] : C[1])); } };
  leg(bx - q.rx + 2, true, -sw); leg(bx + q.rx - 4, true, sw);
  if(q.tail) q.tail(o, bx - q.rx, by - Math.round(q.ry*.3), f);
  disc(bx, by, q.rx, q.ry, (x,y,e,dx,dy)=>P(x,y, dy < -q.ry*.35 ? C[0] : dy > q.ry*.4 ? (q.belly || C[2]) : C[1]));
  disc(bx - q.rx + 3, by + 1, Math.max(2, q.rx*.32), q.ry*.95, (x,y,e,dx,dy)=>P(x,y, dy < -q.ry*.3 ? C[0] : dx > 1 ? C[2] : C[1]));
  if(q.marks) q.marks(o, bx, by, f);
  leg(bx - q.rx + 3, false, sw); leg(bx + q.rx - 3, false, -sw);
  /* pescoço */
  const nx = bx + q.rx - 2, ny = by - Math.round(q.ry*.35), hx = nx + q.hdx, hy = ny + q.hdy;
  const steps = Math.max(2, Math.round(Math.hypot(q.hdx, q.hdy)));
  for(let k=0;k<=steps;k++){ const t = k/steps, r = q.ry*.6*(1-t) + q.hr*.55*t; disc(nx + q.hdx*t, ny + q.hdy*t, r, r, (x,y,e,dx,dy)=>P(x,y, dx < -r*.3 ? C[0] : C[1])); }

function party(h){ h = h || state.hero; if(!h) return []; if(!h.party) h.party = []; return h.party; }
function partyOf(kind, h){ return party(h).filter(p=>p.kind === kind); }
function hasAlly(n, h){ return party(h).some(p=>p.n === n && p.pv > 0); }
function mercCount(h){ return partyOf("merc", h).length; }
function provMax(h){ return 20 * (1 + mercCount(h)); }
function partyCargo(h){ return party(h).reduce((a,p)=>a + (p.kind === "merc" && MERCS[p.n] && MERCS[p.n].cargo ? MERCS[p.n].cargo : 0) + (p.n === "Macaco" ? 1 : 0), 0); }
function torchHolder(h){ return party(h).find(p=>p.kind === "merc" && !(MERCS[p.n] && MERCS[p.n].noGear)); }
function freeLock(){ return hasClass("Chaveiro") || hasClass("Ladrão") || hasAlly("Arrombador"); }

/* ---------- aliados no combate ---------- */
function buildAllies(world, arena){
  const h = state.hero, inDg = !!(state.dungeon && state.dungeon.inside);
  if(arena || (typeof COOP !== "undefined" && COOP.on())) return [];
  return party(h).filter(p=>{
    if(p.pv <= 0) return false;
    if(p.kind === "merc") return !(MERCS[p.n] && MERCS[p.n].nofight);
    if(p.kind === "animal") return !(inDg && ANIMALS[p.n] && ANIMALS[p.n].noDg);
    if(p.kind === "mount") return !!world;
    if(p.kind === "summon") return inDg;
    return false;
  }).map(p=>({pid:p.id, n:p.n, kind:p.kind, pv:p.pv, max:p.max, d:p.w ? p.w.d : p.d || null, wn:p.w ? p.w.n : null, tr:p.tr||"", key:p.key||p.n, race:p.race, acted:false}));
}
function alliesIn(){ const c = C(); return c && c.allies ? c.allies.filter(a=>a.pv > 0) : []; }
function allyCanAct(a){ const m = MERCS[a.n]; if(m && m.music) return false; return !!(a.d || allySpells(a).length || (m && (m.explode || m.joke))); }
function allySpells(a){ const p = party().find(x=>x.id === a.pid); if(!p || !p.spells) return []; return Object.entries(p.spells).filter(([n,s])=>s.left > 0 && ["Cura","Luz","Raio de Gelo","Relâmpago","Bola de Fogo"].includes(n)); }
function syncAllies(){
  const c = C(), h = state.hero; if(!c || !c.allies || !h) return;
  c.allies.forEach(a=>{
    if(!a.pid) return;
    const p = party(h).find(x=>x.id === a.pid); if(!p) return;
    p.pv = a.pv;
  });
  const gone = party(h).filter(p=>p.pv <= 0);
  gone.forEach(p=>log(`${p.n} morreu em combate.`));
  h.party = party(h).filter(p=>p.pv > 0);
}
function allyDamage(expr){ const m = String(expr).match(/^(\d*)d6([+-]\d+)?$/); return m ? null : +expr; }
async function allyAttack(i){
  const c = C(), a = c.allies[i], u = c.units[c.sel];
  if(!a || a.acted || a.pv <= 0 || !a.d || !u || u.pv <= 0) return;
  const fixed = allyDamage(a.d);
  let die = 0, dmg;
  if(fixed === null){ [die] = await roll(a.n, 1); const mod = +((a.d.match(/([+-]\d+)$/)||[])[1] || 0); dmg = Math.max(0, die + mod); }
  else dmg = fixed;
  if(a.n === "Soldado Anão" && /Orc|Goblin/.test(u.name)){ dmg += 1; }
  cLog(`${a.n} ataca${a.wn ? " com " + a.wn : ""}: ${dmg} de dano.`);
  await hitMonster(c.sel, dmg, {die, w:{n:""}, ally:true});
  a.acted = true;
}
async function allyCast(i, sp){
  const c = C(), a = c.allies[i], p = party().find(x=>x.id === a.pid), h = state.hero;
  if(!a || a.acted || !p || !p.spells[sp] || p.spells[sp].left <= 0) return;
  p.spells[sp].left--;
  const u = c.units[c.sel];
  if(sp === "Cura"){ h.pv = Math.min(h.pvMax, h.pv + 5); cLog(`${a.n} conjura Cura em você: +5 PV.`); }
  if(sp === "Luz"){ h.torches = Math.min(10, h.torches + 1); cLog(`${a.n} conjura Luz: vale como uma tocha.`); }
  if(sp === "Relâmpago" && u){ cLog(`${a.n} lança Relâmpago em ${u.name}!`); await hitMonster(c.sel, 6, {spell:true, w:{n:""}, ally:true}); }
  if(sp === "Raio de Gelo" && u){ cLog(`${a.n} lança Raio de Gelo em ${u.name}!`); await hitMonster(c.sel, 4, {spell:true, w:{n:""}, ally:true}); u.frozen = Math.max(u.frozen||0, 1); }
  if(sp === "Bola de Fogo"){ cLog(`${a.n} lança Bola de Fogo!`); for(let k=0;k<c.units.length;k++) if(c.units[k].pv > 0) await hitMonster(k, 5, {spell:true, w:{n:""}, ally:true}); }
  a.acted = true;
}
async function allyAfter(){
  const c = C();
  if(!alive().length){ c.phase = "won"; cLog("Todos os monstros foram derrotados!"); busy = false; persist(); render(); return; }
  pickNextTarget();
  if(alliesIn().filter(allyCanAct).every(a=>a.acted)){ await runMonsterTurn(); return; }
  busy = false; persist(); render();
}
async function toAllies(){
  const c = C();
  const ready = alliesIn().filter(allyCanAct);
  if(!ready.length){ await runMonsterTurn(); return; }
  c.allies.forEach(a=>a.acted = false);
  c.phase = "ally"; busy = false; persist(); render();
}
/* divisão do dano entre o aventureiro e os aliados (página 44) */
function splitInfo(){
  const c = C(), p = c.pending, al = alliesIn(), need = p.total + p.poison, members = al.length + 1;
  const minEach = need >= members ? 1 : 0;
  const allySum = al.reduce((s,a)=>s + (c.split[a.pid || a.n + c.allies.indexOf(a)] || 0), 0);
  return {need, minEach, allySum, hero:need - allySum, al};
}
function splitKey(a){ const c = C(); return a.pid || a.n + c.allies.indexOf(a); }
async function applySplit(){
  const c = C(), h = state.hero, s = splitInfo();
  if(s.hero < s.minEach || s.al.some(a=>(c.split[splitKey(a)]||0) < s.minEach)) return;
  s.al.forEach(a=>{ const d = c.split[splitKey(a)] || 0; if(!d) return; a.pv = Math.max(0, a.pv - d); cLog(`${a.n} recebe ${d} de dano${a.pv ? ` (${a.pv}/${a.max})` : " e cai"}.`); });
  const heroPoison = Math.max(0, c.pending.poison - s.allySum), heroNormal = s.hero - heroPoison;
  c.split = {};
  const absorb = ARMOR_SLOTS.filter(sl=>h.armor[sl] && armorCur(h.armor[sl]) > 0);
  if(heroNormal > 0 && absorb.length){ c.pending = {total:heroNormal, poison:heroPoison}; c.alloc = {}; c.phase = "alloc"; busy = false; persist(); render(); return; }
  c.pending = null;
  applyHeroDamage({}, heroNormal, heroPoison);
}

/* contratos: valem para uma masmorra (pode sair e voltar) */
function partyEnterDungeon(d){
  const h = state.hero; if(!h) return;
  const left = [];
  partyOf("merc", h).forEach(m=>{ if(!m.dg) m.dg = d.uid; else if(m.dg !== d.uid) left.push(m); });
  if(left.length){ h.party = party(h).filter(p=>!left.includes(p)); log(`${left.map(m=>m.n).join(", ")} foi contratado para outra masmorra e foi embora.`); }
}
function partyLeaveDungeon(d){
  const h = state.hero; if(!h) return;
  const sum = partyOf("summon", h).filter(p=>p.untilDg);
  if(sum.length) log("Os esqueletos invocados desmoronam ao sair da masmorra.");
  let done = [];
  if(d.complete) done = partyOf("merc", h).filter(m=>m.dg === d.uid);
  if(done.length) log(`${done.map(m=>m.n).join(", ")} cumpriu o contrato e foi embora.`);
  h.party = party(h).filter(p=>!sum.includes(p) && !done.includes(p));
}

function drawAllies(ctx, W, H, t){
  const c = C(); if(!c || !c.allies) return;
  const al = c.allies.filter(a=>a.pv > 0);
  const slots = [[-34,0],[34,0],[-62,-6],[62,-6],[-88,-10],[88,-10]];
  al.slice(0,6).forEach((a,i)=>{
    const [dx, dy] = slots[i], x = Math.round(W/2 + dx), y = H - 6 + dy;
    if(a.kind === "merc"){
      drawMerc(ctx, a.n, a.wn, x, y, t, frame % 12 >= 6 ? "breath" : "idle", true);
    } else if(BEASTS[a.key]){
      const bs = beastSprite(a.key, Math.floor(frame/6) % 2);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(Math.round(x - bs.width/2 + 2), y, bs.width - 4, 2);
      ctx.drawImage(bs, Math.round(x - bs.width/2), y - bs.height + 1);
    } else {
      const d = sprDef(a.key), w = d && d.rows ? Math.max(...d.rows.map(r=>r.length)) : 16, k = w > 22 ? Math.max(.45, 18/w) : 1;
      if(k < 1){ ctx.save(); ctx.translate(x, y); ctx.scale(k, k); drawMonsterSprite(ctx, a.key, 0, 0, t, frame, {}); ctx.restore(); }
      else drawMonsterSprite(ctx, a.key, x, y, t, frame, {});
    }
    const f = a.pv / a.max, bw = 16;
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(x-bw/2-1, y+1, bw+2, 4);
    ctx.fillStyle = f > .5 ? "#6ac04a" : f > .25 ? "#e0b038" : "#d83a2a"; ctx.fillRect(x-bw/2, y+2, Math.max(1, Math.round(bw*f)), 2);
  });
}

const actionsParty = {
  async hireMerc(b){
    const h = state.hero, n = b.dataset.n, m = MERCS[n];
    if(!m || h.coins < m.cost || COOP.on() || !mercsFor(worldCityHere()).includes(n)) return;
    busy = true; lockButtons();
    h.coins -= m.cost;
    const p = {id:newPid(), kind:"merc", n, pv:m.pv, max:m.pv, w:m.w ? {n:m.w[0], d:m.w[1]} : null, race:m.race, dg:null};
    if(m.spells){ p.spells = {}; for(let i=0;i<m.spells;i++){ const [v] = await roll(`Magia de ${n}`, 1); const s = SPELLS[v].n; rollNote(s); p.spells[s] = p.spells[s] ? {max:p.spells[s].max+1, left:p.spells[s].left+1} : {max:1, left:1}; } }
    party(h).push(p);
    state.ui.cityMsg = `${n} foi contratado por ${m.cost} moedas.${p.spells ? ` Magias: ${Object.entries(p.spells).map(([s,v])=>v.max>1?`${s} ×${v.max}`:s).join(", ")}.` : ""}`;
    busy = false; persist(); render();
  },
  dismiss(b){
    const h = state.hero, i = party(h).findIndex(p=>p.id === b.dataset.id); if(i < 0) return;
    const p = party(h)[i];
    if(state.ui.dismiss !== p.id){ state.ui.dismiss = p.id; state.ui.armsMsg = `Toque de novo em Dispensar para confirmar: ${p.n} vai embora e não volta${p.kind === "merc" ? " (o pagamento não é devolvido)" : ""}.`; render(); return; }
    party(h).splice(i,1); state.ui.dismiss = null; state.ui.armsMsg = `${p.n} foi embora.`; persist(); render();
  },
  async buyMount(b){
    const h = state.hero, n = b.dataset.n, m = MOUNTS[n];
    if(!m || h.coins < m.cost || partyOf("mount").length || animalSlots() <= 0) return;
    h.coins -= m.cost; party(h).push({id:newPid(), kind:"mount", n, pv:m.pv, max:m.pv, d:m.d, key:m.key});
    state.ui.cityMsg = `Você comprou ${n === "Llama" ? "uma Llama" : "um " + n}.`; persist(); render();
  },
  async tame(b){
    const h = state.hero, n = b.dataset.n, mount = !!b.dataset.m, a = mount ? MOUNTS[n] : ANIMALS[n], cost = mount ? 8 : 4;
    if(!a || animalSlots() <= 0 || (h.provisions||0) < cost || (mount && partyOf("mount").length) || !tameSpot(WD().pos)) return;
    wBegin();
    h.provisions -= cost;
    const [v] = await roll(`Adestrar ${n}`, 1);
    if(v >= a.dif){ rollNote("Conseguiu!"); party(h).push({id:newPid(), kind:mount ? "mount" : "animal", n, pv:a.pv, max:a.pv, d:a.d, key:a.key}); wLog(`Você adestrou ${n === "Águia" || n === "Coruja" || n === "Cobra" || n === "Llama" ? "uma " : "um "}${n}!`); }
    else { rollNote("Fugiu"); wLog(`O animal fugiu. Você gastou ${cost} provisões tentando adestrá-lo.`); }
    wEnd();
  },
  giveMerc(b){
    const h = state.hero, it = h.bag[+b.dataset.i], p = party(h).find(x=>x.id === b.dataset.id);
    if(!it || !p || p.kind !== "merc" || (MERCS[p.n] && MERCS[p.n].noGear)) return;
    if(it.weapon){ p.w = {n:it.n.split(" (")[0], d:it.d}; state.ui.armsMsg = `${p.n} agora luta com ${p.w.n}. Ele não vai devolver.`; }
    else if(it.slot){ p.max += it.pv||0; p.pv += it.pv||0; state.ui.armsMsg = `${p.n} vestiu ${it.n.split(" (")[0]}: +${it.pv||0} PV. Ele não vai devolver.`; }
    else return;
    h.bag.splice(+b.dataset.i, 1); state.ui.bagSel = null; persist(); render();
  },
  async allyAtk(b){ if(busy) return; busy = true; lockButtons(); await allyAttack(+b.dataset.i); await allyAfter(); },
  async allyCast(b){ if(busy) return; busy = true; lockButtons(); await allyCast(+b.dataset.i, b.dataset.n); await allyAfter(); },
  async allyBoom(b){
    if(busy) return; const c = C(), a = c.allies[+b.dataset.i]; if(!a || a.acted) return;
    busy = true; lockButtons();
    cLog(`${a.n} explode! 5 de dano em todos os monstros.`);
    for(let k=0;k<c.units.length;k++) if(c.units[k].pv > 0) await hitMonster(k, 5, {spell:true, w:{n:""}, ally:true});
    a.pv = 0; a.acted = true;
    await allyAfter();
  },
  async allyJoke(b){
    if(busy) return; const c = C(), a = c.allies[+b.dataset.i]; if(!a || a.acted) return;
    cLog(pick([`${a.n} tropeça de propósito e faz uma reverência.`, `${a.n} imita o monstro. Ninguém ri.`, `${a.n} conta uma piada sobre um goblin e um balde.`, `${a.n} faz malabares com três ossos.`]));
    a.acted = true; busy = true; await allyAfter();
  },
  async allyWait(b){ if(busy) return; const a = C().allies[+b.dataset.i]; if(!a) return; a.acted = true; busy = true; await allyAfter(); },
  async allyAll(){
    if(busy) return; busy = true; lockButtons();
    const c = C();
    for(let i=0;i<c.allies.length;i++){ const a = c.allies[i]; if(a.pv > 0 && !a.acted && a.d && allyCanAct(a) && alive().length){ pickNextTarget(); await allyAttack(i); } }
    c.allies.forEach(a=>{ if(a.pv > 0 && allyCanAct(a) && !a.acted) a.acted = true; });
    await allyAfter();
  },
  splitD(b){ const c = C(), k = b.dataset.k; c.split[k] = Math.max(0, (c.split[k]||0) + +b.dataset.d); render(); },
  splitOk(){ if(busy) return; applySplit(); }
};

function viewGuide(){

  const body = typeof pg.b === "function" ? pg.b() : pg.b;
  return `
  ${bar("Guia do Aventureiro", state.ui.guideBack || "title")}
  <div class="sheet guide">
    <p class="muted small">Página ${i+1} de ${n}</p>
    <h3>${pg.t}</h3>
    ${body}
  </div>
  <div class="row"><button class="btn ghost" data-act="guidePg" data-d="-1" ${i===0?"disabled":""}>Anterior</button><button class="btn" data-act="guidePg" data-d="1" ${i===n-1?"disabled":""}>Próxima</button></div>
  <div class="gdots">${GUIDE.map((g,k)=>`<button class="${k===i?"on":""}" data-act="guideGo" data-p="${k}" aria-label="Página ${k+1}: ${esc(g.t)}"></button>`).join("")}</div>
  <div class="sheet"><h3>Índice</h3>${GUIDE.map((g,k)=>`<button class="linkbtn ${k===i?"on":""}" data-act="guideGo" data-p="${k}">${k+1}. ${g.t}</button>`).join("")}</div>`;
}
const actionsGuide = {
  guide(b){ state.ui = {gp:0, guideBack:b && b.dataset.back || "title"}; go("guide"); },
  guidePg(b){ state.ui.gp = Math.max(0, Math.min(GUIDE.length-1, (state.ui.gp||0) + +b.dataset.d)); render(); window.scrollTo(0,0); },
  guideGo(b){ state.ui.gp = +b.dataset.p; render(); window.scrollTo(0,0); }

const VIEWS = {guide:viewGuide, world:viewWorld, advclass:viewAdvClass, combat:viewCombat, settings:viewSettings, title:viewTitle, create:viewCreate, sheet:viewSheet, dungeon:viewDungeon, explore:viewExplore, city:viewCity, cemetery:viewCemetery, save:viewSave};
function render(){
  normalizeHands();
  if(state.screen==="create" && !state.draft) state.screen = "title";
  if(["sheet","dungeon","explore","city","advclass","world"].includes(state.screen) && !state.hero) state.screen = "title";
  if(state.screen==="world" && !state.world) state.screen = "sheet";
  if(state.world && state.hero && !(state.dungeon && state.dungeon.inside) && (state.screen==="dungeon" || (state.screen==="city" && !worldCityHere()))) state.screen = "world";
  if(state.screen==="explore" && !(state.dungeon && state.dungeon.inside)) state.screen = "sheet";
  if(state.screen==="combat" && !(state.combat && state.hero)) state.screen = state.hero && state.dungeon && state.dungeon.inside ? "explore" : "title";
  $("#app").innerHTML = (VIEWS[state.screen]||viewTitle)() + (state.ui.cult ? `<div class="lastbox"><div class="sheet" role="alertdialog"><h3>Armadilha!</h3><p>${esc(state.ui.cult.txt)}</p><p>Descartar um item do Cultista para ignorar a armadilha?</p>
    ${state.ui.cult.list.map((o,k)=>`<button class="btn" data-act="cultUse" data-k="${k}">Descartar ${esc(o.n.split(" (")[0])}${o.where === "armor" ? " (equipado)" : ""}</button>`).join("")}
    <button class="btn ghost" data-act="cultNo">Não, enfrentar a armadilha</button></div></div>` : "") + (COOP.on() && COOP.paused() ? `<div class="lastbox"><div class="sheet" role="alertdialog"><h3>Jogo pausado</h3><p>Aguardando ${esc(COOP.partner().name)} se reconectar. Nada se perde enquanto isso.</p></div></div>` : "");

      tray.appendChild(g); r.el = g;
