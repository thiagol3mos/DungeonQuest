/* =========================================================
   JOGO EM DUPLA (coop online, 2 jogadores)
   Masmorra compartilhada numa sala do Firebase Realtime Database (REST + EventSource).
   Cada jogador age no próprio aparelho; uma trava evita que os dois mexam na masmorra ao mesmo tempo.
   ========================================================= */
const COOP_FB = "https://dungeonquest-thiagolemos-default-rtdb.firebaseio.com";   // endereço do Realtime Database
const NET = {
  sim(){ return !!(state.settings && state.settings.coopSim); },
  base(){ return ((state.settings && state.settings.fbUrl) || COOP_FB || "").replace(/\/+$/,""); },
  ready(){ return this.sim() || !!this.base(); },
  url(path){ return `${this.base()}/salas/${path}.json`; },
  // ---- banco simulado (testes): localStorage compartilhado entre abas do mesmo navegador
  simDB(){ try{ return JSON.parse(localStorage.getItem("dq-sim-db") || "{}"); }catch(e){ return {}; } },
  simAt(db, parts){ let o = db; for(const p of parts){ if(o == null) return null; o = o[p]; } return o === undefined ? null : o; },
  /* o Firebase apaga listas/objetos vazios e transforma objetos com chaves numéricas em listas */
  fbNorm(v){
    if(v === null || typeof v !== "object") return v;
    if(Array.isArray(v)){ const a = v.map(x=>this.fbNorm(x)); return a.some(x=>x!==null && x!==undefined) ? a : null; }
    const o = {}; Object.keys(v).forEach(k=>{ const x = this.fbNorm(v[k]); if(x !== null && x !== undefined) o[k] = x; });
    const ks = Object.keys(o); if(!ks.length) return null;
    if(ks.every(k=>/^\d+$/.test(k))){ const mx = Math.max(...ks.map(Number)); if(ks.length*2 > mx){ const a = []; ks.forEach(k=>a[+k]=o[k]); return a; } }
    return o;
  },
  simWrite(path, val, merge){
    val = this.fbNorm(JSON.parse(JSON.stringify(val === undefined ? null : val)));
    const db = this.simDB(), parts = path.split("/").filter(Boolean);
    let o = db; for(let i=0;i<parts.length-1;i++){ o[parts[i]] = (o[parts[i]] && typeof o[parts[i]]==="object") ? o[parts[i]] : {}; o = o[parts[i]]; }
    const k = parts[parts.length-1];
    if(merge && val && typeof val === "object"){ o[k] = Object.assign((o[k] && typeof o[k]==="object") ? o[k] : {}, val); Object.keys(val).forEach(x=>{ if(val[x]===null) delete o[k][x]; }); }
    else if(val === null) delete o[k]; else o[k] = JSON.parse(JSON.stringify(val));
    localStorage.setItem("dq-sim-db", JSON.stringify(db));
    const code = parts[0]; (NET._sims[code]||[]).forEach(cb=>setTimeout(()=>cb(this.simAt(this.simDB(), [code])), 0));
  },
  _sims: {},
  async get(path){
    if(this.sim()) return this.simAt(this.simDB(), path.split("/").filter(Boolean));
    const r = await fetch(this.url(path)); if(!r.ok) throw new Error("rede"); return r.json();
  },
  async put(path, val){
    if(this.sim()) return this.simWrite(path, val, false);
    await fetch(this.url(path), {method:"PUT", body:JSON.stringify(val)});
  },
  async patch(path, obj){
    if(this.sim()) return this.simWrite(path, obj, true);
    await fetch(this.url(path), {method:"PATCH", body:JSON.stringify(obj)});
  },
  /* escuta a sala inteira; cb recebe sempre o espelho completo da sala */
  listen(code, cb){
    if(this.sim()){
      (this._sims[code] = this._sims[code] || []).push(cb);
      const onSt = e => { if(e.key === "dq-sim-db") cb(this.simAt(this.simDB(), [code])); };
      window.addEventListener("storage", onSt);
      setTimeout(()=>cb(this.simAt(this.simDB(), [code])), 0);
      return () => { this._sims[code] = (this._sims[code]||[]).filter(f=>f!==cb); window.removeEventListener("storage", onSt); };
    }
    let mirror = null, es = null, closed = false;
    const setAt = (path, data, merge) => {
      const parts = path.split("/").filter(Boolean);
      if(!parts.length){ mirror = merge ? Object.assign(mirror||{}, data) : data; return; }
      mirror = mirror || {}; let o = mirror;
      for(let i=0;i<parts.length-1;i++){ o[parts[i]] = (o[parts[i]] && typeof o[parts[i]]==="object") ? o[parts[i]] : {}; o = o[parts[i]]; }
      const k = parts[parts.length-1];
      if(merge && data && typeof data==="object"){ o[k] = Object.assign((o[k] && typeof o[k]==="object") ? o[k] : {}, data); Object.keys(data).forEach(x=>{ if(data[x]===null) delete o[k][x]; }); }
      else if(data === null) delete o[k]; else o[k] = data;
    };
    const open = () => {
      if(closed) return;
      es = new EventSource(this.url(code));
      es.addEventListener("put", e=>{ const m = JSON.parse(e.data); setAt(m.path, m.data, false); cb(mirror); });
      es.addEventListener("patch", e=>{ const m = JSON.parse(e.data); setAt(m.path, m.data, true); cb(mirror); });
      es.onerror = () => { if(es.readyState === 2 && !closed) setTimeout(open, 3000); };
    };
    open();
    return () => { closed = true; if(es) es.close(); };
  }
};

/* masmorra que passou pelo Firebase sem estar em texto: reconstrói listas e objetos vazios */
function fixDungeon(d){
  if(!d || typeof d !== "object") return d;
  if(Array.isArray(d.levels)){ const o = {}; d.levels.forEach((lv,i)=>{ if(lv) o[i] = lv; }); d.levels = o; }
  d.levels = d.levels || {}; d.corpses = d.corpses || []; d.log = d.log || [];
  Object.keys(d.levels).forEach(k=>{
    const lv = d.levels[k]; if(!lv){ delete d.levels[k]; return; }
    lv.segs = lv.segs || {}; lv.doors = lv.doors || {}; lv.occ = lv.occ || {}; if(lv.n === undefined) lv.n = +k;
    Object.values(lv.segs).forEach(sg=>{ sg.doors = sg.doors || []; if(sg.chests === undefined) sg.chests = 0; if(sg.mon){ [sg.mon, ...(sg.mon.extra||[])].forEach(g=>{ g.list = g.list || []; }); } });
  });
  return d;
}
const COOP = {
  room: null, close: null, lastPushed: "", pending: null, partnerBeat: null, partnerSeenAt: 0, lockSeenAt: 0, beatTimer: null, myLockN: null,
  on(){ return !!(state.coop && state.coop.code); },
  me(){ return state.coop && state.coop.me; },
  other(){ return this.me() === "A" ? "B" : "A"; },
  partner(){
    const r = this.room && this.room.players ? this.room.players[this.other()] : null;
    if(!r) return null;
    if(typeof r.data === "string"){ if(r.data !== this._pd){ this._pd = r.data; try{ this._pp = JSON.parse(r.data); }catch(e){ this._pp = null; } } return this._pp ? {...this._pp, beat:r.beat} : null; }
    return r;
  },
  online(p){ return !!p && (performance.now() - this.partnerSeenAt) < 16000; },
  /* o parceiro está na masmorra, vivo e conectado? */
  partnerHere(){ const p = this.partner(); return !!(p && p.inside && !p.dead && this.online(p)); },
  sameRoom(){ const p = this.partner(), d = state.dungeon; return !!(p && p.pos && d && d.pos && p.pos.level === d.pos.level && p.pos.seg === d.pos.seg); },
  lite(h){
    h = h || state.hero; if(!h) return null;
    return {name:h.name, race:h.race, race2:h.race2||null, arms:h.arms||2, pv:h.pv, pvMax:h.pvMax, torches:h.torches, bagN:h.bag.length, bagMax:bagMax(h),
      weapon:{n:h.weapon.n, unarmed:!!h.weapon.unarmed, two:!!h.weapon.two}, off:offs(h).map(o=>({n:o.n, shield:!!o.shield})),
      armor:Object.fromEntries(ARMOR_SLOTS.filter(s=>h.armor[s]).map(s=>[s,{n:h.armor[s].n}])), lamp:hasLamp(h), tongue:!!raceT("tongue", h)};
  },
  netDungeon(d){ const {pos, inside, ...rest} = d; return rest; },
  /* ---------- sala ---------- */
  code(){ const L = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join(""); },
  async create(){
    const d = state.dungeon, h = state.hero; if(!d || !h) return "Role uma masmorra antes.";
    let code = this.code();
    for(let i=0;i<5;i++){ const ex = await NET.get(code); if(!ex) break; code = this.code(); }
    await NET.put(code, {dungeon:JSON.stringify(this.netDungeon(d)), ver:1, torch:"A", players:{A:this.playerRec()}});
    state.coop = {code, me:"A"}; state.soloDungeon = null; this.lastPushed = JSON.stringify(this.netDungeon(d));
    persist(); this.connect(); return null;
  },
  async join(code){
    code = (code||"").trim().toUpperCase();
    if(!/^[A-Z0-9]{4}$/.test(code)) return "O código tem 4 letras ou números.";
    const room = await NET.get(code);
    if(!room || !room.dungeon) return "Sala não encontrada. Confira o código.";
    const P = {}; Object.entries(room.players || {}).forEach(([k,v])=>{ P[k] = this.unwrap(v); });
    const fresh = x => x && Date.now() - (x.beat||0) < 20000;
    let me;
    if(P.A && P.A.name === state.hero.name) me = "A";
    else if(!P.B || P.B.name === state.hero.name || !fresh(P.B)) me = "B";
    else return "Esta sala já tem dois aventureiros.";
    if(state.dungeon && !(state.coop && state.coop.code)) state.soloDungeon = state.dungeon;
    const nd = this.readDungeon(room.dungeon);
    state.dungeon = {...nd, pos:null, inside:false};
    state.coop = {code, me};
    await NET.put(`${code}/players/${me}`, this.playerRec());
    this.lastPushed = JSON.stringify(this.netDungeon(state.dungeon)); persist(); this.connect(); return null;
  },
  async leave(){
    if(!this.on()) return;
    const code = state.coop.code, me = this.me();
    try{ await NET.put(`${code}/players/${me}`, null); }catch(e){}
    if(this.close) this.close(); this.close = null; this.room = null;
    if(me === "B"){ state.dungeon = state.soloDungeon || null; }
    else if(state.dungeon){ state.dungeon = {...state.dungeon, inside:false}; }
    state.soloDungeon = null; state.coop = null; persist();
  },
  unwrap(r){ if(!r) return null; if(typeof r.data === "string"){ try{ return {...JSON.parse(r.data), beat:r.beat}; }catch(e){ return null; } } return r; },
  readDungeon(x){ return fixDungeon(typeof x === "string" ? JSON.parse(x) : JSON.parse(JSON.stringify(x))); },
  playerRec(){ const r = this.playerData(); return {data:JSON.stringify(r), beat:Date.now()}; },
  playerData(){
    const d = state.dungeon, h = state.hero;
    return {name:h ? h.name : "?", lite:this.lite(h), pos: d && d.inside ? d.pos : null, inside: !!(d && d.inside), dead: !h,
      own: !!(state.coop && state.coop.own), dark: state.coop ? (state.coop.dark ?? null) : null, beat: Date.now()};
  },
  /* ---------- conexão e sincronização ---------- */
  connect(){
    if(!this.on() || !NET.ready()) return;
    if(this.close) this.close();
    this.close = NET.listen(state.coop.code, room => this.onRoom(room));
    clearInterval(this.beatTimer);
    let wasPaused = false;
    this.beatTimer = setInterval(()=>{
      if(!this.on()) return;
      NET.patch(`${state.coop.code}/players/${this.me()}`, {beat:Date.now()}).catch(()=>{});
      // confere se o servidor tem a minha ficha de combate e de partilha; se uma gravação se perdeu, reenvia
      const rm = this.room || {}, me = this.me();
      if(state.coop.cp && rm.cp && typeof rm.cp[me] === "string" && rm.cp[me] !== JSON.stringify(state.coop.cp)) NET.put(`${state.coop.code}/cp/${me}`, JSON.stringify(state.coop.cp)).catch(()=>{});
      if(state.coop.sh && rm.share && (!rm.sh || rm.sh[me] !== JSON.stringify(state.coop.sh))) NET.put(`${state.coop.code}/sh/${me}`, JSON.stringify(state.coop.sh)).catch(()=>{});
      const pz = this.paused(); if(pz !== wasPaused){ wasPaused = pz; if(!busy) render(); }
    }, 5000);
  },
  onRoom(room){
    if(!this.on()) return;
    const prev = this.room; this.room = room || {};
    const p = this.partner();
    if(p && p.beat !== this.partnerBeat){ this.partnerBeat = p.beat; this.partnerSeenAt = performance.now(); }
    if(!p){ this.partnerBeat = null; }
    if(room && room.lock && (!prev || !prev.lock || prev.lock.n !== room.lock.n)) this.lockSeenAt = performance.now();
    // masmorra vinda do parceiro
    if(room && room.dungeon){
      const js = typeof room.dungeon === "string" ? room.dungeon : JSON.stringify(room.dungeon);
      if(js !== this.lastPushed || !state.dungeon){
        let nd = null; try{ nd = this.readDungeon(room.dungeon); }catch(e){}
        if(nd){ if(busy || this.myLock()) this.pending = nd; else this.applyDungeon(nd); }
      }
    }
    this.checkLight();
    this.receiveGifts(room);
    this.followTick();
    if(typeof COOPC !== "undefined") COOPC.onRoom(room);
    if(typeof SHARE !== "undefined") SHARE.tick();
    if(!busy && ["explore","sheet","dungeon","city","combat"].includes(state.screen)) render();
  },
  applyDungeon(nd){
    if(!nd) return;
    const d = state.dungeon || {};
    state.dungeon = {...nd, pos:d.pos || null, inside:!!d.inside};
    this.lastPushed = JSON.stringify(this.netDungeon(state.dungeon)); this.pending = null; mapVersion++;
  },
  /* chamado em todo persist(): envia a masmorra se mudou, e o meu registro de jogador */
  sync(){
    if(!this.on() || !this.room || !state.dungeon) return;
    const code = state.coop.code, nd = this.netDungeon(state.dungeon), js = JSON.stringify(nd);
    if(js !== this.lastPushed && !busy){
      this.lastPushed = js;
      NET.put(`${code}/dungeon`, js).then(()=>NET.put(`${code}/ver`, (this.room.ver||0)+1)).catch(()=>{});
    }
    NET.put(`${code}/players/${this.me()}`, this.playerRec()).catch(()=>{});
    if(typeof COOPC !== "undefined") COOPC.sync();
    if(!busy && this.myLock()) this.unlock();
  },
  /* ---------- trava: um age por vez na masmorra ---------- */
  myLock(){ return !!(this.room && this.room.lock && this.room.lock.by === this.me() && this.room.lock.n === this.myLockN); },
  lockedByPartner(){ const l = this.room && this.room.lock; return !!(l && l.by !== this.me() && performance.now() - this.lockSeenAt < 20000); },
  lock(){
    if(!this.on() || !this.room || !state.dungeon || !state.dungeon.inside) return Promise.resolve(true);
    if(this.myLock()) return Promise.resolve(true);
    if(this._locking) return this._locking;
    this._locking = this._lock().finally(()=>{ this._locking = null; });
    return this._locking;
  },
  async _lock(){
    if(this.lockedByPartner()) return false;
    if(this.pending) this.applyDungeon(this.pending);
    const n = Math.random().toString(36).slice(2);
    this.myLockN = n;
    await NET.put(`${state.coop.code}/lock`, {by:this.me(), n});
    await new Promise(r=>setTimeout(r, 250));
    const l = await NET.get(`${state.coop.code}/lock`);

  unlock(){ if(!this.on()) return; this.myLockN = null; NET.put(`${state.coop.code}/lock`, null).catch(()=>{}); if(this.room) this.room.lock = null; },
  receiveGifts(room){
    const g = room && room.gift && room.gift[this.me()]; if(!g || !state.hero) return;
    const got = state.coop.gotGifts = state.coop.gotGifts || [];
    Object.entries(g).forEach(([gid, js])=>{
      if(got.includes(gid)) { NET.put(`${state.coop.code}/gift/${this.me()}/${gid}`, null).catch(()=>{}); return; }
      let o = null; try{ o = typeof js === "string" ? JSON.parse(js) : js; }catch(e){}
      got.push(gid); if(got.length > 50) got.shift();
      if(o && o.item){ state.hero.bag.push(o.item); state.ui.msg = `${o.from} te enviou ${o.item.n.split(" (")[0]}.`; if(state.dungeon && state.dungeon.inside) log(`Você recebeu ${o.item.n.split(" (")[0]} de ${o.from}.`); }

    const lv = d.levels[d.pos.level]; if(!lv || !lv.segs[p.pos.seg]) return;

  /* ---------- tocha e luz ---------- */

  /* este herói precisa segurar uma tocha com a mão? (fora da dupla, sempre que não tem Lamparina) */
  holdsTorch(h){

    if(!this.partnerHere()) return true;
    return this.holder() === this.me() || !!state.coop.own;
  },
  /* os dois aventureiros estão na masmorra (regras de grupo: monstros rolados 2x, chefe com vida dobrada) */
  two(){ return this.on() && !!(state.dungeon && state.dungeon.inside) && this.partnerHere(); },
  paused(){ const p = this.partner(), d = state.dungeon; return !!(this.on() && d && d.inside && p && p.inside && !p.dead && !this.online(p)); },
  lit(){
    const h = state.hero; if(!h) return true;
    if(hasLamp(h) || raceT("tongue", h) || this.holdsTorch(h)) return true;
    const p = this.partner();
    return this.partnerHere() && this.sameRoom() && this.holder() === this.other();
  },
  async takeTorch(){
    if(!this.on()) return;

  },
  /* chamado ao mudar de sala e quando o parceiro se move */
  checkLight(moved){
    if(!this.on() || !state.dungeon || !state.dungeon.inside || !state.hero) return;
    const c = state.coop;
    if(this.lit()){
      if(c.dark != null){ c.dark = null; }
      if(c.own && this.partnerHere() && this.sameRoom() && this.holder() === this.other()){ c.own = false; fixHands(); state.ui.msg = "Você voltou para a luz da tocha e guardou a sua."; }
      return;
    }
    if(c.dark == null){ c.dark = 3; state.ui.msg = `Você está no escuro! Volte para perto de ${this.partner() ? this.partner().name : "seu parceiro"}, que está com a tocha.`; return; }
    if(moved){ c.dark--; if(c.dark <= 0) this.forceTorch(); }
  },
  forceTorch(){
    const h = state.hero, c = state.coop; c.dark = null;
    if(h.torches <= 0){
      const sp = h.spells.Luz && h.spells.Luz.left > 0, si = h.bag.findIndex(it=>it.n === "Pergaminho Mágico (Luz)");
      if(sp){ h.spells.Luz.left--; h.torches = 1; log("Na escuridão, você conjura Luz para ter uma tocha."); }
      else if(si >= 0 && !raceT("ogro")){ h.bag.splice(si,1); h.torches = 1; log("Na escuridão, você lê o Pergaminho de Luz para ter uma tocha."); }
      else { log("Sem tochas e sem luz, você se perde na escuridão."); killHero("Perdido na escuridão"); return; }
    }
    c.own = true; fixHands(); log("Longe da luz por muito tempo, você acende uma tocha própria.");
    state.ui.msg = "Você acendeu uma tocha própria: uma das mãos agora segura a tocha.";
  },
};
/* depois de mudar quem segura a tocha: o que não cabe nas mãos vai para a mochila (a tocha tem prioridade) */
function fixHands(){
  const h = state.hero; if(!h) return;
  const o = offs(h);
  while(handsUsed(h) > handsFree(h) && o.length){ h.bag.push(wCopy(o.pop())); }
  if(handsUsed(h) > handsFree(h) && !h.weapon.unarmed){ h.bag.push(wCopy(h.weapon)); h.weapon = UNARMED(); }
}


/* ---------- PARTILHA DOS ESPÓLIOS (depois de uma batalha em dupla) ----------
   room.share = texto {id, level, seg, items, part}; room.sh/A|B = texto {id, sel:{pid:hora}, ok, taken} */
const SHARE = {
  pendingPart: null, lastMine: "",
  room(){ const r = COOP.room && COOP.room.share; if(!r) return null; try{ return typeof r === "string" ? JSON.parse(r) : r; }catch(e){ return null; } },
  of(x, sh){ sh = sh || this.room(); if(!sh) return null;
    if(x === COOP.me()){ const m = state.coop.sh; return m && m.id === sh.id ? m : (state.coop.sh = {id:sh.id, sel:{}, ok:false, taken:false}); }
    const r = COOP.room && COOP.room.sh ? COOP.room.sh[x] : null; let o = null; try{ o = typeof r === "string" ? JSON.parse(r) : r; }catch(e){}
    return o && o.id === sh.id ? o : {sel:{}, ok:false, taken:false}; },
  active(){ const sh = this.room(), d = state.dungeon; return !!(COOP.on() && sh && state.hero && d && d.inside && sh.part.includes(COOP.me()) && d.pos.level === sh.level && d.pos.seg === sh.seg && !this.of(COOP.me(), sh).taken); },
  /* dono final de cada item: quem marcou primeiro */
  owner(pid, sh){ let best = null; sh.part.forEach(x=>{ const t = (this.of(x, sh).sel||{})[pid]; if(t && (!best || t < best.t || (t === best.t && x < best.x))) best = {x, t}; }); return best ? best.x : null; },
  create(items){
    const d = state.dungeon, part = this.pendingPart || [COOP.me()]; this.pendingPart = null;
    const sh = {id:Math.random().toString(36).slice(2,9), level:d.pos.level, seg:d.pos.seg, part, items:items.map(it=>({...it, pid:Math.random().toString(36).slice(2,9)}))};
    state.coop.sh = {id:sh.id, sel:{}, ok:false, taken:false};
    if(COOP.room) COOP.room.share = JSON.stringify(sh);
    NET.put(`${state.coop.code}/share`, JSON.stringify(sh)).catch(()=>{});
    log(`Espólios para dividir: ${items.map(it=>it.n.split(" (")[0]).join("; ")}.`);
  },
  push(){ if(!COOP.on() || !state.coop.sh) return; const js = JSON.stringify(state.coop.sh); if(js !== this.lastMine){ this.lastMine = js; NET.put(`${state.coop.code}/sh/${COOP.me()}`, js).catch(()=>{}); } },
  toggle(pid){
    const sh = this.room(); if(!sh) return; const m = this.of(COOP.me(), sh); if(m.ok) return;
    const others = sh.part.filter(x=>x !== COOP.me());
    if(others.some(x=>(this.of(x, sh).sel||{})[pid])) return;
    if(m.sel[pid]) delete m.sel[pid];
    else { if(state.hero.bag.length + Object.keys(m.sel).length >= bagMax()){ state.ui.msg = "Não cabe mais nada na sua mochila."; render(); return; } m.sel[pid] = Date.now(); }
    this.push(); persist(); render();
  },
  confirm(on){ const sh = this.room(); if(!sh) return; const m = this.of(COOP.me(), sh); m.ok = !!on; this.push(); persist(); render(); this.tick(); },
  /* quando todos confirmam: cada um pega os seus; o último a pegar deixa o resto na sala e fecha a partilha */
  tick(){
    const sh = this.room(); if(!sh || !COOP.on() || !state.hero || busy) return;
    const me = COOP.me(), m = this.of(me, sh);
    if(!sh.part.includes(me) || m.taken) return this.cleanup(sh);
    if(!sh.part.every(x=>this.of(x, sh).ok || this.of(x, sh).taken)) return;
    const mine = sh.items.filter(it=>this.owner(it.pid, sh) === me);
    mine.forEach(it=>{ const {pid, ...item} = it; state.hero.bag.push(item); });
    m.taken = true; this.push();
    log(mine.length ? `Você pegou ${mine.map(it=>it.n.split(" (")[0]).join("; ")}.` : "Você não pegou nenhum espólio.");
    persist(); render();
    this.cleanup(sh);
  },
  cleanup(sh){
    if(!sh.part.every(x=>this.of(x, sh).taken)) return;
    const me = COOP.me(); if(sh.part.slice().sort()[0] !== me && sh.part.includes(me)) return;
    COOP.lock().then(ok=>{
      if(!ok || !this.room() || this.room().id !== sh.id) return;
      const lv = state.dungeon.levels[sh.level], seg = lv && lv.segs[sh.seg];
      const rest = sh.items.filter(it=>!this.owner(it.pid, sh));
      if(seg && rest.length){ seg.pile = (seg.pile||[]).concat(rest); log(`Ficaram na sala: ${rest.map(it=>it.n.split(" (")[0]).join("; ")}.`); }
      if(COOP.room) COOP.room.share = null;
      NET.put(`${state.coop.code}/share`, null).catch(()=>{});
      mapVersion++; persist(); render();
    });
  },
  view(){
    if(!this.active()) return "";
    const sh = this.room(), me = COOP.me(), m = this.of(me, sh), pn = COOP.partner() ? COOP.partner().name : "seu parceiro";
    const otherSel = pid => sh.part.some(x=>x !== me && (this.of(x, sh).sel||{})[pid]);
    const others = sh.part.filter(x=>x !== me), othersOk = others.every(x=>this.of(x, sh).ok || this.of(x, sh).taken);
    const free = bagMax() - state.hero.bag.length - Object.keys(m.sel).length;
    return `<div class="sheet"><h3>Espólios da batalha</h3>
      <p class="small">Marque o que você quer levar. O que ${esc(pn)} marcar fica bloqueado para você. ${free > 0 ? `Cabem mais ${free} na sua mochila.` : "Sua mochila não comporta mais nada."}</p>
      ${sh.items.map(it=>{ const mine = !!m.sel[it.pid], theirs = !mine && otherSel(it.pid);
        return `<button class="opt ${mine?"on":""}" data-act="shareToggle" data-u="${it.pid}" ${theirs || m.ok ? "disabled" : ""}><b>${esc(itemName(it))}</b><span>${esc(itemDesc(it) || "")}${theirs ? ` · ${esc(pn)} escolheu` : ""}</span></button>`; }).join("")}
      <p class="small">${esc(pn)}: ${othersOk ? "pronto" : "escolhendo..."}</p>
      ${m.ok ? `<button class="btn ghost" data-act="shareConfirm" data-v="0">Cancelar</button><p class="muted small">Aguardando ${esc(pn)} confirmar.</p>`
             : `<button class="btn" data-act="shareConfirm" data-v="1">Pegar itens${Object.keys(m.sel).length ? ` (${Object.keys(m.sel).length})` : ""}</button>`}</div>`;
  },
};

/* ---------- COMBATE EM DUPLA ----------
   room.combat  = texto com a parte comum (monstros, fase, turno, dano pendente, diário)
   room.cp/A|B  = texto com a ficha de combate de cada jogador (terminou o turno, dano assumido, recebeu, morreu/fugiu) */
const COOPC = {
  SHARED: ["coop","id","level","seg","units","phase","round","part","pending","log","mt","kill","par"],
  lastJs: "", lastCpJs: "", pendingShared: null,
  on(){ return COOP.on() && !!(state.combat && state.combat.coop); },
  pick(c){ const o = {}; this.SHARED.forEach(k=>{ if(c[k] !== undefined) o[k] = c[k]; }); return o; },
  my(){ const c = state.coop; if(!c.cp || !state.combat || c.cp.id !== state.combat.id) c.cp = {id: state.combat ? state.combat.id : null, done:-1, applied:-1, alloc:{pv:0, ar:{}}}; return c.cp; },
  cp(x){
    if(x === COOP.me()) return this.my();
    const r = COOP.room && COOP.room.cp ? COOP.room.cp[x] : null;
    let o = null; try{ o = typeof r === "string" ? JSON.parse(r) : r; }catch(e){}
    return o && state.combat && o.id === state.combat.id ? o : {done:-1, applied:-1, alloc:{pv:0, ar:{}}};
  },
  inFight(x){ const p = this.cp(x); return !(p.dead || p.fled || p.left); },
  alive(){ const c = state.combat; return c && c.part ? c.part.filter(x=>this.inFight(x)) : []; },
  leader(){ const a = this.alive().slice().sort(); return a[0]; },
  allDone(){ const c = state.combat; return this.alive().every(x=>this.cp(x).done === c.round); },
  allApplied(){ const c = state.combat; return this.alive().every(x=>this.cp(x).applied === c.round); },
  allocOf(x){ const p = this.cp(x), c = state.combat; return p.allocRound === (c && c.round) && p.alloc ? p.alloc : {pv:0, ar:{}}; },
  sum(a){ return (a.pv||0) + Object.values(a.ar||{}).reduce((s,v)=>s+(v||0),0); },
  armorSum(a){ return Object.values(a.ar||{}).reduce((s,v)=>s+(v||0),0); },
  /* envio: parte comum (se mudou) e a minha ficha */
  sync(){
    const c = state.combat; if(!this.on() || !COOP.room) return;
    const js = JSON.stringify(this.pick(c));
    if(js !== this.lastJs){ this.lastJs = js; NET.put(`${state.coop.code}/combat`, js).catch(()=>{}); }
    const cj = JSON.stringify(this.my());
    if(cj !== this.lastCpJs){ this.lastCpJs = cj; NET.put(`${state.coop.code}/cp/${COOP.me()}`, cj).catch(()=>{}); }
  },
  /* recebido do parceiro */
  onRoom(room){
    const js = room && typeof room.combat === "string" ? room.combat : null;
    if(js && js !== this.lastJs){
      let sh = null; try{ sh = JSON.parse(js); }catch(e){}
      if(sh){ if(busy) this.pendingShared = sh; else { this.lastJs = js; this.apply(sh); } }
    }
    this.tick();
  },
  apply(sh){
    const me = COOP.me(), d = state.dungeon;
    if(!sh.part || !sh.part.includes(me) || !state.hero || !d || !d.inside) return;
    if(state.coop.cp && state.coop.cp.id === sh.id && (state.coop.cp.dead || state.coop.cp.fled || state.coop.cp.left)) return;
    const fresh = !state.combat || state.combat.id !== sh.id;
    if(fresh && (d.pos.level !== sh.level || d.pos.seg !== sh.seg)) return;
    const c = fresh ? {sel:0, fury:0, heroPar:0, alloc:{}, hits:0} : state.combat;
    Object.assign(c, sh); state.combat = c;
    if(fresh){ fxPops = []; monHit = {}; monAtk = {}; monDie = {}; heroAtk = null; heroDieAt = 0; this.my(); }
    pickNextTarget();
    this.selfEffects();
    if(state.combat && state.screen !== "combat") state.screen = "combat";
  },
  /* efeitos dos monstros que caíram em mim (rolados no aparelho do parceiro) */
  selfEffects(){
    const c = state.combat, me = COOP.me(), m = this.my(); if(!c) return;
    if(c.par && c.par[me] && m.parRound !== c.round){ m.parRound = c.round; c.heroPar = (c.heroPar||0) + c.par[me]; }
    if(c.kill && c.kill[me] && !m.dead){ const cause = c.kill[me]; m.dead = true; this.sync(); finishDeath(cause); }
  },
  /* passos automáticos: turno dos monstros, novo turno, paralisia */
  tick(){
    if(!this.on() || busy) return;
    const c = state.combat, me = COOP.me(), m = this.my();
    if(c.phase === "hero" && m.done !== c.round && c.heroPar > 0 && !m.dead){
      c.heroPar--; m.done = c.round; cLog(`${state.hero.name} está paralisado e perde o turno.`); persist();
    }
    if(this.leader() !== me) return;
    if(c.phase === "hero" && this.alive().length && this.allDone() && c.mt !== c.round && alive().length){
      if(this._busy) return; this._busy = true;
      COOP.lock().then(ok=>{ this._busy = false; if(ok && this.on() && !busy && C().phase === "hero" && C().mt !== C().round && this.allDone()) runMonsterTurnCoop(); });
    } else if(c.phase === "alloc" && this.allApplied()){
      if(this._busy) return; this._busy = true;
      COOP.lock().then(ok=>{ this._busy = false; if(ok && this.on() && !busy && C().phase === "alloc" && this.allApplied()){ C().round++; C().phase = "hero"; C().pending = null; persist(); render(); } });
    }
  },
  /* meu turno acabou */
  finishTurn(){ const m = this.my(); m.done = state.combat.round; persist(); render(); setTimeout(()=>this.tick(), 50); },
};
async function runMonsterTurnCoop(){
  const c = C();
  busy = true; c.phase = "mon"; c.mt = c.round; render(); lockButtons();
  rollLog = []; const tr = $("#etray"); if(tr) tr.innerHTML = "";
  const targets = COOPC.alive();
  const pickT = () => targets[Math.floor(Math.random()*targets.length)];
  const hasDeuses = x => x === COOP.me() ? ARMOR_SLOTS.some(s=>state.hero.armor[s] && /dos Deuses/.test(state.hero.armor[s].n)) : Object.values((COOP.partner()||{}).lite?.armor||{}).some(p=>/dos Deuses/.test(p.n));
  const nameOf = x => x === COOP.me() ? state.hero.name : (COOP.partner() ? COOP.partner().name : "?");
  let total = 0, poison = 0; c.kill = {}; c.par = {};
  for(let i=0;i<c.units.length;i++){
    const u = c.units[i];
    if(u.pv <= 0) continue;
    if(u.frozen){ u.frozen--; cLog(`${u.name} está congelado e não ataca.`); continue; }
    if(u.doom){ const t = pickT(); cLog(`${u.name} desfere o golpe de Morte Súbita em ${nameOf(t)}!`);
      if(hasDeuses(t)){ cLog("A armadura dos Deuses protege da Morte Súbita."); u.doom = false; } else { c.kill[t] = `Morte Súbita de ${u.name}`; u.doom = false; } }
    let dmg = Math.max(0, u.dano - monDmgCut(u));
    if(u.fireNext){ u.fireNext = false; dmg += 10; cLog(`${u.name} ataca envolto em fogo: +10 de dano!`); }
    if(u.magicNext){ dmg += u.magicNext; cLog(`A magia de ${u.name} soma ${u.magicNext} ao dano.`); u.magicNext = 0; }
    if(u.paralNext){ const [p] = await roll("Paralisia", 1); const t = pickT(); c.par[t] = p; u.paralNext = false; cLog(`${u.name} paralisa ${nameOf(t)} por ${p} turno${p>1?"s":""}!`); }
    const abil = ABILITIES.filter(a=>has(u,a));
    let exploded = false;
    if(abil.length){
      const [r] = await roll(u.name, 1);
      if(r === 1){
        if(has(u,"Explosivo")){ dmg = u.pv; u.pv = 0; exploded = true; cLog(`${u.name} explode causando ${dmg} de dano!`); }
        if(has(u,"Fogo")){ u.fireNext = true; cLog(`${u.name} pega fogo: o próximo ataque causa +10.`); }
        if(has(u,"Horda")){ c.units.push({key:"Orc", name:"Orc", pv:6, max:6, dano:3, tr:"", g:-1}); cLog("Horda! Um Orc entra na sala."); }
        if(has(u,"Magia")){ const [mg] = await roll(`Magia de ${u.name}`, 1); u.magicNext = mg; cLog(`${u.name} prepara uma magia: +${mg} no próximo ataque.`); }
        if(has(u,"Morte Súbita")){ u.doom = true; cLog(`${u.name} prepara um golpe mortal. O próximo ataque dele vai matar alguém!`); }
        if(has(u,"Necromancia")){ c.units.push({key:"Esqueleto", name:"Esqueleto", pv:4, max:4, dano:1, tr:"Morto-Vivo", g:-1}); cLog("Necromancia! Um Esqueleto se levanta."); }
        if(has(u,"Regeneração")){ const before = u.pv; u.pv = Math.min(u.max, u.pv+6); if(u.pv>before){ cLog(`${u.name} se regenera (+${u.pv-before} PV).`); pop(i, "+"+(u.pv-before), "#6af06a"); } }
        if(has(u,"Paralisar")){ u.paralNext = true; cLog(`${u.name} prepara um golpe paralisante para o próximo ataque.`); }
      }
    }
    if(has(u,"Veneno") && !poisonImmune()) poison += dmg; else total += dmg;
    monAtk[i] = performance.now() + 320;
    if(!exploded) cLog(`${u.name} ataca: ${dmg} de dano${has(u,"Veneno") ? " de veneno" : ""}.`);
  }
  if(total + poison === 0){ c.round++; c.phase = "hero"; c.pending = null; }
  else { c.pending = {total, poison}; c.phase = "alloc"; cLog(`Os monstros causam ${total+poison} de dano ao grupo. Dividam entre vocês.`); }
  busy = false; persist(); render();
  COOPC.selfEffects();
}
/* recebo a minha parte do dano */
async function applyCoopDamage(){
  const c = C(), h = state.hero, m = COOPC.my(), a = COOPC.allocOf(COOP.me());
  let absorbed = 0;
  Object.entries(a.ar||{}).forEach(([slot, v])=>{
    const p = h.armor[slot]; if(!p || !v) return;
    p.cur = armorCur(p) - v; absorbed += v;
    if(p.cur <= 0){ cLog(`${slot} (${p.n.split(" (")[0]}) de ${h.name} foi destruído.`); if(!p.stone) H(h).armorLost++; delete h.armor[slot]; }
  });
  let toPV = a.pv || 0;
  if(toPV > 0 && hasShield()){ const r = Math.min(toPV, shieldVal()); toPV -= r; if(r) cLog(`O escudo de ${h.name} segura ${r} de dano.`); }
  if(toPV > 0 && c.ethereal){ toPV -= 1; }
  if(toPV > 0 && h.shield > 0){ const r = Math.min(h.shield, toPV); h.shield -= r; toPV -= r; cLog(`O Escudo Mágico absorve ${r} de dano.`); }
  h.pv = Math.max(0, h.pv - toPV);
  heroHitUntil = performance.now() + 450;
  cLog(`${h.name} recebe ${absorbed + (a.pv||0)} de dano${absorbed ? ` (${absorbed} na armadura)` : ""} e fica com ${h.pv}/${h.pvMax} PV.`);
  m.applied = c.round;
  const revive = h.pv <= 0 && samambro();
  if(h.pv <= 0 && !revive){ busy = true; lockButtons(); heroDieAt = performance.now(); await new Promise(r=>setTimeout(r, 900)); heroDieAt = 0; busy = false; m.dead = true; persist(); finishDeath(`Morto em combate ao lado de ${COOP.partner() ? COOP.partner().name : "um amigo"}`); return; }
  if(revive) cLog(`${h.name} se levanta com 1 PV e continua lutando.`);
  persist(); render(); setTimeout(()=>COOPC.tick(), 50);
}

function goblinGroup(g){ return !!g && /^Goblin/.test(monKey(g)); }
const actionsApito = {
  whistle(){
    const seg = curSeg(); if(!state.dungeon || !state.dungeon.inside){ state.ui.msg = "Não há Goblins por aqui."; render(); return; }
    const gs = seg.mon ? [seg.mon, ...(seg.mon.extra||[])] : [];
    const gob = gs.filter(goblinGroup);
    if(!gob.length){ log("Você apita, mas não há Goblins nesta sala."); state.ui.msg = "Não há Goblins nesta sala."; persist(); render(); return; }
    const n = gob.reduce((a,g)=>a+g.list.length,0), rest = gs.filter(g=>!goblinGroup(g));
    if(!rest.length) seg.mon = null; else { const [f, ...others] = rest; f.extra = others.length ? others : undefined; f.qty = f.list.length; seg.mon = f; }
    log(`Você sopra o Apito Goblin: ${n} Goblin${n>1?"s":""} fo${n>1?"gem":"ge"} apavorado${n>1?"s":""}.`);
    state.ui.bagSel = null; mapVersion++; persist(); render();
  },

  },

    else { h.bag.push(h.armor[s]); delete h.armor[s]; }
    state.ui.eqSel = null; persist(); render();
  },
  repairOne(b){
    const h = state.hero, p = h.armor[b.dataset.s]; if(!p) return;
    if(b.dataset.how === "coin"){ if(h.coins<1) return; h.coins--; }
    else { if(h.torches<1) return; if(state.dungeon && state.dungeon.inside){ if(!spendTorch(1, "Consertando a armadura")){ persist(); render(); return; } } else h.torches--; }
    p.cur = p.pv;
    if(state.dungeon && state.dungeon.inside) log(`Você consertou ${p.n.split(" (")[0]}.`);
    persist(); render();
  },
  fight(b){ startCombat(b.dataset.surprise === "1"); },
  target(b){ C().sel = +b.dataset.i; persist(); render(); },
  attack(b){
    const c = C(), h = state.hero; if(handsFree() === 0) return;
    let wn;
    if(c.chain && c.chain.length) wn = c.chain.shift();
    else {
      const d = b && b.dataset.w;
      wn = d === undefined || d === "m" ? "m" : +d;
      if(wn === "m" && attacksPerTurn() > 1) c.chain = offWeapons(h).map(x=>x.i).slice(0, attacksPerTurn()-1);
    }
    heroAttack("weapon", wn);
  },
  playDead(){ if(!raceT("zumbi")) return; cLog("Você se faz de morto... e escapa quando os monstros se distraem."); fleeCombat(); },
  horn(){ heroAttack("horn"); },
  crates(){ if(!busy) openCrates(); },
  refuge(){ useRefuge(); },
  cart(){ if(!busy) mineCart(); },
  bite(){ const e = state.hero.armor.Elmo; if(e && e.bite) heroAttack("bite"); },
  cspell(b){ heroSpell(b.dataset.n); },
  citem(b){ heroItem(+b.dataset.i); },
  alloc(b){ const c = C(); const s = b.dataset.s; c.alloc[s] = Math.max(0, (c.alloc[s]||0) + +b.dataset.d); render(); },
  allocAll(){ const c = C(), h = state.hero; let left = c.pending.total; c.alloc = {};
    ARMOR_SLOTS.filter(s=>h.armor[s] && armorCur(h.armor[s])>0).sort((a,b)=>armorCur(h.armor[b])-armorCur(h.armor[a])).forEach(s=>{ const a = Math.min(left, armorCur(h.armor[s])); if(a){ c.alloc[s] = a; left -= a; } }); render(); },
  allocNone(){ C().alloc = {}; render(); },
  allocOk(){ const c = C(); applyHeroDamage(c.alloc, c.pending.total, c.pending.poison); },
  win(){ winCombat(); },
  async rechargePick(b){
    const c = C(), h = state.hero, rm = h.spells["Recarregar Mana"], n = b.dataset.n;
    if(!rm || rm.left<=0 || !h.spells[n]) return;
    c.recharge = false; rm.left--; H().magic++;
    h.spells[n].left = Math.min(h.spells[n].max, h.spells[n].left+1);
    busy = true; lockButtons(); cLog(`Recarregar Mana: ${n} recupera 1 uso.`);
    await afterHeroAction();
  },
  rechargeCancel(){ C().recharge = false; render(); },
  async stonePick(b){
    const c = C(), h = state.hero, sp = h.spells["Armadura de Pedra"], sl = b.dataset.s;
    if(!sp || sp.left<=0 || h.armor[sl]) return;
    c.stonePick = false; sp.left--; H().magic++; stoneArmor(sl);
    busy = true; lockButtons(); cLog(`Armadura de Pedra: você ganha ${sl} de Pedra (5 PV).`);
    await afterHeroAction();
  },
  stoneCancel(){ C().stonePick = false; render(); },
  stoneOut(b){
    const h = state.hero, sp = h.spells["Armadura de Pedra"], sl = b.dataset.s;
    if(!sp || sp.left<=0 || h.armor[sl]) return;
    sp.left--; H().magic++; stoneArmor(sl); state.ui.stonePick = false;
    log(`Armadura de Pedra: você ganha ${sl} de Pedra (5 PV).`);
    persist(); render();
  },
  stoneOutCancel(){ state.ui.stonePick = false; render(); },
  takeStash(){ takeStash(); persist(); render(); },
  later(){ state.ui.bagFull = false; log("Você deixou os itens aqui para pegar depois."); persist(); render(); },
  startPick(){
    const h = state.hero, seg = curSeg(), p = {};
    h.bag.forEach((_,i)=>p["b"+i] = true);
    let free = bagMax() - h.bag.length;
    seg.stash.forEach((_,i)=>{ p["s"+i] = free > 0; if(free>0) free--; });
    state.ui.pick = p; render();
  },
  togglePick(b){ state.ui.pick[b.dataset.k] = !state.ui.pick[b.dataset.k]; render(); },
  cancelPick(){ state.ui.pick = null; render(); },
  confirmPick(){
    const h = state.hero, seg = curSeg(), p = state.ui.pick;
    const keep = [], gone = [];
    h.bag.forEach((it,i)=>(p["b"+i] ? keep : gone).push(it));
    seg.stash.forEach((it,i)=>(p["s"+i] ? keep : gone).push(it));
    if(keep.length > bagMax()) return;
    h.bag = keep; seg.stash = [];
    state.ui.pick = null; state.ui.bagFull = false;
    log(gone.length ? `Você organizou a mochila e descartou: ${gone.map(it=>it.n.split(" (")[0]).join("; ")}.` : "Você organizou a mochila.");
    mapVersion++; persist(); render();
  },
  askDelGrave(b){ state.ui.delGrave = +b.dataset.i; render(); },
  cancelDelGrave(){ state.ui.delGrave = null; render(); },
  delGrave(b){ state.cemetery.splice(+b.dataset.i, 1); state.ui.delGrave = null; persist(); render(); },
  setSkin(b){
    const was = isZ();
    state.settings.skin = b.dataset.v;
    applySkin();
    if(was !== isZ()) cam.z = isZ() ? cam.z/4 : cam.z*4;
    cam.z = clampZ(cam.z); centerOn = true;
    persist(); render();
  },


  rest(){
    const h = state.hero, free = hasClass("Campeão"); if((h.coins<1 && !free) || !needRest(h)) return;
    if(!free) h.coins--; h.pv = h.pvMax; Object.values(h.spells).forEach(s=>s.left=s.max);
    party(h).forEach(p=>{ p.pv = p.max; if(p.spells) Object.values(p.spells).forEach(x=>x.left = x.max); });
    state.ui.cityMsg = "Você descansou. PV e magias recuperados.";
    persist(); render();
  },
  buyTorch(){ const h = state.hero; if(h.coins<1||h.torches>=10) return; h.coins--; h.torches++; state.ui.cityMsg = "Você comprou 1 tocha."; persist(); render(); },
  repair(b){
    const h = state.hero, s = b && b.dataset.s || ARMOR_SLOTS.find(s=>h.armor[s] && armorCur(h.armor[s]) < h.armor[s].pv), p = s && h.armor[s];
    if(h.coins<1 || !p || armorCur(p) >= p.pv) return;
    const before = armorCur(p); h.coins--; p.cur = p.pv;
    state.ui.cityMsg = `${itemName(p)} consertado: ${before}/${p.pv} → ${p.pv}/${p.pv} PV.`;
    persist(); render();
  },
  buyShop(b){
    const h = state.hero, it = shopStock()[+b.dataset.i];
    if(!it || it.soon || it.sold || h.coins < it.price || h.bag.length >= bagMax()) return;
    h.coins -= it.price; it.sold = true; const {price, sold, ...item} = it; h.bag.push(fixWearable(item));
    state.ui.cityMsg = `Você comprou ${it.n.split(" (")[0]} por ${it.price} moedas.`;
    persist(); render();
  },
  brew(){ const h = state.hero; if(!hasClass("Alquimista") || h.coins<50 || h.bag.length>=bagMax()) return; h.coins -= 50; h.bag.push({n:"Poção de Vida (recupera todos os PV)"}); if(state.dungeon && state.dungeon.inside) log("Você preparou uma Poção de Vida."); persist(); render(); },
  fold(b){ const k = b.dataset.k; state.settings.fold = state.settings.fold || {}; state.settings.fold[k] = !state.settings.fold[k]; persist(); render(); },
  buyAdv(b){
    const h = state.hero, a = ADV_BY_NAME[b.dataset.n];
    if(!a || hasClass(a.n) || !advStatus(a,h).ok || h.coins < a.cost) return;
    h.coins -= a.cost; h.adv = (h.adv||[]).concat(a.n);
    h.pvMax += a.pv; h.pv += a.pv;
    if(a.loseCura) delete h.spells["Cura"];
    if(a.n === "Cavaleiro" && !partyOf("mount", h).length && animalSlots(h) > 0) party(h).push({id:newPid(), kind:"mount", n:"Cavalo", pv:10, max:10, d:"1", key:"Cavalo"});
    if(a.fixed) Object.entries(a.fixed).forEach(([n,q])=>{ const sp = h.spells[n] || {max:0,left:0}; sp.max += q; sp.left += q; h.spells[n] = sp; });
    const needs = []; (a.give||[]).forEach(([t,q])=>{ for(let i=0;i<q;i++) needs.push(t); });
    state.ui.advRoll = needs.length ? {cls:a.n, needs, got:[]} : null;
    state.ui.advMsg = `${h.name} agora é ${a.n}!${a.pv ? ` +${a.pv} PV.` : ""}`;
    persist(); render(); window.scrollTo(0,0);
  },
  async rollAdvSpell(){
    const ar = state.ui.advRoll, h = state.hero; if(!ar || ar.got.length >= ar.needs.length) return;
    busy = true; lockButtons();
    const t = ar.needs[ar.got.length], v = await rollInto($("#tray"), SPELL_TABLES[t].dice);
    const n = spellRollName(t, SPELL_TABLES[t].dice === 2 ? v[0]+v[1] : v[0]);
    ar.got.push(n);
    const sp = h.spells[n] || {max:0,left:0}; sp.max++; sp.left++; h.spells[n] = sp;
    busy = false; persist(); render();
  },
  advDone(){ state.ui.advRoll = null; persist(); render(); },
  lockItem(b){ const it = state.hero.bag[+b.dataset.i]; if(!it) return; it.locked = !it.locked; persist(); render(); },
  sell(b){
    const h = state.hero, i = +b.dataset.i, it = h.bag[i];
    if(!it || it.locked || isCursed(it)) return;
    const v = sellValue(it);
    h.coins += v; h.bag.splice(i,1); H(h).sold++;
    state.ui.cityMsg = `Você vendeu ${it.n.split(" (")[0]} por ${v} moeda${v===1?"":"s"}.`;
    persist(); render();
  },

  askDeath(){ state.ui.confirmDeath = true; render(); setTimeout(()=>{ const i=$("#deathCause"); if(i) i.focus(); },30); },
  cancelDeath(){ state.ui = {}; render(); },
  die(){
    const cause = ($("#deathCause").value||"").trim() || "Causa desconhecida";
    killHero(cause);
    persist(); render(); window.scrollTo(0,0);
  },
  copy(){
    const ta = $("#exportCode");
    const ok = () => { toastMsg = "Código copiado."; $("#toast").textContent = toastMsg; };
    const fallback = () => { ta.focus(); ta.select(); toastMsg = "Código selecionado. Toque em Copiar no menu do iPhone."; $("#toast").textContent = toastMsg; };
    try{ navigator.clipboard.writeText(ta.value).then(ok, fallback); }catch(e){ fallback(); }
  },
  async pasteSave(){
    const say = m => { toastMsg = m; $("#toast").textContent = m; };
    let txt = "";
    try{ txt = await navigator.clipboard.readText(); }
    catch(e){ say("O aparelho não liberou a área de transferência. Toque e segure no campo e escolha Colar."); return; }
    if(!txt || !txt.trim()){ say("A área de transferência está vazia. Copie o código primeiro."); return; }
    $("#importCode").value = txt.trim();
    try{ decodeSave(txt); say("Código colado. Confira e toque em Restaurar este save."); }
    catch(e){ say("O texto copiado não parece um save do Dungeon Quest. Confira se copiou o código inteiro."); }
  },
  async cloudSend(){
    if(busy || !NET.ready()) return;
    busy = true; lockButtons(); toastMsg = "Enviando...";
    const t = $("#toast"); if(t) t.textContent = toastMsg;
    try{
      const L = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = null;
      for(let i=0;i<6 && !code;i++){ const c = Array.from({length:6},()=>L[Math.floor(Math.random()*L.length)]).join(""); const ex = await NET.get(`backups/${c}`); if(ex == null) code = c; }
      if(!code) throw new Error("código");
      const old = state.settings && state.settings.lastBackup;
      await NET.put(`backups/${code}`, {d:encodeSave(), t:Date.now()});
      const back = await NET.get(`backups/${code}`);
      if(!back || !back.d) throw new Error("gravação");
      if(old && old !== code) NET.put(`backups/${old}`, null).catch(()=>{});
      state.settings = state.settings || {}; state.settings.lastBackup = code;
      state.ui.cloudCode = code; toastMsg = "Backup enviado. Use o código no outro aparelho.";
    }catch(e){ toastMsg = "Não foi possível enviar o backup. Confira a internet e tente de novo."; }
    busy = false; persist(); render();
  },
  cloudCopy(){
    const c = state.ui.cloudCode; if(!c) return;
    const done = ()=>{ toastMsg = "Código copiado."; const t = $("#toast"); if(t) t.textContent = toastMsg; };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(done).catch(done); else done();
  },
  cloudCancel(){ state.ui.cloudAsk = false; render(); },
  async cloudLoad(b){
    if(busy || !NET.ready()) return;
    const inp = $("#cloudIn"), code = ((inp ? inp.value : state.ui.cloudIn) || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
    state.ui.cloudIn = code;
    if(code.length !== 6){ toastMsg = "O código tem 6 letras e números."; render(); return; }
    if(!b.dataset.ok){ state.ui.cloudAsk = true; toastMsg = ""; render(); return; }
    busy = true; lockButtons(); toastMsg = "Carregando..."; const t = $("#toast"); if(t) t.textContent = toastMsg;
    try{
      const rec = await NET.get(`backups/${code}`);
      if(!rec || !rec.d){ busy = false; state.ui.cloudAsk = false; toastMsg = "Código não encontrado. Ele pode ter sido usado ou digitado errado."; render(); return; }
      const sv = decodeSave(rec.d), keepFb = state.settings && state.settings.fbUrl;
      state = {...freshState(), ...sv, screen:"title", ui:{}};
      if(keepFb && state.settings && !state.settings.fbUrl) state.settings.fbUrl = keepFb;
      migrate(); applySkin(); mapVersion++;
      NET.put(`backups/${code}`, null).catch(()=>{});
      busy = false; persist(); toastMsg = ""; render();
    }catch(e){ busy = false; state.ui.cloudAsk = false; toastMsg = "Não foi possível carregar. Confira a internet e o código."; render(); }
  },
  import(){
    const code = $("#importCode").value;
    if(!code.trim()){ toastMsg = "Cole um código antes de restaurar."; $("#toast").textContent = toastMsg; return; }
    try{
      const s = decodeSave(code);
      state = {...freshState(), ...s, screen:"title", ui:{}};
      migrate(); applySkin(); persist(); toastMsg = ""; mapVersion++; render();
    }catch(e){
      toastMsg = "Esse código não é um save do Dungeon Quest. Confira se copiou ele inteiro, começando por DQ1:";
      $("#toast").textContent = toastMsg;
    }
  }
};
function startDraft(){
  state.draft = {step:"race", race:null, race2:null, raceCat:"comum", cls:null, raceDice:null, clsDice:null, spells:[], name:""};
  state.ui = {};
  go("create");
}
function lockButtons(){ document.querySelectorAll("#app button").forEach(b=>b.disabled = true); }

/* quantas tochas a ação gasta (para perguntar antes de usar a última) */
function torchCost(b){
  const h = state.hero, a = b.dataset.act, d = state.dungeon;
  if(!h || !d || !d.inside || state.screen === "combat") return 0;
  if(a === "openDoor" || a === "secret" || a === "disarm" || a === "sneak") return 1;
  if(a === "unlock" && b.dataset.how === "pick") return freeLock() ? 0 : 1;
  if(a === "repairOne" && b.dataset.how === "torch") return 1;
  return 0;
}
let pendingTorch = null;
/* ações que mexem na masmorra compartilhada: na dupla, só uma pessoa por vez */
const COOP_LOCKED = new Set(["whistle","cwhistle","coopTake","attack","cspell","citem","horn","playDead","win","rechargePick","stonePick","coopRecv","openDoor","unlock","chest","secret","disarm","loot","takeStash","confirmPick","descend","climb","fight","sneak","corpse","engulf","lastFinal","coutim","enter"]);
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(b && (b.dataset.act === "cultUse" || b.dataset.act === "cultNo") && !b.disabled){ cultAnswer(b.dataset.act === "cultUse" ? +b.dataset.k : null); return; }
  if(b && b.dataset.act === "pcTab"){ actionsPC.pcTab(b); return; }
  if(!b || busy || b.disabled) return;
  if(COOP.on() && COOP.paused()){ return; }
  if(COOP.on() && COOP_LOCKED.has(b.dataset.act)){
    const data = {...b.dataset};
    COOP.lock().then(ok=>{
      if(!ok){ state.ui.msg = `${COOP.partner() ? COOP.partner().name : "O outro aventureiro"} está agindo. Espere um instante.`; render(); return; }
      dispatchAct({dataset:data, disabled:false});
      setTimeout(()=>{ if(!busy && COOP.myLock()) persist(); }, 400);
    });
    return;
  }
  dispatchAct(b);
});
function dispatchAct(b){
  const h = state.hero, cost = torchCost(b);
  if(cost && h && h.torches > 0 && h.torches <= cost){
    pendingTorch = {act:b.dataset.act, data:{...b.dataset}};
    const box = document.createElement("div");
    box.className = "lastbox"; box.id = "lastbox";
    const luzSp = h.spells.Luz && h.spells.Luz.left > 0;
    const luzScroll = !raceT("ogro") && h.bag.some(it=>it.n === "Pergaminho Mágico (Luz)");
    box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lastT"><h3 id="lastT">Última tocha</h3>
      <p>Esta ação usa a sua última tocha. ${luzSp || luzScroll ? "Você pode criar um globo de Luz e guardar a tocha." : raceT("fira") ? "Depois dela, você passa a gastar 2 PV no lugar de cada tocha." : hasClass("Minerador") ? "Sem tochas, só o Minerador acha a saída no escuro, e só se o caminho estiver livre. Se não estiver, o aventureiro morre." : "Sem tochas, a escuridão te devora e o aventureiro morre."}</p>
      <div class="stack">
        ${luzSp ? `<button class="btn" id="lastSpell">Usar a magia Luz <small>(${h.spells.Luz.left} uso${h.spells.Luz.left>1?"s":""})</small></button>` : ""}
        ${luzScroll ? `<button class="btn" id="lastScroll">Usar o Pergaminho de Luz</button>` : ""}
        <div class="row"><button class="btn ghost" id="lastNo">Cancelar</button><button class="btn ${luzSp||luzScroll?"ghost":""}" id="lastYes">Usar a última tocha</button></div>
      </div></div>`;
    document.body.appendChild(box);
    const close = () => { box.remove(); pendingTorch = null; };
    box.querySelector("#lastNo").onclick = close;
    box.addEventListener("click", ev=>{ if(ev.target === box) close(); });
    const run = () => { const p = pendingTorch; close(); const fn = actions[p.act]; if(fn) fn({dataset:p.data}); };
    box.querySelector("#lastYes").onclick = run;
    const bs = box.querySelector("#lastSpell");
    if(bs) bs.onclick = () => { h.spells.Luz.left--; h.torches++; H().magic++; log("Você conjurou Luz: o globo ilumina no lugar da tocha."); run(); };
    const bc = box.querySelector("#lastScroll");
    if(bc) bc.onclick = () => { const i = h.bag.findIndex(it=>it.n === "Pergaminho Mágico (Luz)"); if(i>=0){ h.bag.splice(i,1); h.torches++; H().magic++; log("Você leu o Pergaminho de Luz: o globo ilumina no lugar da tocha."); } run(); };
    return;
  }
  const fn = actions[b.dataset.act];
  if(fn) fn(b);
}
document.addEventListener("change", e=>{
  if(e.target.id==="bagCap"){ state.settings.bagCap = [10,20,0][+e.target.value]; persist(); render(); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="bagCap"){ const v = [10,20,0][+e.target.value]; state.settings.bagCap = v; persist();
    document.querySelectorAll(".ticks span").forEach((sp,i)=>sp.classList.toggle("on", i===+e.target.value)); }
  if(e.target.id==="heroName" && state.draft){ state.draft.name = e.target.value; persist(); }
});

function paint(){
  document.querySelectorAll("canvas[data-anim]").forEach(cv=>{
    const a = cv.dataset.anim;
    if(a==="scene") drawScene(cv);
    if(a==="torches") drawTorches(cv);
    if(a==="map") drawMap(cv);
    if(a==="wmap") drawWorld(cv);
    if(a==="arena") drawArena(cv);
    if(a==="preview") drawPreview(cv);
  });
  document.querySelectorAll("canvas[data-candle]").forEach(drawCandle);
  document.querySelectorAll("canvas[data-mon]").forEach(cv=>{
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(0,0,48,40);
    const P = state.dungeon ? palZ() : PALZ[6];
    for(let y=6;y<40;y++) for(let x=0;x<48;x++){ const h = zh(x,y); ctx.fillStyle = (x%32===0||y===6) ? P.F[0] : h<.14 ? P.F[1] : h>.86 ? P.F[3] : P.F[2]; ctx.fillRect(x,y,1,1); }
    if(cv.dataset.boss==="1"){ const g = ctx.createRadialGradient(24,26,2,24,26,20); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(0,0,48,40); }
    drawMonsterSprite(ctx, cv.dataset.mon, 24, 35, frame/8, frame);
  });
}
let last = 0;
function loop(ts){
  if(ts - last > 120){ last = ts; frame++; paint(); }
  else { const m = $("#map"); if(m) drawMap(m); const wm = $("#wmap"); if(wm) drawWorld(wm); const ar = $("#arena"); if(ar && (fxPops.length || heroAtk || heroDieAt || heroHitUntil > performance.now())) drawArena(ar); }
  requestAnimationFrame(loop);
}

function start(data){
  state = (data && data.state) ? data.state : loadState();
  migrate();
  if(state.coop && state.coop.code) COOP.connect();
  applySkin();
  cam.z = isZ() ? .85 : 3;
  render();
  requestAnimationFrame(loop);
  CLOUD.boot();
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
