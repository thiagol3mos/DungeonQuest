/* jogo em dupla desligado por enquanto (o código continua aqui para quando quisermos religar);
   a simulação dos testes ainda consegue usar */
const COOP_ENABLED = false;
function coopEnabled(){ return COOP_ENABLED || !!(state.settings && state.settings.coopSim); }
function coopPanel(){
  if(!coopEnabled() && !COOP.on()) return "";
  const msg = state.ui.coopMsg ? `<p class="toast">${esc(state.ui.coopMsg)}</p>` : "";
  if(COOP.on()){
    const p = COOP.partner();
    const st = !p ? "aguardando alguém entrar com o código" : p.dead ? `${esc(p.name)} morreu` : !COOP.online(p) ? `${esc(p.name)} está desconectado` : p.inside ? `${esc(p.name)} está na masmorra` : `${esc(p.name)} está na cidade`;
    return `<div class="sheet"><h3>Jogo em dupla</h3>
      <p>Código da sala: <b class="num" style="font-size:22px;letter-spacing:.15em">${esc(state.coop.code)}</b></p>
      <p class="small">${st}.</p>
      ${msg}<button class="btn ghost" data-act="coopLeave">Sair da dupla</button></div>`;
  }
  if(!NET.ready()) return `<div class="sheet dashed"><h3>Jogo em dupla</h3><p class="muted small">O servidor do jogo em dupla ainda não foi configurado.</p></div>`;
  return `<div class="sheet"><h3>Jogo em dupla</h3>
    <p class="muted small">Explore esta masmorra junto com um amigo, cada um no seu aparelho.</p>
    ${state.dungeon && !state.dungeon.inside ? `<button class="btn ghost" data-act="coopCreate">Criar sala com esta masmorra</button>` : ""}
    <label class="label" for="coopCode">Entrar na sala de um amigo</label>
    <div class="row"><input type="text" id="coopCode" maxlength="4" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off" spellcheck="false" style="text-transform:uppercase"><button class="btn" data-act="coopJoin">Entrar</button></div>
    ${msg}</div>`;
}

/* masmorra: exploração */
function monCard(g){
  const groups = [g, ...(g.extra||[])];
  return groups.map(x=>`
    <div class="mon">
      <canvas class="monpic" width="48" height="40" data-mon="${esc(monKey(x))}" data-boss="${x.boss?1:0}"></canvas>
      <span class="who">${x.boss ? "Chefe: " : ""}${x.list.length>1 ? N(x.list.length)+" " : ""}${x.name}</span>
      <div class="stats"><span class="chip solid">${N(x.pv)} PV${x.list.length>1?" cada":""}</span><span class="chip">Dano ${N(x.dano)}</span></div>
      ${traitsHTML(x.tr)}
    </div>`).join("");
}
function viewExplore(){
  const d = state.dungeon, h = state.hero;
  if(!d || !d.inside || !h) return viewSheet();
  const lv = LV(), seg = curSeg();
  const isBlocked = blocked(seg);
  const acts = [];
  const msg = state.ui.msg; state.ui.msg = null;
  const tele = state.ui.tele;

  // monstros
  let monHTML = "";
  if(seg.mon){
    const g = seg.mon;
    const who = g.sneak ? "Eles ainda não te viram." : g.boss ? "Você encontrou o Chefe da Masmorra. Você ataca primeiro." : g.first === "hero" ? "Você ataca primeiro." : g.broke ? "Você quebrou a porta e fez barulho. Os monstros atacam primeiro." : "Os monstros te viram. Eles atacam primeiro.";
    monHTML = `<div class="stack" style="gap:8px">${monCard(g)}<p class="small">${who}</p>
</div>`;
    if(isBlocked){
      if(raceT("coutim") && !g.boss && [g, ...(g.extra||[])].every(x=>/Espólios/.test(x.tr||""))) acts.push(`<button class="btn ghost" data-act="coutim">Ignorar o combate e pegar os espólios</button>`);
      if(g.first==="hero" && !g.sneakTried && !g.boss && !seg.final && !wearing(/^Chapéu do Bobo/) && !cursedOn(/da Risada/) && !raceT("noSneak") && !hasAlly("Cachorro")) acts.push(`<button class="btn ghost" data-act="sneak">Mover em Silêncio <small>(1 tocha)</small></button>`);
      acts.unshift(`<button class="btn" data-act="fight">Lutar!</button>`);
      acts.push(`<button class="btn ghost" data-act="go" data-to="sheet">Abrir ficha</button>`);
    } else acts.push(`<button class="btn ghost" data-act="fight" data-surprise="1">Atacar de surpresa</button>`);
  }

  // portas
  const closed = seg.doors.map(id=>lv.doors[id]).filter(dd=>dd.st==="closed"||dd.st==="locked");
  const selDoor = state.ui.selDoor && lv.doors[state.ui.selDoor];
  let popHTML = "";
  let doorsHTML = "";
  if(!isBlocked && closed.length){
    const count = {};
    doorsHTML = `<span class="label">${DT().tunnels ? "Caminhos" : "Portas fechadas"}</span><div class="dlist">${closed.map(dd=>{
      count[dd.dir] = (count[dd.dir]||0)+1;
      const same = closed.filter(o=>o.dir===dd.dir).length;
      const lab = `${tunName(dd)} ${DIRNAME[dd.dir]}${same>1?" "+count[dd.dir]:""}${dd.st==="locked"?" (trancada)":""}${isBossDoor(lv, dd)?" · Chefe":""}`;
      return `<button class="dbtn ${selDoor&&selDoor.id===dd.id?"sel":""}" data-act="selDoor" data-id="${dd.id}">${lab}</button>`;
    }).join("")}</div>`;
    if(selDoor && selDoor.seg===seg.id){
      const chav0 = freeLock();
      popHTML = selDoor.st==="closed"
        ? `<button class="pbtn" data-act="openDoor" data-id="${selDoor.id}">${selDoor.tun ? "Seguir pelo túnel" : selDoor.comp ? "Abrir comporta" : "Abrir porta"} <small>(1 tocha)</small></button>`
        : `<button class="pbtn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav0?"sem tocha":"+1 tocha"})</small></button>
           ${selDoor.comp ? "" : `<button class="pbtn alt" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar</button>`}
           ${keyIdx() >= 0 ? `<button class="pbtn alt" data-act="unlock" data-how="key" data-id="${selDoor.id}">Chave</button>` : ""}`;
      if(isBossDoor(lv, selDoor)){ popHTML = `<span class="pwarn">O Chefe está atrás desta porta</span>` + popHTML; acts.push(`<p class="note">Esta é a última porta do nível e não há escada para descer. Ao abri-la, você entra na Sala Final e enfrenta o Chefe da Masmorra.</p>`); }
      if(selDoor.st==="closed") acts.push(`<button class="btn" data-act="openDoor" data-id="${selDoor.id}">${selDoor.tun ? "Seguir pelo túnel" : selDoor.comp ? "Abrir comporta" : "Abrir porta"} <small>(1 tocha)</small></button>`);
      else {
        const chav = freeLock();
        acts.push(`<button class="btn" data-act="unlock" data-how="pick" data-id="${selDoor.id}">Destrancar <small>(${chav?"sem tocha extra":"+1 tocha"})</small></button>`);
        if(!selDoor.comp) acts.push(`<button class="btn ghost" data-act="unlock" data-how="break" data-id="${selDoor.id}">Quebrar porta <small>(faz barulho)</small></button>`);
        if(keyIdx() >= 0) acts.push(`<button class="btn ghost" data-act="unlock" data-how="key" data-id="${selDoor.id}">Usar chave</button>`);
      }
    }
  }
  const selObj = !tele && state.ui.selObj;
  if(selObj === "mon" && seg.mon){
    const g = seg.mon;
    popHTML = isBlocked
      ? `<button class="pbtn" data-act="fight">Lutar!</button>${g.first==="hero" && !g.sneakTried && !g.boss && !seg.final && !wearing(/^Chapéu do Bobo/) && !cursedOn(/da Risada/) && !raceT("noSneak") && !hasAlly("Cachorro") ? `<button class="pbtn alt" data-act="sneak">Mover em Silêncio <small>(1 tocha)</small></button>` : ""}`
      : `<button class="pbtn" data-act="fight" data-surprise="1">Atacar de surpresa</button>`;
    popHTML = `<span class="pwarn">${g.qty} ${esc(g.name)}</span>` + popHTML;
  } else if(selObj === "chest" && seg.chests>0 && !isBlocked){
    popHTML = `<button class="pbtn" data-act="chest">Abrir baú</button>`;
  } else if(selObj === "exit" && seg.exit){
    const er = exitRoute();
    popHTML = isBlocked ? `<span class="pwarn">Monstros bloqueiam a saída</span>`
      : er.ok ? `<button class="pbtn" data-act="leave">Sair da masmorra</button>`
      : D().noExit ? `<span class="pwarn">Sem porta para sair. O portal está na sala do Chefe.</span>`
      : `<span class="pwarn">Monstros em ${esc(er.by.map(n=>n.toLowerCase()).join(" ou "))} bloqueiam o caminho</span>`;
  } else if(selObj === "stairs" && !isBlocked && (seg.down || seg.up)){
    popHTML = (seg.down ? `<button class="pbtn" data-act="descend">${descLabel(seg)}</button>` : "")
      + (seg.up ? `<button class="pbtn alt" data-act="climb">Subir para o nível ${seg.up.level}</button>` : "");
  } else if(selObj){ state.ui.selObj = null; }
  if(isBlocked && DT().mine && /^(CW|CWN)$/.test(seg.code) && !seg.cart) acts.push(`<button class="btn" data-act="cart">Descer o trilho no carrinho <small>(1d6+3 em cada monstro no caminho)</small></button>`);
  if(!isBlocked){
    if(D().noExit && seg.bossRoom) acts.push(`<button class="btn" data-act="bossPortal">Atravessar o Portal da sala do Chefe</button>`);
    if(seg.loot) acts.push(`<button class="btn" data-act="loot">Pegar: ${lootText(seg.loot)}</button>`);
    if(seg.stash && seg.stash.length && !state.ui.bagFull) acts.push(`<button class="btn" data-act="takeStash">Itens deixados aqui (${seg.stash.length})</button>`);
    if(seg.chests>0) acts.push(`<button class="btn" data-act="chest">Abrir baú</button>`);
    if(seg.crates) acts.push(`<button class="btn ghost" data-act="crates">Investigar os ${seg.crates} caixotes <small>(1 dado para cada)</small></button>`);
    if(seg.refuge && !seg.refUsed) acts.push(`<button class="btn" data-act="refuge">Descer ao Refúgio <small>(descanso seguro, uma vez)</small></button>`);
    if(seg.surface) acts.push(`<button class="btn ghost" data-act="leave">Subir para a superfície</button>`);
    if(seg.fx === "k" && !seg.drank) acts.push(`<button class="btn ghost" data-act="cauldron">Beber do caldeirão <small>(role na tabela de Poção)</small></button>`);
    if(seg.secret && !seg.secretTried) acts.push(`<button class="btn ghost" data-act="secret">Procurar passagem secreta <small>(1 tocha)</small></button>`);
    if(seg.k==="room" && !seg.disarmed && !seg.final) acts.push(seg.trapSeen
      ? `<button class="btn ghost" data-act="disarm">Desarmar armadilhas <small>(1 tocha)</small></button>`
      : `<button class="btn ghost" disabled>Desarmar armadilhas <small>(nenhuma armadilha à vista)</small></button>`);
    if(d.corpses.some(c=>c.level===d.pos.level && c.seg===seg.id)) acts.push(`<button class="btn" data-act="corpse">Revistar cadáver</button>`);
    if(seg.gosma && raceT("gosma")) acts.push(`<button class="btn" data-act="engulf">Engolfar um corpo <small>(recupera todos os PV)</small></button>`);
    if(seg.down) acts.push(`<button class="btn" data-act="descend">${descLabel(seg)}</button>`);
    if(seg.up) acts.push(`<button class="btn ghost" data-act="climb">Subir para o nível ${seg.up.level}</button>`);
  }
  let banner = "";
  const bdoor = !d.complete && bossDoorOf(lv);
  if(bdoor && !isBlocked){

function sellValue(it){
  const h = state.hero;
  let v;
  if(/2d6×10/.test(it.n)) v = rollExpr("2d6")*10;
  else if(/vale 3d6 moedas/.test(it.n)) v = rollExpr("3d6");
  else if(/1d6×10 moedas/.test(it.n)) v = rollExpr("1d6")*10;
  else { const m = it.n.match(/vale (\d+) moedas/); v = m ? +m[1] : it.magic ? Math.max(0, d6()-1) : 1; }
  if(raceT("catSell") && (it.weapon || it.slot)) v *= 2;
  if(hasClass("Colecionador") && it.slot) v = Math.max(v, 5);
  if(hasClass("Comerciante")) v *= 2;
  if(state.world && wHere() && wHere().loc && wHere().loc.k === "fort") v *= 2;
  return v;
}

const ABILITIES = ["Explosivo","Fogo","Horda","Magia","Morte Súbita","Necromancia","Regeneração","Paralisar"];
let heroAtk = null, heroDieAt = 0;
let fxPops = [], heroHitUntil = 0, monHit = {}, monAtk = {}, monDie = {};
const C = () => state.combat;

function cLog(m){ const c = C(); c.log.unshift(c.coop && state.hero && /^Você/.test(m) ? `${state.hero.name}: ${m}` : m); if(c.log.length>30) c.log.length = 30; log(m); }
function pop(i, txt, col){ fxPops.push({i, txt, col, t0:performance.now()}); }

function startCombat(surprise){
  const seg = curSeg(), groups = [seg.mon, ...(seg.mon.extra||[])];
  const units = [];
  groups.forEach((g,gi)=>g.list.forEach(m=>units.push({key:monKey(g), name:monKey(g), pv:m.pv, max:m.max, dano:g.dano, tr:g.tr||"", boss:!!g.boss, g:gi})));
  const first = surprise || seg.mon.sneak || seg.mon.first === "hero" ? "hero" : "mon";
  if(seg.mon.sneak){ seg.mon.sneak = false; }
  state.combat = {level:D().pos.level, seg:seg.id, units, sel:0, phase:first, round:1, log:[], fury:0, heroPar:0, pending:null, alloc:{}, hits:0};
  state.combat.allies = buildAllies(false, false);
  if(COOP.on() && COOP.partnerHere() && COOP.sameRoom()){
    const c0 = state.combat;
    const gs = [seg.mon, ...((seg.mon && seg.mon.extra) || [])], fresh = gs.map(g=>!!(g && g.boss && !g.dbl));
    gs.forEach((g,gi)=>{ if(fresh[gi]){ g.dbl = true; g.list.forEach(x=>{ x.pv *= 2; x.max *= 2; }); } });
    c0.units.forEach(u=>{ if(fresh[u.g]){ u.pv *= 2; u.max *= 2; } });
    if(fresh.some(Boolean)) cLog("Dois aventureiros: o Chefe tem o dobro de vida."); c0.coop = true; c0.id = Math.random().toString(36).slice(2,9); c0.part = [COOP.me(), COOP.other()]; c0.mt = 0;
    state.coop.cp = {id:c0.id, done:-1, applied:-1, alloc:{pv:0, ar:{}}};
  }
  if(units.some(u=>has(u,"Morto-Vivo"))) H().undead++;
  fxPops = []; monHit = {}; monAtk = {}; monDie = {}; heroAtk = null; heroDieAt = 0;
  cLog(first === "hero" ? (state.combat.coop ? "O combate começa. Vocês atacam primeiro." : "O combate começa. Você ataca primeiro.") : "O combate começa. Os monstros atacam primeiro.");
  go("combat");
  if(first === "mon") (state.combat.coop ? runMonsterTurnCoop() : runMonsterTurn());
}
function heroDamageBonus(u, W){
  const h = state.hero; let b = 0; W = W || h.weapon;
  const wm = (W.n || "").match(/causa \+(\d) de dano(?! contra)/); if(wm) b += +wm[1];
  if(/contra Anjos/.test(W.n) && /Anjo/.test(u.name)) b += 2;

async function winCombat(){

    if(u.boss){ const g = ctx.createRadialGradient(x, y-10, 2, x, y-10, 26); g.addColorStop(0,"rgba(255,80,60,.22)"); g.addColorStop(1,"rgba(255,80,60,0)"); ctx.fillStyle = g; ctx.fillRect(x-26, y-36, 52, 52); }

    drawMonsterSprite(ctx, u.key, x + shake, y + lunge, t, frame);
    if(hit && monHit[i] - now > 140) drawMonsterSprite(ctx, u.key, x + shake, y + lunge, t, frame, {white:true, alpha:.75, still:true});
    if(u.frozen){ ctx.fillStyle = "rgba(160,220,255,.45)"; ctx.fillRect(x-10, y-22, 20, 22); }
    const bw = 20, f = u.pv/u.max;
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(x-bw/2-1, y+4, bw+2, 4);
    ctx.fillStyle = f > .5 ? "#6ac04a" : f > .25 ? "#e0b038" : "#d83a2a"; ctx.fillRect(x-bw/2, y+5, Math.max(1, Math.round(bw*f)), 2);
  });
  // aventureiro de costas para a tela, no primeiro plano
  const hx = Math.round(W/2 - 8), hy = H - 26;

  } else {
    const co2 = COOPC.on() && COOP.partner() && COOPC.inFight(COOP.other());
    if(co2){ const pl = COOP.partner(); const ph = {...pl.lite, armor:pl.lite.armor||{}, off:pl.lite.off||[], bag: pl.lite.lamp ? [{n:LAMP}] : [], noTorch: COOP.holder() !== COOP.other() && !pl.own};
      const pf = drawHero(ctx, W/2 + 22, H - 4, t, frame % 12 >= 6 ? "breath" : "idle", true, undefined, ph); if(pf) flameZ(ctx, pf[0], pf[1], t, 5); }
    drawAllies(ctx, W, H, t);

  else if(heroAtk && ak >= 520) heroAtk = null;

    const [x,y] = pos[p.i] || [W/2, H-30]; const k = (now - p.t0)/1100;
    ctx.save(); ctx.translate(Math.round(x - textW(p.txt.replace("-","").replace("+",""))), Math.round(y - 30 - k*14)); ctx.scale(2,2);
    drawText(ctx, p.txt.replace("-","").replace("+",""), 1, 1, "#0c0a12"); drawText(ctx, p.txt.replace("-","").replace("+",""), 0, 0, p.col);
    ctx.restore();
  });
}

function drawSlash(ctx, kind, x, y, k){
  if(k < 0 || k > 1) return;
  const a = 1 - k, px = (X,Y,c)=>{ ctx.fillStyle = c; ctx.fillRect(Math.round(X), Math.round(Y), 3, 3); };
  ctx.save(); ctx.globalAlpha = Math.min(1, a*1.6);
  const W1 = "#ffffff", W2 = "#bfe0ff", Y1 = "#ffe070";
  if(kind==="sword" || kind==="big" || kind==="halberd" || kind==="scythe"){ const r = kind==="big"||kind==="scythe" ? 20 : 15; const n = Math.round(4 + k*10);
    for(let i=0;i<n;i++){ const ang = -2.4 + i*0.22; px(x + Math.cos(ang)*r, y + Math.sin(ang)*r*.8 + 6, i > n-3 ? W1 : W2); } }
  else if(kind==="dagger"){ [[-6,-6],[6,-4]].forEach(([ox,oy],j)=>{ for(let i=0;i<5;i++) px(x+ox+i*2*(j?-1:1)*-1 + (j?0:0), y+oy+i*2, W1); }); }
  else if(kind==="spear"){ const len = Math.round(6 + k*14); for(let i=0;i<len;i+=2) px(x, y + 14 - i, i>len-4 ? W1 : W2); px(x-2, y+14-len, W1); px(x+2, y+14-len, W1); }
  else if(kind==="axe" || kind==="hammer" || kind==="club"){ const r = Math.round(4 + k*13); for(let i=0;i<8;i++){ const ang = i/8*Math.PI*2; px(x + Math.cos(ang)*r, y + 8 + Math.sin(ang)*r*.4, i%2 ? Y1 : W1); } px(x, y+6, W1); }
  else if(kind==="whip"){ for(let i=0;i<12;i++) px(x - 12 + i*2, y + Math.sin(i*.9 + k*6)*4, i>8 ? W1 : "#e8c890"); }
  else { const r = Math.round(2 + k*7); for(let i=0;i<6;i++){ const ang = i/6*Math.PI*2; px(x + Math.cos(ang)*r, y + Math.sin(ang)*r, Y1); } px(x, y, W1); }
  ctx.restore();
}
function arenaPositions(n, W){
  const pos = [];
  const rows = n <= 4 ? [n] : n <= 8 ? [Math.ceil(n/2), Math.floor(n/2)] : [Math.ceil(n/3), Math.ceil(n/3), n - 2*Math.ceil(n/3)];
  let k = 0;
  rows.forEach((cnt, r)=>{
    const y = 62 + r*18;
    for(let j=0;j<cnt;j++){ const x = Math.round(W/(cnt+1) * (j+1) + (r%2 ? 10 : 0)); pos[k++] = [x, y]; }
  });
  return pos;
}
function arenaTap(e){
  const c = C(); if(!c || busy || (c.phase !== "hero" && c.phase !== "ally")) return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect();

  if(best >= 0){ c.sel = best; persist(); render(); }
}

/* ---------- geometria dos hexágonos ---------- */
const HDIR = [[1,-1],[1,0],[0,1],[-1,1],[-1,0],[0,-1]];
const HDIRN = ["a nordeste","a leste","a sudeste","a sudoeste","a oeste","a noroeste"];
const HEXW = 56, HEXH = 32;
const hk = (q, r) => `${q},${r}`;
const hq = k => k.split(",").map(Number);
function hexNb(k){ const [q,r] = hq(k); return HDIR.map(([a,b])=>hk(q+a, r+b)); }
function hexDist(a, b){ const [q1,r1] = hq(a), [q2,r2] = hq(b), dq = q1-q2, dr = r1-r2; return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2; }
function dirOf(a, b){
  const pa = hexPx(a), pb = hexPx(b), ang = Math.atan2(pb.y - pa.y, pb.x - pa.x);
  let best = 0, bd = 9;
  HDIR.forEach(([q,r],i)=>{ const v = hexPx(hk(q,r)), d = Math.abs(Math.atan2(Math.sin(ang - Math.atan2(v.y, v.x)), Math.cos(ang - Math.atan2(v.y, v.x)))); if(d < bd){ bd = d; best = i; } });
  return HDIRN[best];
}

function nearDgs(pos, rad){
  const w = WD(); rad = rad || 3;
  return Object.keys(w.hex).filter(k=>k !== pos && w.hex[k].dg && !ENDLESS(w.hex[k].dg.type) && hexDist(pos, k) <= rad).map(k=>{ const m = w.hex[k].dg, r = dgRec(m); return {k, m, d:hexDist(pos,k), dir:dirOf(pos,k), done:!!(r && r.complete)}; }).sort((a,b)=>a.d-b.d);
}
function hexPx(k){ const [q,r] = hq(k); return {x:q*HEXW + r*HEXW/2, y:r*HEXH}; }
function pxHex(x, y){
  const r0 = Math.round(y/HEXH); let best = null, bd = 1e9;
  for(let r=r0-1;r<=r0+1;r++){ const q0 = Math.round((x - r*HEXW/2)/HEXW); for(let q=q0-1;q<=q0+1;q++){ const cx = q*HEXW + r*HEXW/2, cy = r*HEXH, dd = (x-cx)**2 + (y-cy)**2; if(dd < bd){ bd = dd; best = hk(q,r); } } }
  return best;
}

/* ---------- estado do mundo ---------- */
function WD(){ return state && state.world; }
function wHere(){ const w = WD(); return w ? w.hex[w.pos] : null; }
function raceIs(n, h){ h = h || state.hero; return !!h && [R(h.race), R(h.race2)].some(r=>r && r.n === n); }
function wLog(m){ const w = WD(); if(!w) return; w.log.unshift(m); if(w.log.length > 40) w.log.length = 40; }
function locLabel(loc){
  if(!loc) return "";
  if(loc.nm) return loc.nm;
  if(loc.k === "city") return `Cidade ${loc.race}`;
  if(loc.k === "fort") return `Fortaleza ${loc.race}`;
  return {house:"Casa Abandonada", fog:"Neblina densa", ruins:"Ruínas", volcano:"Vulcão", portal:"Portal", oasis:"Oásis", corals:"Corais", rocks:"Rochas"}[loc.k] || "";
}
function isTown(loc){ return !!loc && (loc.k === "city" || loc.k === "fort"); }
/* cidade onde o aventureiro está e pode entrar (ou null) */
function worldCityHere(){

  const hx = w.hex[w.pos];

}
function worldStartSpec(h){
  const id = String(h.race), n = R(h.race) ? R(h.race).n : "";
  if(id[0] === "e") return {t:"ag", loc:null, water:true};                       /* Raças Exóticas: no mar, num barco */
  if(id[0] === "m") return n === "Goblin" ? {t:"fl", loc:{k:"city", race:"Goblin"}} : {t:"mo", loc:{k:"city", race:"Orc"}};
  return {t:"pl", loc:{k:"city", race:"Humana"}};
}
function worldGen(t){
  const wd = WD(), rl = wd && wd.realm && REALMS[wd.realm];
  let nt = rl ? rl.terr[d6()-1] : TERR_HOT[t][d6()-1];
  if(nt === "pl" && rfl("pw")) nt = "ag";
  let loc = null;
  if(rl){ if(nt !== "mm" && nt !== "ms" && nt !== "mk" && d6() === 6){ const [k, race, nm] = rl.loc[d6()-1]; if(k !== "nothing"){ loc = {k}; if(race){ loc.race = race; loc.nm = nm; } } } }
  else if(d6() === 6){ const [k, race] = LOC_HOT[nt][d6()-1]; if(k !== "nothing") loc = race ? {k, race} : {k}; }
  if(loc && isTown(loc) && rfl("fut")) loc = {k:"ruins"};
  return {t:nt, loc};
}
function worldReveal(k){
  const w = WD(), hx = w.hex[k];
  hexNb(k).forEach(n=>{ if(!w.hex[n]) w.hex[n] = worldGen(hx.t); });
}
function worldInit(){
  const h = state.hero, sp = worldStartSpec(h);

/* guarda o mapa do mundo atual e carrega outro (home = mundo dos vivos) */
function realmSwitch(id){
  const w = WD(), cur = w.realm || "home"; if(cur === id) return;
  w.maps = w.maps || {};
  w.maps[cur] = {hex:w.hex, pos:w.pos, boat:w.boat};
  const m = w.maps[id]; delete w.maps[id];
  w.realm = id === "home" ? undefined : id;
  if(m){ w.hex = m.hex; w.pos = m.pos; w.boat = m.boat; }
  else { w.hex = {}; w.pos = "0,0"; w.boat = false; w.hex["0,0"] = {t:REALMS[id].start, loc:null}; worldReveal("0,0"); }
  w.sel = null; w.ev = null; wcenterOn = true; state.ui.wHere = null;
  const h = state.hero;
  if(id === "home" && h && h.soul){
    delete h.soul; party(h).push({id:newPid(), kind:"animal", n:"Aventureiro Ressuscitado", pv:8, max:8, d:"2", key:"Cultista", free:true});
    wLog("De volta ao mundo dos vivos, a alma que te seguia ressuscita e passa a lutar ao seu lado.");

}
/* novo aventureiro num mundo que já existe: começa na cidade mais próxima onde pode entrar */
function worldPlaceNew(h){
  const w = WD(); if(!w) return;
  if(w.realm) realmSwitch("home");
  h.provisions = 20; w.boat = false; w.ev = null; w.sel = null;
  const towns = Object.keys(w.hex).filter(k=>isTown(w.hex[k].loc) && canEnterCity(w.hex[k].loc, h) && !w.hex[k].banned);
  towns.sort((a,b)=>hexDist(a,"0,0")-hexDist(b,"0,0"));
  w.pos = towns[0] || "0,0";
  if(!w.hex[w.pos]) w.hex[w.pos] = {t:"pl", loc:null};
  worldReveal(w.pos);
  wLog(`${h.name} começa a jornada ${towns[0] ? "na " + locLabel(w.hex[w.pos].loc) : "aqui"}.`);
  wcenterOn = true;
}
function canSwim(h){ return raceIs("Marrecko", h) || raceIs("Tutubarão", h) || raceIs("Homem-Boto", h) || hasAlly("Golfinho", h); }
function ignoresEvents(h){ return raceIs("Povo-Corvo", h) || raceIs("Marrecko", h) || raceIs("Andarilho", h) || hasAlly("Rastreador Elfo", h); }
/* provisões gastas para entrar no hexágono */
function travelCost(k){
  const h = state.hero, w = WD(), t = w.hex[k].t;
  const mercs = mercCount() * TERR[t].cost;               /* cada mercenário gasta as próprias provisões */
  if(raceIs("Steambot")) return mercs;
  let c = TERR[t].cost;
  if(t === "de" && (raceIs("Arrakiano") || hasAlly("Camelo"))) c = 1;
  if(t === "mo" && (raceIs("Meio-Cabra") || hasAlly("Llama") || hasAlly("Bode"))) c = Math.min(c, raceIs("Meio-Cabra") ? 1 : 2);
  if(t === "fl" && (wearing(/^Botas Élficas/) || hasAlly("Coruja") || hasAlly("Lobo Gigante"))) c = 1;
  if(t === "pa" && (hasAlly("Raptor") || wearing(/^Botas Emplumadas/))) c = 1;
  if(hasAlly("Grifo")) c = 1;
  if(t === "pl" && hasAlly("Cavalo") && w.horse) c = 0;
  if(raceIs("Pandolfo")) c *= 2;
  if(raceIs("Centauro")) c = Math.ceil(c/2);
  return c + mercs;
}
function canTravel(k){
  const w = WD(), hx = w.hex[k];
  if(!hx) return {ok:false, why:"Ainda não se sabe o que há lá."};
  if(w.ev) return {ok:false, why:"Resolva o encontro antes de seguir viagem."};
  if(!hexNb(w.pos).includes(k)) return {ok:false, why:`Fica a ${hexDist(w.pos,k)} hexágonos de você. Viaje um hexágono de cada vez.`};
  if(hx.loc && hx.loc.k === "rocks") return {ok:false, why:"Rochas: não é possível passar por aqui."};
  if(hx.loc && hx.loc.k === "fog") return {ok:false, fog:true, why:"Neblina densa: não dá para atravessar. Gaste 1 provisão para esperar ela dissipar."};
  if(hx.t === "ag" && !w.boat && !canSwim() && hasItem(/^Barco Dobrável/) < 0) return w.realm === "mortos" ? {ok:false, charon:true, why:"Deseja chamar o Barqueiro?"} : {ok:false, why:"Para andar na água você precisa de um barco. Contrate um numa cidade da costa."};
  return {ok:true};
}
function dgRec(m){ const w = WD(), d = state.dungeon; return d && d.uid === m.uid ? d : (w.recs[m.uid] || null); }
function wAddItem(it){
  const h = state.hero;
  if(h.bag.length < bagMax()){ h.bag.push(fixWearable(it)); return true; }
  const hx = wHere(); hx.ground = (hx.ground||[]).concat(it);

}
function wBegin(){ busy = true; rollLog = []; const t = $("#etray"); if(t) t.innerHTML = ""; lockButtons(); }
function wEnd(){ busy = false; persist(); render(); }

/* ---------- viagem ---------- */
async function doTravel(k, how){
  const w = WD(), h = state.hero, hx = w.hex[k];
  if(busy || !canTravel(k).ok) return;
  wBegin();
  const fly = how === "fly";
  if(fly){ const s = h.spells["Voar"]; if(!s || s.left <= 0){ wEnd(); return; } s.left--; H().magic++; }
  const cost = fly ? 0 : travelCost(k);
  const have = h.provisions||0, use = Math.min(have, cost), miss = cost - use;
  h.provisions = have - use; H().provSpent += use;
  w.trips++; w.days += fly ? 1 : Math.max(1, TERR[hx.t].cost);
  const prev = w.pos;
  if(hx.t === "pl" && hasAlly("Cavalo") && !fly) w.horse = !w.horse;
  w.pos = k; w.sel = null; wcenterOn = true;
  if(w.boat && hx.t !== "ag"){ w.boat = false; wLog("Você deixa o barco na costa."); }
  if(hx.t === "ag" && w.boat) H().boat++;
  if(hx.t === "fl") H().forests++;
  if(hx.t === "de") H().deserts++;
  if(isTown(hx.loc)){ const x = H(); if(!x.cities.includes(k)) x.cities.push(k); }
  worldReveal(k);
  if(hasAlly("Águia")){ const di = hexNb(prev).indexOf(k), k2 = di >= 0 ? hexNb(k)[di] : null; if(k2 && w.hex[k2]) worldReveal(k2); }
  wLog(`${fly ? "Você voou" : "Você viajou"} até ${hx.loc ? "a " + locLabel(hx.loc) : TERR[hx.t].a + " " + TERR[hx.t].n}${cost ? ` (${cost} provis${cost>1?"ões":"ão"})` : ""}.`);
  if(miss > 0){
    h.pv = Math.max(0, h.pv - miss);
    wLog(`Sem provisões: você perde ${miss} PV de fome (${h.pv}/${h.pvMax}).`);
    if(h.pv <= 0 && !samambro()){ busy = false; killHero("Morreu de fome na estrada"); persist(); render(); return; }
  }
  await arriveHex(k, fly);
  if(state.hero) wEnd(); else { busy = false; persist(); render(); }
}
async function arriveHex(k, fly){
  const w = WD(), h = state.hero, hx = w.hex[k], loc = hx.loc;
  if(hx.t === "mm" && !fly){
    const v = await roll("Mar de Magma", 2), dm = v[0] + v[1];
    rollNote(`${dm} de dano`); wLog(`O Mar de Magma queima você: ${dm} de dano.`);
    if(!hurt(dm, "Queimado no Mar de Magma")) return;
  }
  if(!fly && hx.t === "ms"){
    const [dv] = await roll("Correnteza de sangue", 1);
    wLog("O Mar de Sangue te engole: 3 de dano."); rollNote("3 de dano");
    if(!hurt(3, "Afogado no Mar de Sangue")) return;
    const n = hexNb(w.pos)[dv-1], nx = w.hex[n];
    if(nx && !(nx.loc && nx.loc.k === "rocks")){
      w.pos = n; wcenterOn = true; worldReveal(n);
      if(isTown(nx.loc)){ const x = H(); if(!x.cities.includes(n)) x.cities.push(n); }
      wLog(`A correnteza te joga para ${nx.loc ? "a " + locLabel(nx.loc) : TERR[nx.t].a + " " + TERR[nx.t].n}.`);
    } else wLog("A correnteza te joga contra as rochas e você fica onde está.");
    return;
  }
  if(!fly && hx.t === "pe"){ wLog("Os espinhos ferem você: 1 de dano."); if(!hurt(1, "Empalado nos espinhos da Planície")) return; }
  if(!fly && hx.t === "fe"){
    const [v] = await roll("Floresta de Empalados", 1);
    if(v === 1){ rollNote("Catatônico"); h.provisions = Math.max(0, (h.provisions||0)-1); w.days++; wLog("Horripilante! Você fica catatônico: perde o turno, 1 dia e 1 provisão."); }
    else rollNote("Você segue em frente");
  }
  if(loc && loc.k === "house"){
    if(!hx.looted){ hx.looted = true; const [v] = await roll("Casa Abandonada", 1), c = v-1; rollNote(c ? `${c} moeda${c>1?"s":""}` : "Nada"); if(c){ h.coins += c; wLog(`Na casa abandonada você acha ${c} moeda${c>1?"s":""}.`); } else wLog("A casa abandonada está vazia."); }
    else wLog("Você já vasculhou esta casa.");
    return;
  }
  if(loc && loc.k === "oasis"){
    if(hx.oasis === undefined){ const [v] = await roll("Oásis", 1); hx.oasis = v >= 5; rollNote(hx.oasis ? "É de verdade!" : "Miragem"); }
    if(hx.oasis){ h.pv = h.pvMax; wLog("Você achou um Oásis e recuperou todos os PV."); } else wLog("Era só uma miragem.");
    return;
  }
  if(loc && loc.k === "corals"){
    const [v] = await roll("Corais", 1);
    if(v === 1){ h.provisions = Math.max(0, (h.provisions||0)-1); rollNote("Encalhou"); wLog("Seu barco encalhou nos corais: você perde 1 provisão."); }
    else if(v >= 3){ rollNote("Caverna"); hx.cave = true; wLog("Você avistou uma Caverna Subaquática entre os corais."); }
    else { rollNote("Nada"); wLog("Você passa pelos corais sem problemas."); }
    return;
  }
  if(loc && loc.k === "ruins" && !hx.dg){ await ruinsRoll(k); return; }
  if(loc || hx.bld) return;
  if(fly) return;
  await travelEvent(k);
}
/* ruínas: o tipo de masmorra depende do terreno */
async function ruinsRoll(k){
  const w = WD(), hx = w.hex[k], tab = RUINS_TABLE[hx.t] || RUINS_TABLE.pl;
  let type = 0;
  for(let g=0; g<12 && !type; g++){
    const v = await roll("Ruínas", 2), sm = v[0]+v[1], t = tab[ruinsRow(sm)];
    if(t){ type = t; rollNote(DUNGEONS[t].n); } else rollNote(sm >= 12 ? "Masmorra única: em breve, rola de novo" : "Caverna: em breve, rola de novo");
  }
  if(!type) type = tab[1];
  const parts = [];
  for(const lb of ["Nome (parte 2)","Nome (parte 3)","Nome (parte 4)"]){ const v = await roll(lb, 3); parts.push(v[0]+v[1]+v[2]); }
  const name = worldDungeonName(type, parts[0], parts[1], parts[2]);
  hx.dg = {uid:Date.now().toString(36)+Math.floor(Math.random()*1e4), type, name, dice:parts};
  wLog(`Nas ruínas você encontra a entrada d${name.startsWith("A ")?"a":"o"} ${name.slice(2)}.`);
}
/* ---------- Portais: só os resultados deste mundo ---------- */
const PORTAL_OK = [3,4,5,6,7,8,9,10,11,13,14,15,16,17,18];
const PORTAL_NAME = {5:"Pesadelum",16:"Pesadelum",17:"Mundo dos Doces",4:"Inferno",8:"Mundo dos Mortos",18:"Inferno",3:"Desapareceu",6:"Futuro",7:"Masmorra sem saída",9:"Cidade mais próxima",10:"Cidade humana",11:"Qualquer hexágono",13:"Planícies com água",14:"Homens-Gosma",15:"Sala dourada"};
async function portalRoll(){
  for(let g=0; g<60; g++){

    if(PORTAL_OK.includes(sm)){ rollNote(PORTAL_NAME[sm]); return sm; }

}
function portalTown(onlyHuman){
  const w = WD(); let best = null, bd = 1e9;
  Object.keys(w.hex).forEach(k=>{
    const x = w.hex[k]; if(k === w.pos || !isTown(x.loc) || (onlyHuman && x.loc.race !== "Humana")) return;
    const dd = hexDist(w.pos, k); if(dd < bd){ bd = dd; best = k; }
  });
  return best;
}
function portalMove(k, txt){
  const w = WD(), h = state.hero, hx = w.hex[k];
  w.pos = k; w.sel = null; w.ev = null; wcenterOn = true;
  if(hx.t !== "ag") w.boat = false;

/* devolve "dg" quando o portal levou a uma masmorra recém-criada */
async function portalEffect(sm, hx, temp){
  const w = WD(), h = state.hero;
  if(sm === 3){ wLog("Você atravessa o portal e desaparece da existência."); killHero("Desapareceu da existência ao atravessar um portal"); return; }
  if([4,5,8,16,17,18].includes(sm)){
    const id = ({4:"inferno",18:"inferno",8:"mortos",5:"pesadelum",16:"pesadelum",17:"doces"})[sm], nm = REALMS[id].n;
    if((w.realm || "home") === id){ wLog(`Você atravessa o portal e continua no ${nm}.`); return; }
    realmSwitch(id);
    wLog(`Você atravessa o portal e vai para o ${nm}.`);
    return;
  }
  if(sm === 6){
    if(rfl("fut")){ wLog("Você atravessa o portal e continua no futuro, onde só restam ruínas."); return; }
    rset("fut");
    Object.keys(w.hex).forEach(k=>{ const x = w.hex[k]; if(isTown(x.loc)){ x.loc = {k:"ruins"}; x.banned = false; } });
    wLog("Você atravessa o portal e vai para o futuro: todas as cidades e fortalezas viraram ruínas.");
    return;
  }
  if(sm === 7){
    if(hx && hx.dg){
      if(temp) return portalEffect(await portalRoll(), hx, temp);
      const r = dgRec(hx.dg);
      if(r && r.complete){ wLog("O portal leva à masmorra sem saída que você já completou."); return; }
      return "dg";
    }
    const tab = DG_TYPE[hx.t] || DG_TYPE.pl; let type = 0;
    for(let g=0; g<20 && !type; g++) type = DG_ID[tab[d6()-1]] || 0;
    if(!type) type = 6;
    const parts = [];
    for(const lb of ["Nome (parte 2)","Nome (parte 3)","Nome (parte 4)"]){ const v = await roll(lb, 3); parts.push(v[0]+v[1]+v[2]); }
    const name = worldDungeonName(type, parts[0], parts[1], parts[2]);
    hx.dg = {uid:Date.now().toString(36)+Math.floor(Math.random()*1e4), type, name, dice:parts, noExit:true};
    wLog(`Você atravessa o portal e para no início d${name.startsWith("A ")?"a":"o"} ${name.slice(2)}, sem porta para sair. Só a sala do Chefe tem um portal.`);
    return "dg";
  }
  if(sm === 9 || sm === 10){
    const k = sm === 10 ? (portalTown(true) || portalTown(false)) : portalTown(false);
    if(!k){ wLog("O portal te devolve ao mesmo lugar: não há nenhuma cidade conhecida."); return; }
    const lc = w.hex[k].loc;
    portalMove(k, `Você atravessa o portal e para no meio d${lc.k === "fort" ? "a" : "a"} ${locLabel(lc)}.`);
    if(!canEnterCity(lc)) wLog(AFF_COLS.includes(lc.race) ? "Gente da sua raça não é bem-vinda aqui. Você está no meio da cidade, mas não pode entrar nela." : "Território inimigo: você está no meio da cidade, mas não pode entrar nela.");
    return;
  }
  if(sm === 11 || sm === 14){
    state.ui.far = true; state.ui.farKind = sm; state.ui.farOrigin = w.realm || "home";
    wLog(sm === 14 ? "Você parou numa cidade nas nuvens, onde vivem os Homens-Gosma. Eles se oferecem para abrir um novo portal." : "O portal te deixa escolher o destino: qualquer hexágono.");
    return;
  }
  if(sm === 13){
    if(rfl("pw")){ wLog("Você atravessa o portal e nada muda: as planícies que você abrir continuam com água."); return; }
    rset("pw");
    wLog("Você continua no mesmo lugar, mas agora sempre que abrir uma Planície você encontra Água.");
    return;
  }
  if(sm === 15){
    if(!temp && hx && hx.pgold) wLog("Você volta à sala dourada, já sem as moedas.");
    else { h.coins += 300; if(hx && !temp) hx.pgold = true; wLog("Você chegou a uma sala dourada sem portas. No centro, 300 moedas."); }
    wLog("Na parede dos fundos há um outro Portal.");
    let s2 = !temp && hx && hx.pdest2 ? hx.pdest2 : await portalRoll();
    if(!temp && hx) hx.pdest2 = s2;
    return portalEffect(s2, hx, temp);
  }
}
async function portalCross(hx, temp){
  let sm = !temp && hx && hx.pdest ? hx.pdest : await portalRoll();
  if(!temp && hx) hx.pdest = sm;
  return portalEffect(sm, hx, temp);
}
async function portalRun(hx, temp){
  wBegin();
  const r = await portalCross(hx, temp);
  if(state.hero) wEnd(); else { busy = false; persist(); render(); }
  if(r === "dg" && state.hero) actions.wEnterDg();
}
function starOk(){ const h = state.hero; return !!h && hasItem(/^Pedra das Estrelas/) >= 0 && (h.provisions||0) >= 1; }
async function travelEvent(k){
  const w = WD(), h = state.hero, hx = w.hex[k];
  const v = await roll("Evento na viagem", 2), s = v[0] + v[1];
  if(s >= 7){ rollNote("Nada acontece"); return; }
  const rl = w.realm && REALMS[w.realm];

  },
  async wGamble(){
    const h = state.hero, life = h.coins < 1; wBegin();
    if(!life) h.coins--;
    const [v] = await roll(life ? "A sua vida" : "Aposta", 1);
    if(v === 6){ h.coins += 5; rollNote("Ganhou!"); state.ui.cityMsg = "Você ganhou 5 moedas!"; }
    else if(life){ rollNote("Perdeu"); busy = false; killHero("Apostou a vida num jogo de azar e perdeu"); persist(); render(); return; }
    else { rollNote("Perdeu"); state.ui.cityMsg = "Você perdeu a moeda."; }
    wEnd();
  },

    const h = state.hero, hx = wHere(), fort = hx.loc.k === "fort"; wBegin();
    const v = await roll("Roubo", fort ? 3 : 2), s = v.reduce((a,b)=>a+b,0);
    if(s <= 4){ rollNote("Pego por um aventureiro"); busy = false; killHero("Tentou roubar um aventureiro e foi morto na hora"); persist(); render(); return; }
    if(s <= 7){
      rollNote("Cadeia");
      const [d] = await roll("Fuga", 1);
      h.pv = Math.max(0, h.pv - d);
      if(h.pv <= 0 && !samambro()){ busy = false; killHero("Morreu tentando fugir da cadeia"); persist(); render(); return; }
      hx.banned = true; wLog(`Você fugiu da cadeia (${d} de dano) e não pode mais entrar nesta cidade.`);
      state.ui = {}; busy = false; go("world"); return;
    }
    const gain = {8:2, 9:5, 10:7, 11:10, 12:10, 13:20, 14:20}[s];
    if(gain){ h.coins += gain; rollNote(`${gain} moedas`); state.ui.cityMsg = `Você roubou ${gain} moedas.`; }
    else { const type = s === 15 ? 2 : s === 16 ? 4 : 1, it = rollTreasure(DUNGEONS[type]); rollNote(`Tesouro de ${DUNGEONS[type].n}`); wAddItem(it); state.ui.cityMsg = `Você roubou um tesouro: ${it.n.split(" (")[0]}.`; }
    wEnd();
  },
  async wArena(){
    const h = state.hero; wBegin();
    const v = await roll("Campeão da Arena", 3), s = v[0]+v[1]+v[2], [n, pv, dano, tr, key] = ARENA[s];
    rollNote(n); H().arena++;
    await new Promise(r=>setTimeout(r, reduced ? 0 : 600));
    busy = false;
    startWorldCombat({n, pv, dano, tr, key}, 1, {arena:true});
  },
  wKing(){ H().king++; state.ui.cityMsg = "O Rei te recebeu no salão do trono. Agora você conhece a nobreza desta terra."; persist(); render(); }
};

/* desenha um mercenário (boneco da raça + acessórios). fx, fy = pés */
function drawMerc(ctx, n, wn, fx, fy, t, pose, back){
  const big = n === "Ogro de Carga";
  const doll = mercDoll(n, wn);
  ctx.save(); ctx.translate(Math.round(fx), Math.round(fy)); if(big) ctx.scale(1.5, 1.5);
  const head = -(20 + DOLL_OY + 1) + DOLL_OY;           /* topo do quadro do boneco, sem a folga de cima */
  if(big && !back){ const pk = accSprite("pack"); ctx.drawImage(pk, -9, head - 2); }
  const pf = drawHero(ctx, 0, 0, t, pose, back, undefined, doll);
  if(big && back){ const pk = accSprite("pack"); ctx.drawImage(pk, -9, head + 1); }
  if(n === "Mago de Aluguel"){ const h = accSprite("hat"); ctx.drawImage(h, -7, head - 11); }
  if(n === "Menestrel"){ const l = accSprite("lute"); if(back) ctx.drawImage(l, -8, head + 3); else ctx.drawImage(l, -6, head + 5); }
  ctx.restore();

}

/* quadrúpede genérico (de lado): pernas do fundo, cauda, corpo, quadril, pernas da frente, pescoço e cabeça */
function quad(o, f, q){
  const {P, disc, line, B} = o, C = q.c, sw = f ? 1 : 0;
  const bx = q.x, by = B - q.leg - Math.round(q.ry*.4);
  const legTop = by + Math.round(q.ry*.2), wl = q.legW || 2;
  const leg = (x, far, swing) => { const len = B - legTop;
    for(let y=legTop; y<=B; y++){ const k = (y-legTop)/len, w = k < .45 ? wl + 1 : wl, dx = k > .5 ? swing : 0;
      for(let i=0;i<w;i++) P(x + i + dx, y, y === B ? (q.hoof || C[2]) : far ? C[2] : (i === 0 ? C[0] : C[1])); } };
  leg(bx - q.rx + 2, true, -sw); leg(bx + q.rx - 4, true, sw);
  if(q.tail) q.tail(o, bx - q.rx, by - Math.round(q.ry*.3), f);
  disc(bx, by, q.rx, q.ry, (x,y,e,dx,dy)=>P(x,y, dy < -q.ry*.35 ? C[0] : dy > q.ry*.4 ? (q.belly || C[2]) : C[1]));
  disc(bx - q.rx + 3, by + 1, Math.max(2, q.rx*.32), q.ry*.95, (x,y,e,dx,dy)=>P(x,y, dy < -q.ry*.3 ? C[0] : dx > 1 ? C[2] : C[1]));
  if(q.marks) q.marks(o, bx, by, f);
  leg(bx - q.rx + 3, false, sw); leg(bx + q.rx - 3, false, -sw);
  /* pescoço */
  const nx = bx + q.rx - 2, ny = by - Math.round(q.ry*.35), hx = nx + q.hdx, hy = ny + q.hdy;
  const steps = Math.max(2, Math.round(Math.hypot(q.hdx, q.hdy)));
  for(let k=0;k<=steps;k++){ const t = k/steps, r = q.ry*.6*(1-t) + q.hr*.55*t; disc(nx + q.hdx*t, ny + q.hdy*t, r, r, (x,y,e,dx,dy)=>P(x,y, dx < -r*.3 ? C[0] : C[1])); }
  if(q.mane) q.mane(o, nx, ny, hx, hy);
  /* cabeça e focinho */
  disc(hx, hy, q.hr, q.hr*.85, (x,y,e,dx,dy)=>P(x,y, dy < -q.hr*.3 ? C[0] : C[1]));
  if(q.snout){ const [sl, sh, mc] = q.snout; disc(hx + q.hr*.6 + sl/2, hy + q.hr*.3, sl/2 + .5, sh/2 + .3, (x,y,e,dx,dy)=>P(x,y, dy > 0 ? (mc || C[1]) : C[1])); P(Math.round(hx + q.hr*.6 + sl), Math.round(hy + q.hr*.3 - sh/2 + .5), q.nose || "#1a1410"); }
  P(Math.round(hx + q.hr*.35), Math.round(hy - q.hr*.25), q.eye || "#1a1410");
  if(q.ears) q.ears(o, hx, hy, q.hr);
  if(q.extra) q.extra(o, hx, hy, bx, by, f);
}

function party(h){ h = h || state.hero; if(!h) return []; if(!h.party) h.party = []; return h.party; }
function partyOf(kind, h){ return party(h).filter(p=>p.kind === kind); }
function hasAlly(n, h){ return party(h).some(p=>p.n === n && p.pv > 0); }
function mercCount(h){ return partyOf("merc", h).length; }
function provMax(h){ return 20 * (1 + mercCount(h)); }

function torchHolder(h){ return party(h).find(p=>p.kind === "merc" && !(MERCS[p.n] && MERCS[p.n].noGear)); }
function freeLock(){ return hasClass("Chaveiro") || hasClass("Ladrão") || hasAlly("Arrombador"); }
function newPid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- aliados no combate ---------- */
function buildAllies(world, arena){
  const h = state.hero, inDg = !!(state.dungeon && state.dungeon.inside);
  if(arena || (typeof COOP !== "undefined" && COOP.on())) return [];
  return party(h).filter(p=>{
    if(p.pv <= 0) return false;
    if(p.kind === "merc") return !(MERCS[p.n] && MERCS[p.n].nofight);
    if(p.kind === "animal") return !(inDg && ANIMALS[p.n] && ANIMALS[p.n].noDg);
    if(p.kind === "mount") return !!world;
    if(p.kind === "summon") return inDg;
    return false;
  }).map(p=>({pid:p.id, n:p.n, kind:p.kind, pv:p.pv, max:p.max, d:p.w ? p.w.d : p.d || null, wn:p.w ? p.w.n : null, tr:p.tr||"", key:p.key||p.n, race:p.race, acted:false}));
}
function alliesIn(){ const c = C(); return c && c.allies ? c.allies.filter(a=>a.pv > 0) : []; }
function allyCanAct(a){ const m = MERCS[a.n]; if(m && m.music) return false; return !!(a.d || allySpells(a).length || (m && (m.explode || m.joke))); }
function allySpells(a){ const p = party().find(x=>x.id === a.pid); if(!p || !p.spells) return []; return Object.entries(p.spells).filter(([n,s])=>s.left > 0 && ["Cura","Luz","Raio de Gelo","Relâmpago","Bola de Fogo"].includes(n)); }
function syncAllies(){
  const c = C(), h = state.hero; if(!c || !c.allies || !h) return;
  c.allies.forEach(a=>{
    if(!a.pid) return;
    const p = party(h).find(x=>x.id === a.pid); if(!p) return;
    p.pv = a.pv;
  });
  const gone = party(h).filter(p=>p.pv <= 0);
  gone.forEach(p=>log(`${p.n} morreu em combate.`));
  h.party = party(h).filter(p=>p.pv > 0);
}
function allyDamage(expr){ const m = String(expr).match(/^(\d*)d6([+-]\d+)?$/); return m ? null : +expr; }
async function allyAttack(i){
  const c = C(), a = c.allies[i], u = c.units[c.sel];
  if(!a || a.acted || a.pv <= 0 || !a.d || !u || u.pv <= 0) return;
  const fixed = allyDamage(a.d);
  let die = 0, dmg;
  if(fixed === null){ [die] = await roll(a.n, 1); const mod = +((a.d.match(/([+-]\d+)$/)||[])[1] || 0); dmg = Math.max(0, die + mod); }
  else dmg = fixed;
  if(a.n === "Soldado Anão" && /Orc|Goblin/.test(u.name)){ dmg += 1; }
  cLog(`${a.n} ataca${a.wn ? " com " + a.wn : ""}: ${dmg} de dano.`);
  await hitMonster(c.sel, dmg, {die, w:{n:""}, ally:true});
  a.acted = true;
}
async function allyCast(i, sp){
  const c = C(), a = c.allies[i], p = party().find(x=>x.id === a.pid), h = state.hero;
  if(!a || a.acted || !p || !p.spells[sp] || p.spells[sp].left <= 0) return;
  p.spells[sp].left--;
  const u = c.units[c.sel];
  if(sp === "Cura"){ h.pv = Math.min(h.pvMax, h.pv + 5); cLog(`${a.n} conjura Cura em você: +5 PV.`); }
  if(sp === "Luz"){ h.torches = Math.min(10, h.torches + 1); cLog(`${a.n} conjura Luz: vale como uma tocha.`); }
  if(sp === "Relâmpago" && u){ cLog(`${a.n} lança Relâmpago em ${u.name}!`); await hitMonster(c.sel, 6, {spell:true, w:{n:""}, ally:true}); }
  if(sp === "Raio de Gelo" && u){ cLog(`${a.n} lança Raio de Gelo em ${u.name}!`); await hitMonster(c.sel, 4, {spell:true, w:{n:""}, ally:true}); u.frozen = Math.max(u.frozen||0, 1); }
  if(sp === "Bola de Fogo"){ cLog(`${a.n} lança Bola de Fogo!`); for(let k=0;k<c.units.length;k++) if(c.units[k].pv > 0) await hitMonster(k, 5, {spell:true, w:{n:""}, ally:true}); }
  a.acted = true;
}
async function allyAfter(){
  const c = C();
  if(!alive().length){ c.phase = "won"; cLog("Todos os monstros foram derrotados!"); busy = false; persist(); render(); return; }
  pickNextTarget();
  if(alliesIn().filter(allyCanAct).every(a=>a.acted)){ await runMonsterTurn(); return; }
  busy = false; persist(); render();
}
async function toAllies(){
  const c = C();
  const ready = alliesIn().filter(allyCanAct);
  if(!ready.length){ await runMonsterTurn(); return; }
  c.allies.forEach(a=>a.acted = false);
  c.phase = "ally"; busy = false; persist(); render();
}
/* divisão do dano entre o aventureiro e os aliados */
function splitInfo(){
  const c = C(), p = c.pending, al = alliesIn(), need = p.total + p.poison, members = al.length + 1;
  const minEach = need >= members ? 1 : 0;
  const allySum = al.reduce((s,a)=>s + (c.split[a.pid || a.n + c.allies.indexOf(a)] || 0), 0);
  return {need, minEach, allySum, hero:need - allySum, al};
}
function splitKey(a){ const c = C(); return a.pid || a.n + c.allies.indexOf(a); }
async function applySplit(){
  const c = C(), h = state.hero, s = splitInfo();
  if(s.hero < s.minEach || s.al.some(a=>(c.split[splitKey(a)]||0) < s.minEach)) return;
  s.al.forEach(a=>{ const d = c.split[splitKey(a)] || 0; if(!d) return; a.pv = Math.max(0, a.pv - d); cLog(`${a.n} recebe ${d} de dano${a.pv ? ` (${a.pv}/${a.max})` : " e cai"}.`); });
  const heroPoison = Math.max(0, c.pending.poison - s.allySum), heroNormal = s.hero - heroPoison;
  c.split = {};
  const absorb = ARMOR_SLOTS.filter(sl=>h.armor[sl] && armorCur(h.armor[sl]) > 0);
  if(heroNormal > 0 && absorb.length){ c.pending = {total:heroNormal, poison:heroPoison}; c.alloc = {}; c.phase = "alloc"; busy = false; persist(); render(); return; }
  c.pending = null;
  applyHeroDamage({}, heroNormal, heroPoison);
}

function summonAlly(n, pv, d, tr, key){ const c = C(); c.allies = c.allies || []; c.allies.push({pid:null, n, kind:"summon", pv, max:pv, d, tr:tr||"", key:key||n, acted:true}); }
function summonSkeleton(){

/* contratos: valem para uma masmorra (pode sair e voltar) */
function partyEnterDungeon(d){
  const h = state.hero; if(!h) return;
  const left = [];
  partyOf("merc", h).forEach(m=>{ if(!m.dg) m.dg = d.uid; else if(m.dg !== d.uid) left.push(m); });
  if(left.length){ h.party = party(h).filter(p=>!left.includes(p)); log(`${left.map(m=>m.n).join(", ")} foi contratado para outra masmorra e foi embora.`); }
}
function partyLeaveDungeon(d){
  const h = state.hero; if(!h) return;
  const sum = partyOf("summon", h).filter(p=>p.untilDg);
  if(sum.length) log("Os esqueletos invocados desmoronam ao sair da masmorra.");
  let done = [];
  if(d.complete) done = partyOf("merc", h).filter(m=>m.dg === d.uid);
  if(done.length) log(`${done.map(m=>m.n).join(", ")} cumpriu o contrato e foi embora.`);
  h.party = party(h).filter(p=>!sum.includes(p) && !done.includes(p));
}

function tameSpot(k){

/* aliados desenhados na arena, ao lado do aventureiro */
function drawAllies(ctx, W, H, t){
  const c = C(); if(!c || !c.allies) return;
  const al = c.allies.filter(a=>a.pv > 0);
  const slots = [[-34,0],[34,0],[-62,-6],[62,-6],[-88,-10],[88,-10]];
  al.slice(0,6).forEach((a,i)=>{
    const [dx, dy] = slots[i], x = Math.round(W/2 + dx), y = H - 6 + dy;
    if(a.kind === "merc"){
      drawMerc(ctx, a.n, a.wn, x, y, t, frame % 12 >= 6 ? "breath" : "idle", true);
    } else if(BEASTS[a.key]){
      const bs = beastSprite(a.key, Math.floor(frame/6) % 2);
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(Math.round(x - bs.width/2 + 2), y, bs.width - 4, 2);
      ctx.drawImage(bs, Math.round(x - bs.width/2), y - bs.height + 1);
    } else {
      const d = sprDef(a.key), w = d && d.rows ? Math.max(...d.rows.map(r=>r.length)) : 16, k = w > 22 ? Math.max(.45, 18/w) : 1;
      if(k < 1){ ctx.save(); ctx.translate(x, y); ctx.scale(k, k); drawMonsterSprite(ctx, a.key, 0, 0, t, frame, {}); ctx.restore(); }
      else drawMonsterSprite(ctx, a.key, x, y, t, frame, {});
    }
    const f = a.pv / a.max, bw = 16;
    ctx.fillStyle = "#0c0a12"; ctx.fillRect(x-bw/2-1, y+1, bw+2, 4);
    ctx.fillStyle = f > .5 ? "#6ac04a" : f > .25 ? "#e0b038" : "#d83a2a"; ctx.fillRect(x-bw/2, y+2, Math.max(1, Math.round(bw*f)), 2);
  });
}

const actionsParty = {
  async hireMerc(b){
    const h = state.hero, n = b.dataset.n, m = MERCS[n];
    if(!m || h.coins < m.cost || COOP.on() || !mercsFor(worldCityHere()).includes(n)) return;
    busy = true; lockButtons();
    h.coins -= m.cost;
    const p = {id:newPid(), kind:"merc", n, pv:m.pv, max:m.pv, w:m.w ? {n:m.w[0], d:m.w[1]} : null, race:m.race, dg:null};
    if(m.spells){ p.spells = {}; for(let i=0;i<m.spells;i++){ const [v] = await roll(`Magia de ${n}`, 1); const s = SPELLS[v].n; rollNote(s); p.spells[s] = p.spells[s] ? {max:p.spells[s].max+1, left:p.spells[s].left+1} : {max:1, left:1}; } }
    party(h).push(p);
    state.ui.cityMsg = `${n} foi contratado por ${m.cost} moedas.${p.spells ? ` Magias: ${Object.entries(p.spells).map(([s,v])=>v.max>1?`${s} ×${v.max}`:s).join(", ")}.` : ""}`;
    busy = false; persist(); render();
  },
  dismiss(b){
    const h = state.hero, i = party(h).findIndex(p=>p.id === b.dataset.id); if(i < 0) return;
    const p = party(h)[i];
    if(state.ui.dismiss !== p.id){ state.ui.dismiss = p.id; state.ui.armsMsg = `Toque de novo em Dispensar para confirmar: ${p.n} vai embora e não volta${p.kind === "merc" ? " (o pagamento não é devolvido)" : ""}.`; render(); return; }
    party(h).splice(i,1); state.ui.dismiss = null; state.ui.armsMsg = `${p.n} foi embora.`; persist(); render();
  },
  async buyMount(b){
    const h = state.hero, n = b.dataset.n, m = MOUNTS[n];
    if(!m || h.coins < m.cost || partyOf("mount").length || animalSlots() <= 0) return;
    h.coins -= m.cost; party(h).push({id:newPid(), kind:"mount", n, pv:m.pv, max:m.pv, d:m.d, key:m.key});
    state.ui.cityMsg = `Você comprou ${n === "Llama" ? "uma Llama" : "um " + n}.`; persist(); render();
  },
  async tame(b){
    const h = state.hero, n = b.dataset.n, mount = !!b.dataset.m, a = mount ? MOUNTS[n] : ANIMALS[n], cost = mount ? 8 : 4;
    if(!a || animalSlots() <= 0 || (h.provisions||0) < cost || (mount && partyOf("mount").length) || !tameSpot(WD().pos)) return;
    wBegin();
    h.provisions -= cost;
    const [v] = await roll(`Adestrar ${n}`, 1);
    if(v >= a.dif){ rollNote("Conseguiu!"); party(h).push({id:newPid(), kind:mount ? "mount" : "animal", n, pv:a.pv, max:a.pv, d:a.d, key:a.key}); wLog(`Você adestrou ${n === "Águia" || n === "Coruja" || n === "Cobra" || n === "Llama" ? "uma " : "um "}${n}!`); }
    else { rollNote("Fugiu"); wLog(`O animal fugiu. Você gastou ${cost} provisões tentando adestrá-lo.`); }
    wEnd();
  },
  giveMerc(b){
    const h = state.hero, it = h.bag[+b.dataset.i], p = party(h).find(x=>x.id === b.dataset.id);
    if(!it || !p || p.kind !== "merc" || (MERCS[p.n] && MERCS[p.n].noGear)) return;
    if(it.weapon){ p.w = {n:it.n.split(" (")[0], d:it.d}; state.ui.armsMsg = `${p.n} agora luta com ${p.w.n}. Ele não vai devolver.`; }
    else if(it.slot){ p.max += it.pv||0; p.pv += it.pv||0; state.ui.armsMsg = `${p.n} vestiu ${it.n.split(" (")[0]}: +${it.pv||0} PV. Ele não vai devolver.`; }
    else return;
    h.bag.splice(+b.dataset.i, 1); state.ui.bagSel = null; persist(); render();
  },
  async allyAtk(b){ if(busy) return; busy = true; lockButtons(); await allyAttack(+b.dataset.i); await allyAfter(); },
  async allyCast(b){ if(busy) return; busy = true; lockButtons(); await allyCast(+b.dataset.i, b.dataset.n); await allyAfter(); },
  async allyBoom(b){
    if(busy) return; const c = C(), a = c.allies[+b.dataset.i]; if(!a || a.acted) return;
    busy = true; lockButtons();
    cLog(`${a.n} explode! 5 de dano em todos os monstros.`);
    for(let k=0;k<c.units.length;k++) if(c.units[k].pv > 0) await hitMonster(k, 5, {spell:true, w:{n:""}, ally:true});
    a.pv = 0; a.acted = true;
    await allyAfter();
  },
  async allyJoke(b){
    if(busy) return; const c = C(), a = c.allies[+b.dataset.i]; if(!a || a.acted) return;
    cLog(pick([`${a.n} tropeça de propósito e faz uma reverência.`, `${a.n} imita o monstro. Ninguém ri.`, `${a.n} conta uma piada sobre um goblin e um balde.`, `${a.n} faz malabares com três ossos.`]));
    a.acted = true; busy = true; await allyAfter();
  },
  async allyWait(b){ if(busy) return; const a = C().allies[+b.dataset.i]; if(!a) return; a.acted = true; busy = true; await allyAfter(); },
  async allyAll(){
    if(busy) return; busy = true; lockButtons();
    const c = C();
    for(let i=0;i<c.allies.length;i++){ const a = c.allies[i]; if(a.pv > 0 && !a.acted && a.d && allyCanAct(a) && alive().length){ pickNextTarget(); await allyAttack(i); } }
    c.allies.forEach(a=>{ if(a.pv > 0 && allyCanAct(a) && !a.acted) a.acted = true; });
    await allyAfter();
  },
  splitD(b){ const c = C(), k = b.dataset.k; c.split[k] = Math.max(0, (c.split[k]||0) + +b.dataset.d); render(); },
  splitOk(){ if(busy) return; applySplit(); }
};

/* =========================================================
   VÁRIOS JOGOS SALVOS (até 5) E SINCRONIZAÇÃO COM A NUVEM
   Cada jogo é independente (aventureiro, masmorras, mundo e Salão dos Heróis).
   A nuvem guarda os jogos na pasta da "chave do jogador"; outro aparelho é ligado uma vez por um código curto.
   Ao abrir o app, a versão mais nova de cada jogo é baixada sozinha; a versão substituída fica como cópia anterior.

const META_KEY = KEY.replace("dungeonquest.save.v1", "dungeonquest.meta.v1");
const MAX_SLOTS = 5;
let meta = null, cloudIdx = {};
function rid(n){ const L = "abcdefghijkmnpqrstuvwxyz23456789"; return "j" + Array.from({length:n-1},()=>L[Math.floor(Math.random()*L.length)]).join(""); }
function slotKey(id){ return KEY + ".s." + id; }
function prevKey(id){ return KEY + ".p." + id; }
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }
function loadMeta(){
  try{ meta = JSON.parse(localStorage.getItem(META_KEY) || "null"); }catch(e){ meta = null; }
  if(!meta || !meta.slots) meta = {player:null, cur:null, slots:{}, del:{}};
  if(!meta.del) meta.del = {};
  if(!meta.player) meta.player = rid(20);
  if(!meta.cur || !meta.slots[meta.cur]){
    const id = rid(8), old = localStorage.getItem(KEY);
    if(old) try{ localStorage.setItem(slotKey(id), old); }catch(e){}       /* o save antigo vira o primeiro jogo */
    meta.cur = id; meta.slots[id] = {n:1, synced:0, at:Date.now(), sum:{}};
  }
  saveMeta();
}
function slotSummary(s){
  s = s || state; const h = s.hero, d = s.dungeon, w = s.world;
  let where = "";
  if(d && d.inside) where = d.name;
  else if(w && w.hex && w.hex[w.pos]){ const hx = w.hex[w.pos]; where = hx.loc && (hx.loc.k === "city" || hx.loc.k === "fort") ? locLabel(hx.loc) : (hx.dg ? hx.dg.name : TERR[hx.t].n); }
  else if(h) where = "Cidade";
  return {name:h ? h.name : "", who:h ? `${raceName(h)} ${classLabel(h)}` : "", pv:h ? h.pv : 0, pvMax:h ? h.pvMax : 0, where, dead:s.cemetery ? s.cemetery.length : 0};
}
function slotIds(){
  const ids = new Set(Object.keys(meta.slots));
  Object.keys(cloudIdx||{}).forEach(id=>{ if(!meta.del[id]) ids.add(id); });
  return [...ids];
}

const OLD_NAMES = [["Golens Ossos e Pedra", "Constructos de Ossos e Pedra"], ["Golem Ossos e Pedra", "Constructo de Ossos e Pedra"], ["Golens Ossos", "Constructos de Ossos"], ["Golem Ossos", "Constructo de Ossos"], ["Golens de Serpentes", "Estátuas de Víboras"], ["Golem de Serpentes", "Estátua de Víboras"], ["Golens de Lixo", "Constructos de Entulho"], ["Golem de Lixo", "Constructo de Entulho"], ["Bolhas Assassinas", "Orbes Gelatinosas"], ["Bolha Assassina", "Orbe Gelatinosa"], ["Bolha Explosiva", "Orbe de C4"], ["Ogros Costurados", "Brutamontes Remendados"], ["Ogro Costurado", "Brutamontes Remendado"], ["Olhos Flutuantes", "Olhos Errantes"], ["Olho Flutuante", "Olho Errante"], ["Fantasmas do Príncipe", "Espectros do Herdeiro"], ["Fantasma do Príncipe", "Espectro do Herdeiro"], ["Deusa sem Rosto", "Deusa das Mil Faces"], ["Vespa Gigante do Ferrão Mortal", "Vespa Rainha"], ["Abominação Alquímica", "Criatura de Laboratório"], ["Sacerdotisa Emplumada", "Sacerdotisa das Penas"], ["Barqueiro da Morte", "Carontes"], ["Sangue Sugas Gigantes", "Sanguessugas Gigantes"], ["Sangue Suga Gigante", "Sanguessuga Gigante"], ["Líderes de Tribo Javaligor", "Chefes Javalídeos"], ["Líder de Tribo Javaligor", "Chefe Javalídeo"], ["Soldados Javaligor", "Guerreiros Javalídeos"], ["Soldado Javaligor", "Guerreiro Javalídeo"], ["Javaligor", "Javalídeo"], ["Cadeiras Vivas", "Móveis Mímicos"], ["Cadeira Viva", "Móvel Mímico"], ["Fungomestres", "Mestres Micélio"], ["Fungomestre", "Mestre Micélio"], ["Rainhas das Mãos de Lâminas", "Rainhas Gume"], ["Rainha das Mãos de Lâminas", "Rainha Gume"], ["Pudim da Morte", "Manjar Sepulcral"], ["Horror Miante", "Terror Sussurrante"], ["Bolrag", "Ignarrok"], ["Hagork", "Gruzak"], ["Pavão Misterioso", "Pavão de Mil Olhos"], ["Monstrinho Inflamável", "Brasinha"], ["Fungóides", "Funghinhos"], ["Fungóide", "Funghinho"], ["Impiedoso", "Caça-Diabretes"], ["Goblinator", "Mata-Goblins"], ["Limpa-Esgoto", "Faxineiro Cruel"], ["Hotep", "Caça-Múmias"], ["Mata-Orc", "A const OLD_NAMES_TXT = [["Fungóide","Shitakio"],["Gnoblin", "Goblinomo"], ["Lobisóide", "Lobisomem"], ["Minotáurio", "Minotauro"], ["Vampirão", "Lorde Vampiro"], ["Corvino", "Povo-Corvo"], ["Zumbi Esperto", "Morto-Vivo Matreiro"], ["Sereia reversa", "Peixe Bípede"], ["Vagalóide", "Luminídeo"], ["Aboboróide", "Abobrino"], ["Samambro", "Avencino"], ["Patovsky", "Marrecko"], ["Pandakhan", "Pandolfo"], ["Sharkin", "Tutubarão"], ["Saponildes", "Batráquio"], ["Lagartichano", "Lagartíxio"], ["Ponão", "Pônei"], ["Keyroz", "Evanescente"], ["Olavoides", "Rubrino"], ["Mimiminion", "Bananion"], ["Jenypher", "Tetrabraço"], ["Tri-kri-kri", "Arrakiano"], ["Coutim", "Larápio"], ["Levent", "Andarilho"], ["Fira", "Fátuo"], ["Mahok", "Pelegrosso"], ["Tailox", "Raposino"], ["Juban", "Estrondo"], ["Blankin", "Voltaico"], ["Capivoraz", "Capivaroso"], ["Impiedoso", "Caça-Diabretes"], ["Goblinator", "Mata-Goblins"], ["Limpa-Esgoto", "Faxineiro Cruel"], ["Hotep", "Caça-Múmias"], ["Mata-Orc", "Algoz de Orcs"], ["Dragonslayer", "Matador de Dragões"], ["Helsing", "Caçador de Vampiros"], ["Multidestro", "Mestre das Armas"]];
function renameSaved(raw){
  if(typeof raw !== "string") return raw;
  OLD_NAMES.forEach(([a,b])=>{ raw = raw.split('"' + a + '"').join('"' + b + '"'); });
  return raw.replace(/"who":"([^"]*)"/g, (m,t)=>{ OLD_NAMES_TXT.forEach(([a,b])=>{ t = t.split(a).join(b); }); return '"who":"' + t + '"'; });
}
function readSlot(id){ try{ const raw = localStorage.getItem(slotKey(id)); if(raw){ const s = JSON.parse(renameSaved(raw)); if(s && s.v === 1) return s; } }catch(e){} return null; }
function useState(s){
  const keep = state && state.settings ? state.settings : (meta.settings || null);
  state = s || freshState();
  if(keep) state.settings = keep;
  migrate(); applySkin(); mapVersion++;
}
const CLOUD = {
  timer:null, busy:false, status:"",
  ok(){ return !!(meta && meta.player) && NET.ready() && (NET.sim() || /^https?:/.test(location.protocol)); },
  base(){ return `contas/${meta.player}`; },
  schedule(){ if(!this.ok() || this.timer) return; this.timer = setTimeout(()=>{ this.timer = null; this.flush(); }, 15000); },
  async flush(){
    if(!this.ok() || this.busy) return;
    const L = meta.slots[meta.cur]; if(!L || L.n <= L.synced) return;
    this.busy = true;
    try{ await this.syncSlot(meta.cur); this.status = "ok"; }catch(e){ this.status = "off"; }
    this.busy = false;
  },
  async push(id){
    const raw = localStorage.getItem(slotKey(id)), L = meta.slots[id]; if(!raw || !L) return;
    if(emptySlot(readSlot(id))) return;                                   /* jogo vazio não sobe */
    const n = L.n, at = L.at || Date.now(), days = L.days || 0, gen = L.gen || 0;
    await NET.put(`${this.base()}/slots/${id}`, {d:raw, n, at, days, gen});
    await NET.put(`${this.base()}/idx/${id}`, {n, at, days, gen, sum:L.sum || {}});
    L.synced = n; cloudIdx[id] = {n, at, days, gen, sum:L.sum || {}}; saveMeta();
  },
  async pull(id, c){
    const rec = await NET.get(`${this.base()}/slots/${id}`); if(!rec || !rec.d) return false;
    const old = localStorage.getItem(slotKey(id));
    try{ if(old) localStorage.setItem(prevKey(id), old); localStorage.setItem(slotKey(id), rec.d); }catch(e){ return false; }
    meta.slots[id] = {n:rec.n, synced:rec.n, at:rec.at, days:rec.days || 0, gen:rec.gen || 0, sum:(c && c.sum) || {}, prev:!!old || (meta.slots[id] && meta.slots[id].prev)};
    saveMeta();
    if(id === meta.cur) useState(readSlot(id));
    return true;
  },
  /* decide quem é o mais atual: uma versão restaurada (gen maior) sempre vence;
     depois, quem tem mais dias no mapa do mundo; empatando, quem jogou mais ações */
  async syncSlot(id, c){
    if(c === undefined) c = await NET.get(`${this.base()}/idx/${id}`);
    const L = meta.slots[id];
    if(!c){ if(L) await this.push(id); return; }
    cloudIdx[id] = c;
    if(!L){ return; }
    const cmp = ((L.gen||0) - (c.gen||0)) || ((L.days||0) - (c.days||0)) || (L.n - (c.n||0));
    if(cmp > 0) await this.push(id);
    else if(cmp < 0) await this.pull(id, c);
    else if(L.synced !== L.n){ L.synced = L.n; saveMeta(); }
  },
  async boot(){
    if(!this.ok()) return;
    this.busy = true;
    try{
      const [idx, del] = await Promise.all([NET.get(`${this.base()}/idx`), NET.get(`${this.base()}/del`)]);
      Object.keys(del || {}).forEach(id=>{ meta.del[id] = 1; if(meta.slots[id] && id !== meta.cur) removeLocal(id); });
      cloudIdx = {}; Object.entries(idx || {}).forEach(([id,v])=>{ if(!meta.del[id] && v) cloudIdx[id] = v; });
      for(const id of Object.keys(meta.slots)) await this.syncSlot(id, cloudIdx[id] || null);
      this.status = "ok";
    }catch(e){ this.status = "off"; }
    this.busy = false; saveMeta();
    if(!busy && ["title","slots","save","sheet"].includes(state.screen)) render();
  }
};
function emptySlot(s){ return !s || (!s.hero && !(s.cemetery||[]).length && !s.world && !s.dungeon && !s.draft); }
function removeLocal(id){ try{ localStorage.removeItem(slotKey(id)); localStorage.removeItem(prevKey(id)); }catch(e){} delete meta.slots[id]; }
function newSlot(){
  const id = rid(8);
  meta.slots[id] = {n:1, synced:0, at:Date.now(), sum:{}};
  meta.cur = id; saveMeta();
  useState(freshState());
  persist();
  return id;
}
function fmtWhen(t){ if(!t) return ""; try{ return new Date(t).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}); }catch(e){ return ""; } }
function viewSlots(){
  const ids = slotIds().sort((a,b)=>((meta.slots[b]||cloudIdx[b]||{}).at||0) - ((meta.slots[a]||cloudIdx[a]||{}).at||0));
  const rows = ids.map(id=>{
    const L = meta.slots[id], c = cloudIdx[id], s = (L && L.sum && L.sum.name !== undefined ? L.sum : null) || (c && c.sum) || {};
    const at = Math.max((L && L.at)||0, (c && c.at)||0), cur = id === meta.cur, ask = state.ui.delSlot === id;
    return `<div class="slotrow ${cur ? "cur" : ""}">
      <div class="txt"><b>${s.name ? esc(s.name) : "Jogo sem aventureiro"}${cur ? " <span class=\"chip\">atual</span>" : ""}</b>
        ${s.who ? `<span class="small">${esc(s.who)} · ${N(s.pv)}/${N(s.pvMax)} PV</span>` : ""}
        <span class="small muted">${s.where ? esc(s.where) + " · " : ""}${fmtWhen(at)}${!L ? " · na nuvem" : ""}</span>
        ${L && L.prev && localStorage.getItem(prevKey(id)) ? `<button class="linkbtn small" data-act="slotPrev" data-id="${id}">Voltar à versão anterior</button>` : ""}</div>
      ${ask ? `<div class="row"><button class="btn ghost" data-act="slotDelNo">Manter</button><button class="btn" data-act="slotDel" data-id="${id}" data-ok="1">Apagar</button></div>`
        : `<div class="slotbtns">${cur ? "" : `<button class="use" data-act="slotLoad" data-id="${id}">Jogar</button>`}<button class="use" data-act="slotDel" data-id="${id}" aria-label="Apagar jogo">✕</button></div>`}
    </div>`;
  }).join("");
  return `
  ${bar("Jogos salvos")}
  <p class="muted small">Até ${MAX_SLOTS} jogos. Cada um tem seu aventureiro, suas masmorras, seu mundo e seu Salão dos Heróis.</p>
  <div class="sheet">${rows || `<p class="muted small">Nenhum jogo salvo.</p>`}</div>
  ${state.ui.delSlot ? `<p class="small">Apagar remove o jogo deste aparelho e da nuvem, para sempre.</p>` : ""}
  <p class="toast" id="toast">${esc(toastMsg)}</p>`;
}
function cloudStatusTxt(){
  if(!CLOUD.ok()) return "A nuvem não está disponível aqui.";
  if(CLOUD.busy) return "Sincronizando...";
  if(CLOUD.status === "off") return "Sem conexão: os jogos sobem para a nuvem quando a internet voltar.";

const actionsSlots = {
  newGame(){

    if(!state.hero){ startDraft(); return; }
    if(slotIds().length >= MAX_SLOTS){ state.ui.slotsFull = true; render(); return; }

  },
  slotsFullOk(){ state.ui = {}; go("slots"); },
  async slotLoad(b){
    const id = b.dataset.id; if(busy || id === meta.cur) return;
    if(COOP.on()){ toastMsg = "Saia da dupla antes de trocar de jogo."; render(); return; }
    busy = true; lockButtons(); toastMsg = "Carregando...";
    const t = $("#toast"); if(t) t.textContent = toastMsg;
    persist(); try{ await CLOUD.flush(); }catch(e){}
    try{ if(CLOUD.ok()) await Promise.race([CLOUD.syncSlot(id, meta.slots[id] ? undefined : (cloudIdx[id] || null)), new Promise(r=>setTimeout(r, 5000))]); }catch(e){}
    if(!meta.slots[id] && cloudIdx[id]){ try{ meta.slots[id] = {n:0, synced:0, at:0, sum:cloudIdx[id].sum || {}}; await CLOUD.pull(id, cloudIdx[id]); }catch(e){} }
    const s = readSlot(id);
    busy = false;
    if(!s){ if(meta.slots[id] && !localStorage.getItem(slotKey(id))) delete meta.slots[id]; toastMsg = "Não foi possível baixar esse jogo agora. Confira a internet."; render(); return; }
    const was = meta.cur, wasEmpty = emptySlot(state);
    meta.cur = id; saveMeta(); useState(s);
    if(wasEmpty && was !== id){ removeLocal(was); saveMeta(); }
    toastMsg = ""; state.ui = {};
    go(state.hero ? (state.dungeon && state.dungeon.inside ? "explore" : (state.world ? "world" : "sheet")) : "title");
  },
  slotDel(b){
    const id = b.dataset.id;
    if(!b.dataset.ok){ state.ui.delSlot = id; render(); return; }
    state.ui.delSlot = null;
    removeLocal(id); meta.del[id] = 1; delete cloudIdx[id];
    if(CLOUD.ok()){ const base = CLOUD.base(); NET.put(`${base}/slots/${id}`, null).catch(()=>{}); NET.put(`${base}/idx/${id}`, null).catch(()=>{}); NET.put(`${base}/del/${id}`, Date.now()).catch(()=>{}); }
    if(id === meta.cur){ const rest = Object.keys(meta.slots); if(rest.length){ meta.cur = rest[0]; useState(readSlot(rest[0])); } else newSlot(); }
    saveMeta(); render();
  },
  slotDelNo(){ state.ui.delSlot = null; render(); },
  slotPrev(b){
    const id = b.dataset.id, old = localStorage.getItem(prevKey(id)); if(!old) return;
    if(state.ui.prevAsk !== id){ state.ui.prevAsk = id; toastMsg = "Toque de novo para voltar este jogo à versão anterior (a atual vira a cópia)."; render(); return; }
    const cur = localStorage.getItem(slotKey(id));
    try{ localStorage.setItem(slotKey(id), old); if(cur) localStorage.setItem(prevKey(id), cur); }catch(e){ return; }
    const L = meta.slots[id], ps = readSlot(id); L.n = Math.max(L.n, L.synced) + 1; L.at = Date.now(); L.days = ps && ps.world ? ps.world.days : 0;
    L.gen = Math.max(L.gen || 0, (cloudIdx[id] && cloudIdx[id].gen) || 0) + 1;     /* força esta versão sobre a mais atual, em todos os aparelhos */
    saveMeta();
    if(id === meta.cur) useState(readSlot(id));
    state.ui = {}; toastMsg = "Versão anterior restaurada."; if(CLOUD.ok()) CLOUD.push(id).catch(()=>{}); render();
  },
  async linkMake(){
    if(busy || !CLOUD.ok()) return;
    busy = true; lockButtons();
    try{
      const L = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let code = null;
      for(let i=0;i<6 && !code;i++){ const c = Array.from({length:6},()=>L[Math.floor(Math.random()*L.length)]).join(""); if(await NET.get(`links/${c}`) == null) code = c; }
      if(!code) throw 0;
      await NET.put(`links/${code}`, {p:meta.player, t:Date.now()});
      for(const id of Object.keys(meta.slots)) await CLOUD.syncSlot(id);
      state.ui.linkCode = code; toastMsg = "";
    }catch(e){ toastMsg = "Não foi possível gerar o código. Confira a internet."; }
    busy = false; render();
  },
  async linkUse(){
    if(busy || !CLOUD.ok()) return;
    const inp = $("#linkIn"), code = ((inp && inp.value) || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(code.length !== 6){ toastMsg = "O código tem 6 letras e números."; render(); return; }
    busy = true; lockButtons(); toastMsg = "Ligando...";
    try{
      const rec = await NET.get(`links/${code}`);
      if(!rec || !rec.p){ busy = false; toastMsg = "Código não encontrado. Gere um novo no outro aparelho."; render(); return; }
      if(rec.p !== meta.player){
        meta.player = rec.p;
        Object.values(meta.slots).forEach(L=>{ L.synced = -1; if(L.n < 1) L.n = 1; });   /* os jogos deste aparelho entram na conta */
        saveMeta();
      }
      NET.put(`links/${code}`, null).catch(()=>{});
      busy = false; await CLOUD.boot();
      toastMsg = "Aparelho ligado! Seus jogos aparecem em Carregar jogo salvo.";
    }catch(e){ busy = false; toastMsg = "Não foi possível ligar. Confira a internet e o código."; }
    render();
  }
};

/* ---------- layout de PC: duas colunas quando a tela é larga ---------- */
let pcTab = "ficha", pcTabOpen = true, pcLastScreen = null, pcTabReset = false;

function pcMode(){ return window.innerWidth >= 1000 && window.innerWidth >= window.innerHeight * 1.1; }
function pcFine(){ return !!(window.matchMedia && matchMedia("(pointer:fine)").matches); }
function pcKey(el){
  if(el.querySelector(".hero-head")) return "heroi";

/* partes da ficha, separadas por assunto */
function pcSideTabs(){

function pcSide(sc, mapEls){

  const keys = (sc === "world" ? ["mapa","mochila","magias","grupo"] : explore ? ["mapa","ficha","mochila","magias","grupo"] : ["ficha","mochila","magias","grupo"]).filter(k=>tabs[k].length || k === "mapa");

function pcScrollGet(){

}
function pcHint(el){
  if(!pcFine()) return;
  el.innerHTML = el.innerHTML.replace("Toque em outro monstro", "Clique em outro monstro");
  if(/pince para dar zoom/.test(el.textContent)) el.textContent = el.textContent.replace(/^Toque num hexágono vizinho para ver o terreno e viajar\./, "Clique num hexágono vizinho para viajar, ou no lugar onde você está para ver o que dá para fazer ali.").replace(/^Toque/, "Clique").replace("Arraste para mover e pince para dar zoom.", "Arraste para mover e use a roda do mouse para o zoom.");

/* botões de navegação do PC, em cima do mapa do mundo */
function pcToolHTML(sc){
  const city = worldCityHere();

function pcToolOk(sc){ return PC_TOOL[sc] && state.hero && state.world && !(state.dungeon && state.dungeon.inside) && !state.combat; }
/* balão de ações sobre o mapa do mundo */
function pcHexPopHTML(){
  const w = WD(); if(!w || w.ev) return "";
  const sel = w.sel && w.hex[w.sel] && w.sel !== w.pos ? w.sel : null;
  if(sel){
    const ct = canTravel(sel);
    return `<div class="hexpop" id="hexpop" data-k="${sel}"><span class="lbl">${esc(hexDesc(sel))}</span>${ct.ok ? `<button class="pbtn" data-act="wTravel" data-k="${sel}">Viajar para cá</button>` : `<span class="why">${esc(ct.why)}</span>${ct.charon ? `<button class="pbtn" data-act="wCharon" data-k="${sel}">Sim</button><button class="pbtn alt" data-act="wCharonNo">Não</button>` : ""}${ct.fog && (state.hero.provisions||0) >= 1 ? `<button class="pbtn" data-act="wFog" data-k="${sel}">Esperar (1 provisão)</button>` : ""}`}</div>`;
  }
  if(state.ui.wHere && state.ui.wHere === w.pos){
    const here = w.hex[w.pos], acts = [], r = here.dg && dgRec(here.dg);
    if(worldCityHere()) acts.push(`<button class="pbtn" data-act="go" data-to="city">Entrar na ${esc(locLabel(here.loc))}</button>`);
    if(here.dg && !(r && r.complete)) acts.push(`<button class="pbtn" data-act="wEnterDg">${dgEnterLabel(here.dg, r)}</button>`);
    if(!here.dg && here.loc){ const t = here.loc.k === "fort" ? 12 : here.loc.k === "volcano" ? 15 : here.loc.k === "corals" && here.cave ? 16 : 0; if(t) acts.push(`<button class="pbtn" data-act="wCaveIn" data-t="${t}">${t === 12 ? "Descer aos esgotos" : t === 15 ? "Entrar na Caverna Vulcânica" : "Entrar na Caverna Aquática"}</button>`); }

    if(!acts.length) return "";
    return `<div class="hexpop" id="hexpop" data-k="${w.pos}" data-here="1"><span class="lbl">${esc(here.dg && !here.loc ? here.dg.name : hexDesc(w.pos).split(" · ")[0])}</span>${acts.join("")}</div>`;

function placeHexPop(cv){
  const pop = document.getElementById("hexpop"); if(!pop) return;
  const k = pop.dataset.k, p = hexPx(k), z = wcam.z, W = cv.clientWidth, H = cv.clientHeight;
  /* o balão fica do lado oposto ao aventureiro, para não cobri-lo */
  const below = !pop.dataset.here && hexPx(WD().pos).y < p.y;
  const sx = (p.x - wcam.x)*z + W/2, sy = (p.y + (below ? 30 : (pop.dataset.here ? -22 : -12)) - wcam.y)*z + H/2;
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.round(sx - pw/2), top = Math.round(below ? sy : sy - ph);
  left = Math.max(6, Math.min(W - pw - 54, left)); top = Math.max(50, Math.min(H - ph - 6, top));
  pop.style.transform = `translate(${left}px, ${top}px)`;
}
function pcLayout(sc, saved){
  const app = $("#app"), root = document.documentElement;
  const on = pcMode();
  root.classList.toggle("pc", on);
  root.classList.remove("pcfix");
  app.className = "";
  const same = saved && saved.sc === sc && !pcTabReset;
  pcLastScreen = sc; pcTabReset = false;
  if(!on) return;
  const kids = [...app.children].filter(el=>!el.classList.contains("lastbox"));
  const bar = kids.find(el=>el.classList.contains("bar"));
  const tool = pcToolOk(sc) ? Object.assign(document.createElement("div"), {className:"pctool", innerHTML:pcToolHTML(sc)}) : null;
  if(PC_VIS[sc] && kids.some(el=>el.classList.contains("mapbox") || el.id === "arena")){
    app.classList.add("pcv", "pcv-" + sc); root.classList.add("pcfix");
    const L = document.createElement("div"); L.className = "pcL pc-" + sc;
    const R = document.createElement("div"); R.className = "pcR";
    const firstSheet = kids.findIndex(el=>el.classList.contains("sheet"));
    const isHint = el => el.tagName === "P" && /pince para dar zoom/.test(el.textContent);
    kids.forEach((el, i)=>{
      if(el === bar) return;
      const left = sc === "combat" ? (firstSheet < 0 || i < firstSheet) : (el.classList.contains("mapbox") || el.id === "etray" || isHint(el));
      if(isHint(el)) pcHint(el);
      (left ? L : R).appendChild(el);
    });
    const hint = [...L.children].find(el=>el.tagName === "P" && /dar zoom|roda do mouse/.test(el.textContent));
    if(hint) L.appendChild(hint);
    if(tool) L.prepend(tool);
    if(sc === "world"){
      if(bar){ const bk = bar.querySelector(".back"); if(bk){ bk.dataset.to = "title"; bk.setAttribute("aria-label", "Menu inicial"); } }
      const mb = L.querySelector(".mapbox"); if(mb) mb.insertAdjacentHTML("beforeend", pcHexPopHTML());
      /* eventos e avisos ficam sempre à vista; o resto vai para a aba Mapa */
      const urgent = [], mapEls = [];
      [...R.children].forEach(el=>{ (el.classList.contains("banner") || el.querySelector("[data-act=wFight],[data-act=wClimate]") ? urgent : mapEls).push(el); });
      const side = pcSide(sc, mapEls);
      R.innerHTML = ""; urgent.forEach(el=>R.appendChild(el)); if(side) R.appendChild(side);
    } else if(sc === "explore"){
      /* dentro da masmorra: as opções do mapa e o diário ficam na aba "Opções do Mapa", antes da Ficha */
      if(!saved || saved.sc !== "explore") pcTab = "mapa";
      const urgent = [], mapEls = [];
      [...R.children].forEach(el=>{ (el.classList.contains("banner") || el.classList.contains("toast") ? urgent : mapEls).push(el); });
      if(mapEls.some(el=>el.querySelector && el.querySelector("[data-act=confirmPick]"))) pcTab = "mapa";
      const side = pcSide(sc, mapEls);
      R.innerHTML = ""; urgent.forEach(el=>R.appendChild(el)); if(side) R.appendChild(side);
    } else {
      const side = pcSide(sc, []);
      if(side){ if(sc === "combat") R.appendChild(side); else R.prepend(side); }
      if(sc === "combat") R.querySelectorAll("p.small, p.muted").forEach(pcHint);
    }
    if(bar) app.insertBefore(bar, app.firstChild);
    app.insertBefore(L, bar ? bar.nextSibling : app.firstChild);
    app.insertBefore(R, L.nextSibling);
    if(same){ const pb = R.querySelector(".pcbody"); if(pb) pb.scrollTop = saved.b; R.scrollTop = saved.r; }
    return;
  }
  if(PC_COLS[sc]){
    app.classList.add("pcc");
    if(tool){
      /* a navegação do topo substitui os botões de ir para a cidade e o mapa */
      for(const el of kids){ if(el.classList.contains("sheet") || el.classList.contains("banner")) break; if(el !== bar && el.querySelector && el.querySelector("[data-to=world]") && !el.classList.contains("bar")) el.remove(); }
      if(bar) bar.after(tool); else app.prepend(tool);
    }
    const rest0 = [...app.children].filter(el=>!el.classList.contains("lastbox"));
    const mem = PC_MEM[sc] || (PC_MEM[sc] = {});
    const A = document.createElement("div"); A.className = "pcA";
    const B = document.createElement("div"); B.className = "pcB";
    let i = 0;
    while(i < rest0.length && !rest0[i].classList.contains("sheet") && !rest0[i].classList.contains("banner")) i++;
    const rest = rest0.slice(i);
    app.insertBefore(A, rest[0] || null); app.insertBefore(B, A.nextSibling);
    rest.forEach(el=>{
      const k = pcKey(el);
      let side = mem[k];
      if(side == null){ side = A.offsetHeight <= B.offsetHeight ? 0 : 1; mem[k] = side; }
      (side ? B : A).appendChild(el);
    });
  }
}
